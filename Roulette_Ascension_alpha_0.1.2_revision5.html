<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roulette Ascension α0.1.2</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#eef1f4; --text:#222; --muted:#707780;
  --border:#cfd5db; --accent:#6f7cff; --danger:#d95757; --good:#54a86a;
  --pt:#808080; --exp:#c0ffc0; --lv:#80ff80; --rank:#c0c040; --psp:#8080ff;
  --token:#c00080; --ticket:#ffe666; --lk:#2e9949;
}
html.dark{
  --bg:#11151a; --panel:#1b2128; --panel2:#242c35; --text:#e7ebef; --muted:#a3acb5;
  --border:#3d4650; --accent:#9ba4ff; --danger:#ef7777; --good:#6cc785;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top{max-width:1450px;margin:auto;padding:10px 14px;display:flex;gap:14px;align-items:center}
.logo{font-weight:800;white-space:nowrap}
#stats{display:flex;flex-wrap:wrap;gap:7px;flex:1}
.res{padding:5px 8px;border:1px solid var(--border);border-radius:9px;background:var(--panel2);font-size:13px}
.res b{font-variant-numeric:tabular-nums}
.rPt{color:var(--pt)} .rExp{color:#49a449}.rLv{color:#2b8f2b}.rRank{color:#908d26}
.rPsP{color:var(--psp)} .rToken{color:var(--token)} .rTicket{color:#9c8300}.rLk{color:var(--lk)}
main{max-width:1450px;margin:auto;padding:16px 16px 140px}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:10px;position:sticky;top:58px;background:var(--bg);z-index:10}
.tabbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:10px;white-space:nowrap}
.tabbtn.active{background:var(--accent);color:white;border-color:var(--accent)}
.tabbtn.new-highlight:not(.active){background:color-mix(in srgb,var(--accent) 20%,var(--panel));border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);font-weight:800}
.tabbtn.active.new-highlight{box-shadow:0 0 0 2px var(--good)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2,.panel h3{margin:0 0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.small{font-size:12px;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,.input{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 10px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.good{background:var(--good);border-color:var(--good);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
input[type="number"],input[type="text"],select{padding:7px 9px;min-width:100px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--border);padding:8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px}
.locked{opacity:.55}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid #777;font-size:11px;font-weight:700}
.slice-name{font-weight:700}
#rouletteWrap{display:flex;justify-content:center;align-items:center;min-height:420px;position:relative}
canvas{display:block;max-width:100%}
.wheelBox{width:min(610px,90vw);aspect-ratio:1;position:relative}
#wheel{width:100%;height:100%}
#wheelPointer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:27px solid var(--text);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.centerBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:118px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.boostList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.boost{padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:var(--panel2)}
.progress{height:12px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);transition:width .15s linear}
.level-progress{display:grid;gap:6px;margin:10px 0 14px}.level-progress-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.level-progress .progress{height:14px}.cooldown-shortcut{margin-top:9px}
.toastBox{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:100}
.toast{padding:9px 12px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 5px 18px rgba(0,0,0,.12);font-size:13px}
.note{padding:9px 11px;background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px}
.tree{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px;align-items:start}
.nodeCol{display:flex;flex-direction:column;gap:10px}
.node{border:2px solid var(--border);border-radius:12px;padding:11px;background:var(--panel2);position:relative}
.node.bought{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--panel2))}
.node.hidden{opacity:.18}
.node .cost{color:var(--token);font-weight:700}
.node small{display:block;color:var(--muted);margin-top:4px}
.challenge-time-fill{background:#f1c40f!important;transition:width .15s linear}.challenge-time-fill.critical{background:#e33!important;animation:challenge-warning .55s steps(2,end) infinite}@keyframes challenge-warning{50%{opacity:.25}}
.tree-loadouts{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:10px 0}.tree-loadout-active{border-color:var(--accent)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.challengeBar{position:fixed;left:14px;bottom:14px;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 11px;box-shadow:0 5px 18px rgba(0,0,0,.12);width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 120px);overflow:auto}.challenge-goal{margin-top:7px}.challenge-goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}.challenge-goal-head span{color:var(--muted)}.challenge-goal .progress{height:9px;margin-top:4px}
.treeSvgWrap{width:100%;height:700px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px}.rank-achieved{background:color-mix(in srgb,var(--good) 14%,var(--panel))}.rank-upcoming{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}.spinResult{min-height:54px}.bingo-wrap{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.bingo-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bingo-board{border-collapse:separate;border-spacing:6px;margin:8px auto 14px;width:min(100%,360px);table-layout:fixed}.bingo-board td{position:relative;height:70px;text-align:center;vertical-align:middle;border:2px solid var(--border);border-radius:9px;background:var(--panel2);font-size:20px;font-weight:800;overflow:hidden}.bingo-board td.is-hit{background:rgba(58,190,115,.22);border-color:#32b768}.bingo-hole{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:46px;color:#32b768;opacity:.75}.bingo-board td.is-hit .bingo-hole{display:flex}.bingo-ball-stage{min-height:110px;display:flex;align-items:center;justify-content:center;margin:10px 0}.bingo-ball{width:92px;height:92px;border-radius:50%;background:var(--ball,#fff);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.24),0 3px 9px rgba(0,0,0,.18)}.bingo-ball::before{content:"";position:absolute;width:65%;height:65%;left:17.5%;top:17.5%;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.18)}.bingo-ball-number{position:relative;z-index:1;color:#111;font-size:28px;font-weight:900}.bingo-history{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.bingo-history-item{border:1px solid var(--border);border-radius:8px;padding:4px 7px;font-size:13px}.bingo-board td>span:first-child{position:relative;z-index:1}.bingo-hole{z-index:2;pointer-events:none}.bingo-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.bingo-result{padding:10px;border-radius:8px;margin-top:10px;background:rgba(58,190,115,.12)}.bingo-ball.is-spinning{animation:bingo-pulse .28s ease-in-out infinite}@keyframes bingo-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.dice-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}.die-choice{display:flex;flex-direction:column;align-items:center;gap:4px}.die{font-size:54px;line-height:1.15;width:76px;height:76px;display:grid;place-items:center;border:2px solid var(--border);border-radius:12px;background:var(--panel2);box-shadow:0 3px 7px rgba(0,0,0,.12)}.die-face{width:52px;height:52px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:5px;box-sizing:border-box;background:#fff;border-radius:8px}.pip{width:100%;height:100%;max-width:11px;max-height:11px;border-radius:50%;background:#19202a;justify-self:center;align-self:center}.die-choice input{margin-right:4px}.die.roll{animation:dice-roll .12s infinite alternate}@keyframes dice-roll{from{transform:translateY(-4px) rotate(-7deg)}to{transform:translateY(4px) rotate(7deg)}}
.playing-card{width:54px;height:78px;border:2px solid #bbb;border-radius:8px;background:#fff;color:#171717;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 2px 5px rgba(0,0,0,.12)}.playing-card.red{color:#c33}.card-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.treeDetails{margin-top:12px}
.resetFx{animation:resetFx .45s ease-out forwards}
@keyframes resetFx{0%{opacity:0;transform:scale(.96)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}
details summary{cursor:pointer;font-weight:700}
.kbd{padding:2px 6px;border:1px solid var(--border);border-radius:5px;background:var(--panel2);font-family:monospace}
@media(max-width:760px){
  .tabs{top:0;position:relative}
  header{position:relative}
  main{padding:10px 10px 140px}
  .top{align-items:flex-start;flex-direction:column}
  #stats{width:100%}
}

/* ===== 読みやすいUI用の追加スタイル ===== */
.dynamicText{font-variant-numeric:tabular-nums}
.buy-preview{font-size:12px;color:var(--muted)}
.rank-achieved{background:color-mix(in srgb,var(--good) 16%,var(--panel));font-weight:700}
.rank-upcoming{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.rank-locked{opacity:.35}
.layer-title{margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.game-choice{border:2px solid var(--border);padding:12px;border-radius:12px;background:var(--panel2);min-width:220px}
.game-choice.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.game-choice h3{margin:0 0 7px}
.playing-card{width:58px;height:84px;border:2px solid #aaa;border-radius:9px;background:#fff;color:#171717;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.playing-card.red{color:#c33}
.card-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.mini-result{margin-top:10px}
.treeSvgWrap{width:100%;height:700px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px}
.treeSvgWrap svg{min-width:0;width:auto;max-width:none;height:auto;display:block;margin:0 auto}
.tree-node{cursor:pointer}
.tree-node:focus{outline:none}
.node-label{pointer-events:none}
.tree-details{margin-top:12px}
.reserved-challenge{margin-top:9px}
.luck-table td:first-child{white-space:nowrap}
.achievements-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.achievement-card .progress>div{min-width:0}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Roulette Ascension <span class="small">α0.1.2</span></div>
    <div id="stats"></div>
  </div>
</header>
<main>
  <div id="tabs" class="tabs"></div>
  <section id="content"></section>
</main>
<div id="toastBox" class="toastBox"></div>
<div id="challengeBar" class="challengeBar" style="display:none"></div>

<script>
'use strict';

/*
 * Roulette Ascension α0.1.2
 *
 * このスクリプトは「ゲーム状態」「計算」「画面表示」「入力処理」を分離してあります。
 * 主要処理には目的と処理内容をコメントで残しているため、後から手直しするときは同じ区画を探してください。
 */

const VERSION = "α0.1.2";

// 【目的】レアリティごとの色、ショップ出現比、通常のPt/Exp基礎獲得量をまとめて管理します。
// 【処理】スライスのレアリティを参照すると、同じ場所から表示色・抽選比・基礎倍率を取得できます。
const RARITY = {
  Common:{c:"#c0c0c0",w:2,yield:5},
  Uncommon:{c:"#40ff40",w:1,yield:7.5},
  Rare:{c:"#40c0ff",w:.5,yield:10},
  Epic:{c:"#c080c0",w:.3,yield:20},
  Legendary:{c:"#ff8040",w:.1,yield:50},
  Mythical:{c:"#ff4040",w:.04,yield:100}
};
const TAGS=["Pt","Exp","En","スイッチ","PsP","ブースト","コンボ","クールタイム","Ticket","Lk"];

// 【目的】ゲーム内に存在するすべてのスライスを一元管理します。
// 【処理】名前・レアリティ・最大Lv・Tag・効果タイプをIDから参照できるようにします。
const SLICES={
  pt_small:{name:"ポイント小",rarity:"Common",max:Infinity,tag:["Pt"],type:"ptSmall",effect:"Ptを少量獲得"},
  exp_small:{name:"経験値小",rarity:"Common",max:Infinity,tag:["Exp"],type:"expSmall",effect:"Expを少量獲得"},
  mix:{name:"ミックス",rarity:"Uncommon",max:Infinity,tag:["Pt","Exp"],type:"mix",effect:"PtとExpを少量獲得"},
  pt_medium:{name:"ポイント中",rarity:"Uncommon",max:Infinity,tag:["Pt"],type:"ptMedium",effect:"Pt獲得。連続選出で徐々に衰退"},
  exp_medium:{name:"経験値中",rarity:"Uncommon",max:Infinity,tag:["Exp"],type:"expMedium",effect:"Exp獲得。連続選出で徐々に衰退"},
  pt_random:{name:"ポイントランダム",rarity:"Rare",max:Infinity,tag:["Pt"],type:"ptRandom",effect:"Pt獲得量±50%"},
  exp_random:{name:"Expランダムスライス",rarity:"Rare",max:Infinity,tag:["Exp"],type:"expRandom",effect:"Exp獲得量±50%"},
  random_all:{name:"ランダム",rarity:"Epic",max:Infinity,tag:["Pt","Exp","ブースト","PsP","Ticket"],type:"randomAll",effect:"Pt中 / Exp中 / ブースト / PsP小 / Ticketから抽選"},
  psp_small:{name:"PsP小",rarity:"Epic",max:Infinity,tag:["PsP"],type:"pspSmall",effect:"NextPsPが少し増える"},
  energy_charge:{name:"エネルギー充填",rarity:"Uncommon",max:16,tag:["En"],type:"energyCharge",effect:"Enを充填。超過分は次回ブースト"},
  energy_pt:{name:"エネルギーPt",rarity:"Rare",max:Infinity,tag:["En","Pt"],type:"energyPt",effect:"Enの半分を使ってPt獲得"},
  energy_exp:{name:"エネルギーExp",rarity:"Rare",max:Infinity,tag:["En","Exp"],type:"energyExp",effect:"Enの半分を使ってExp獲得"},
  energy_chance:{name:"エネルギーチャンス",rarity:"Epic",max:Infinity,tag:["En","PsP"],type:"energyChance",effect:"En%でNextPsP中。Enは最大100減少"},
  charged:{name:"帯電",rarity:"Epic",max:6,tag:["En"],type:"charged",effect:"En20消費。左右スライスを次回強化"},
  discharge:{name:"放電",rarity:"Epic",max:11,tag:["En","ブースト"],type:"discharge",effect:"En全消費。次3回を強化"},
  switch_pt:{name:"スイッチPt",rarity:"Rare",max:Infinity,tag:["スイッチ","Pt"],type:"switchPt",effect:"ONならPt大。OFFならPt小"},
  switch_exp:{name:"スイッチExp",rarity:"Rare",max:Infinity,tag:["スイッチ","Exp"],type:"switchExp",effect:"ONならExp大。OFFならPt小"},
  switch_boost:{name:"スイッチブースト",rarity:"Epic",max:6,tag:["スイッチ","ブースト"],type:"switchBoost",effect:"ONなら次3回を強化"},
  switch:{name:"スイッチ",rarity:"Uncommon",max:1,tag:["スイッチ"],type:"switch",effect:"スイッチ系スライスを有効化"},
  respin:{name:"リスピン",rarity:"Rare",max:21,tag:["コンボ","クールタイム"],type:"respin",effect:"もう一回回す。次のスライスを強化"},
  energy_small:{name:"エネルギー小",rarity:"Common",max:15,tag:["En"],type:"energySmall",effect:"En +2×(Lv+1)。上限超過分は消失"},
  mini_boost:{name:"ミニブースト",rarity:"Common",max:10,tag:["ブースト"],type:"miniBoost",effect:"2回のブースト（×1.45+0.05×Lv）"},
  combo_continue:{name:"コンボ継続",rarity:"Common",max:1,tag:["コンボ"],type:"comboContinue",effect:"コンボ回数だけ+1"},
  cooldown_shorten:{name:"クールタイム短縮",rarity:"Common",max:5,tag:["クールタイム"],type:"cooldownShorten",effect:"スピン回復タイマーを(30+3×Lv)%短縮"},
  quick_point:{name:"クイックポイント",rarity:"Uncommon",max:Infinity,tag:["Pt","クールタイム"],type:"quickPoint",effect:"Ptを少量獲得し、残りクールタイムを50%短縮"},
  quick_exp:{name:"クイック経験値",rarity:"Uncommon",max:Infinity,tag:["Exp","クールタイム"],type:"quickExp",effect:"Expを少量獲得し、残りクールタイムを50%短縮"},
  dupe:{name:"デュープ",rarity:"Mythical",max:Infinity,tag:["コンボ","クールタイム","ブースト"],type:"dupe",effect:"自身を除き、直前のスライスを2回即座に発動"},
  level_up:{name:"レベルアップ",rarity:"Mythical",max:1,tag:["Pt"],type:"levelUp",effect:"現在のPt以下の強化コストの装備スライスを、無料で1Lv強化"},
  prestige_point:{name:"プレステージポイント",rarity:"Mythical",max:Infinity,tag:["PsP"],type:"prestigePoint",effect:"NextPsP +7×1.04^(Lv-1)"},
  pt_burst:{name:"Ptバースト",rarity:"Legendary",max:Infinity,tag:["Pt"],type:"ptBurst",effect:"Pt大。その後消滅"},
  exp_burst:{name:"Expバースト",rarity:"Legendary",max:Infinity,tag:["Exp"],type:"expBurst",effect:"Exp大。その後消滅"},
  long_boost:{name:"ロングブースト",rarity:"Rare",max:21,tag:["ブースト"],type:"longBoost",effect:"次5回を強化"},
  boost:{name:"ブースト",rarity:"Epic",max:21,tag:["ブースト"],type:"boost",effect:"次3回を強化"},
  short_boost:{name:"ショートブースト",rarity:"Legendary",max:21,tag:["ブースト"],type:"shortBoost",effect:"次2回を強化"},
  royal_card:{name:"ロイヤルカード",rarity:"Legendary",max:Infinity,tag:["Pt","Exp","ブースト"],type:"royalCard",effect:"Pt/Exp大 + 2回2倍ブースト"},
  pt_combo:{name:"Ptコンボ",rarity:"Uncommon",max:Infinity,tag:["コンボ","Pt"],type:"ptCombo",effect:"Pt小 + コンボ+1"},
  exp_combo:{name:"Expコンボ",rarity:"Uncommon",max:Infinity,tag:["コンボ","Exp"],type:"expCombo",effect:"Exp小 + コンボ+1"},
  ticket:{name:"チケット",rarity:"Epic",max:Infinity,tag:["Ticket"],type:"ticket",effect:"TicketをLv枚獲得"},
  luck:{name:"ラック",rarity:"Epic",max:Infinity,tag:["Lk"],type:"luck",effect:"Lkを2×(Lv+1)獲得"}
};
const INITIAL_SLICES=["pt_small","exp_small"];

// 【目的】ショップの各種アップグレードの定義をまとめます。
// 【処理】現在Lvと次Lvの表示、コスト計算、最大Lv判定を同じ定義から行います。
const baseUpgrades=[
 {id:"ptGain",name:"獲得ポイント上昇",desc:l=>`獲得Pt ×${fmt(1+.1*l)}`,next:l=>`次: ×${fmt(1+.1*(l+1))}`,cost:l=>10*Math.pow(1.15,l)},

// 【目的】チャレンジのレベル別の係数を読みやすく表示します。
// 【処理】小数第2位までに整え、末尾の不要な0を取り除きます。
function challengeExponent(n){return Number(n.toFixed(2)).toString()}
// 【目的】クリア済みレベル数と次回挑戦レベルを共通管理します。
// 【処理】各チャレンジの進行を0～5の整数に制限し、初回はLv1、Lv5クリア後は最大達成とします。
function challengeCompletedLevels(id){return Math.max(0,Math.min(5,Math.floor(Number(state.challengeProgress?.[id])||0)))}
function challengeLevel(id){return Math.min(5,challengeCompletedLevels(id)+1)}
function activeChallengeLevel(id){return state.challenge?.id===id?Math.max(1,Math.min(5,Number(state.challenge.level)||challengeLevel(id))):challengeLevel(id)}
function challengeMaxed(id){return challengeCompletedLevels(id)>=5}
function challengeInfo(c,level=challengeLevel(c.id)){return {handicap:typeof c.handicap==='function'?c.handicap(level):c.handicap,goal:typeof c.goal==='function'?c.goal(level):c.goal,bonus:typeof c.bonus==='function'?c.bonus(level):c.bonus}}
function challengeCurrentBonus(c){const cleared=challengeCompletedLevels(c.id);return cleared>0?challengeInfo(c,cleared).bonus:'なし（未クリア）'}
function challengeNextBonus(c){const cleared=challengeCompletedLevels(c.id);return cleared>=5?'最大レベル達成':challengeInfo(c,cleared+1).bonus}

// 【目的】桁数が大きく伸びる目標の進捗を、対数目盛りのゲージへ変換します。
// 【処理】前の目標値を基準に log(現在値/前の目標値 + 1) / log(次の目標値/前の目標値 + 1) を計算し、0～100%へ収めます。

// 【目的】数値を設定に応じた短縮表記へ変換します。
// 【処理】ユーザー指定のShort表記ルールを使い、必要なら科学表記・工学表記にも切り替えます。
function fmt(n){
  n=Number(n);
  if(!Number.isFinite(n))return n===Infinity?"∞":"0";
  if(Math.abs(n)<1000)return Number(n.toFixed(3)).toString();
  const mode=Number(state.settings.numberFormat)||5;
  if(mode===5)return n.toExponential(2).replace("e+","e");
  if(mode===6){const e=Math.floor(Math.log10(Math.abs(n))/3)*3;return `${(n/Math.pow(10,e)).toFixed(2)}e${e}`}
  if(mode>=1&&mode<=3)return short(n,mode===1?12:mode===2?30:303);
  if(mode===4){
    const e=Math.floor(Math.log10(Math.abs(n))/3)*3,idx=e/3;
    if(idx<1)return n.toPrecision(3);
    let x=idx,s="";
    while(x>0){x--;s=String.fromCharCode(97+x%26)+s;x=Math.floor(x/26)}
    return `${(n/Math.pow(1000,idx)).toPrecision(3)}${s}`;
  }
  return n.toPrecision(3);
}

// 【目的】Short形式の単位を変換します。
// 【処理】K/M/B/TからNo以降の2文字単位まで、指定された添字計算で生成します。
function short(n,maxE){
  const e=Math.floor(Math.log10(Math.abs(n))/3)*3;
  if(e<3)return n.toFixed(0);
  if(e>maxE)return n.toExponential(2);
  const names={1:"K",2:"M",3:"B",4:"T",5:"Qa",6:"Qi",7:"Sx",8:"Sp",9:"Oc",10:"No"};
  const idx=e/3;
  if(names[idx])return `${(n/Math.pow(10,e)).toPrecision(3)}${names[idx]}`;
  const a=["","U","D","T","Q","Qi","S","Sp","O","N"][(idx-1)%10]||"";
  const b=["","De","Vi","Tr","Qd","Qu","Sg","St","Og","Ng"][Math.floor((idx-1)/10)]||"";
  return `${(n/Math.pow(10,e)).toPrecision(3)}${a}${b}`;
}

// 【目的】プレイヤーが入力したTicket数を数値へ変換します。
// 【処理】通常の数値、5e4、50.0e3、1.5K、1.5kなどを内部数値に変換しますが、入力欄の文字列自体は変更しません。
function parseAmount(value){
  const raw=String(value??"").trim();
  if(!raw)return 0;
  const direct=Number(raw);
  if(Number.isFinite(direct))return direct;
  const m=raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?)\s*([a-zA-Z]+)$/i);
  if(!m)return 0;
  const base=Number(m[1]);if(!Number.isFinite(base))return 0;
  const units={k:1,m:2,b:3,t:4,qa:5,qi:6,sx:7,sp:8,oc:9,no:10};
  const unit=units[m[2].toLowerCase()];
  if(unit==null)return 0;
  return base*Math.pow(1000,unit);
}

// 【目的】レベルアップに必要なExpを返します。
// 【処理】現在Lvに応じた必要Expを計算し、Expバーやデバッグ・Lvアップ処理で共有します。
// 【目的】Lvの一の位が9の必要Exp倍率を、以降10Lvごとに×1.5へ切り替えます。
// 【処理】Lv9→10、19→20、29→30…でのみ段階倍率を増加させます。
function expReq(lv){const level=Math.max(1,Math.floor(Number(lv)||1));return 20*Math.pow(1.1,level-1)*Math.pow(1.5,Math.floor((level+1)/10))}
function dimensionEnergyCapBonus(){const ds=Math.max(0,Number(state.dimensionScore)||0);return Math.max(0,Math.min(Math.pow(ds/2000,.5),100))}
function dimensionEnGainMultiplier(){const ds=Math.max(0,Number(state.dimensionScore)||0);return Math.max(1,Math.min(Math.pow(ds/10000,.1),1.5))}
function dimensionPtExpMultiplier(){return Math.max(Math.sqrt(Math.max(0,Number(state.dimensionScore)||0)),1)}
function dimensionPspMultiplier(){const ds=Math.max(0,Number(state.dimensionScore)||0);return Math.max(Math.pow(ds/500,.25),1)}
function dimensionLkMultiplier(){const ds=Math.max(0,Number(state.dimensionScore)||0);return Math.max(Math.pow(ds/1000,.25),1)}
function dimensionTicketMultiplier(){const ds=Math.max(0,Number(state.dimensionScore)||0);return Math.max(Math.pow(ds/5000,.15),1)}
function dimensionOtherScoreMultiplier(){return (hasTree("16-4")?2:1)*(1+challengeCompletedLevels(104))}
function calculateDimensionScore(){const pt=Math.max(0,Number(state.pt)||0),rank=Math.max(0,Number(state.rank)||0),psp=Math.max(0,Number(state.psp)||0);const value=Math.log10(pt/1e30+1)*Math.max(rank-29,0)*Math.log10(psp/1e10+1)*dimensionOtherScoreMultiplier();return Number.isFinite(value)?Math.max(0,value):0}
function maxEnergy(){return 50+5*(state.baseUpgrades.energyMax||0)+dimensionEnergyCapBonus()}

function dimensionBonusRowsHtml(){
  const ds=Math.max(0,Number(state.dimensionScore)||0);
  const rows=[
    {name:"Pt・Exp獲得倍率",threshold:0,value:`×${fmt(dimensionPtExpMultiplier())}`},
    {name:"PsP獲得倍率",threshold:500,value:`×${fmt(dimensionPspMultiplier())}`},
    {name:"Lk獲得倍率",threshold:1000,value:`×${fmt(dimensionLkMultiplier())}`},
    {name:"En上限加算",threshold:2000,value:`+${fmt(dimensionEnergyCapBonus())}`},
    {name:"Ticket獲得倍率",threshold:5000,value:`×${fmt(dimensionTicketMultiplier())}`},
    {name:"En獲得倍率",threshold:10000,value:`×${fmt(dimensionEnGainMultiplier())}`}
  ];
  const next=rows.findIndex((r,i)=>i>0&&ds<r.threshold),last=next>=0?next:rows.length-1;
  return `<ul class="dimension-bonus-list">${rows.slice(0,last+1).map(r=>`<li class="${ds>=r.threshold?'rank-achieved':'rank-upcoming'}"><b>${r.name}</b>: ${r.value}${ds<r.threshold?` <span class="small">（DS ${fmt(r.threshold)}以上で有効）</span>`:""}</li>`).join("")}</ul>`;
}

// 【目的】スピン回復の待ち時間を返します。
// 【処理】基礎能力、PsP強化、ツリー、チャレンジによる短縮・延長をまとめて計算します。
function spinCooldown(){
  if(state.debugCheats?.zeroCooldown)return 0;
  let c=15*Math.pow(.95,state.baseUpgrades.cooldown||0)*Math.pow(.93,state.prestigeUpgrades.prestigeCd||0);
  if(hasTree("4-2"))c*=.75;
  if(isChallenge(3))c*=(4+activeChallengeLevel(3));
  const weakenedLevel=challengeCompletedLevels(102);
  if(weakenedLevel>0)c*=Math.max(.1,1-(25+5*weakenedLevel)/100);
  return c;
}

// 【目的】現在の最大スピン所持数を返します。
// 【処理】PsP強化とチャレンジ#3の制限を反映し、常に1以上を返します。
function spinMax(){let m=3+(state.prestigeUpgrades.spinCap||0);if(isChallenge(3))m=Math.max(1,Math.floor(m*.2));return m}
function levelPtMult(){return isChallenge(1)?1:1+.05*(state.lv-1)}
function rankMult(){return Math.pow(1.5,state.rank)}
function prestigePtMult(){return Math.sqrt(1+3*state.prestiges)}
function rankBonusX(){return state.rank>=20?state.stats.maxPtAscension:state.rank>=7?state.stats.maxPtPrestige:state.pt}

// 【目的】ツリーによるPt倍率を返します。
// 【処理】Pt関連ノードと時空加速Iの現在効果をまとめて倍率へ反映します。
function timeAccelI(){return 1+Math.log10(1+Math.max(0,elapsed("rebirth"))/1000)}
function timeAccelII(){return 1+Math.log10(1+Math.max(0,elapsed("prestige"))/1000)}
function treePtMult(){let m=1;if(hasTree("1"))m*=10;if(hasTree("2-1"))m*=3;if(hasTree("5-1"))m*=2;if(hasTree("12-1"))m*=2;if(hasTree("16-3"))m*=4;if(hasTree("4-1"))m*=timeAccelI();if(hasTree("10-2"))m*=1+.03*Object.values(state.achievements?.unlocked||{}).filter(Boolean).length;return m}
function treeExpMult(){let m=1;if(hasTree("1"))m*=5;if(hasTree("2-2"))m*=3;if(hasTree("5-3"))m*=2;if(hasTree("12-4"))m*=2;if(hasTree("17-3"))m*=4;if(hasTree("7-1"))m*=timeAccelII();if(hasTree("10-2"))m*=1+.03*Object.values(state.achievements?.unlocked||{}).filter(Boolean).length;return m}
function rank2BonusMultiplier(){return 1+Math.log10(1+Math.max(0,rankBonusX()))/4}
function basePtMultiplier(){let m=(1+.1*(state.baseUpgrades.ptGain||0))*Math.pow(1.05,Number(state.prestigeUpgrades.ptPrestige)||0);if(state.rank>=2)m*=rank2BonusMultiplier();m*=levelPtMult()*rankMult()*prestigePtMult()*treePtMult()*dimensionPtExpMultiplier();if(hasTree("14-1"))m*=1+.2*Math.max(state.rank-44,0);if(hasTree("16-3"))m*=4;m*=1+.5*challengeCompletedLevels(105);m*=achievementMultiplier("points")*achievementMultiplier("spins")*achievementMultiplier("challenges");return m}
function baseExpMultiplier(){let m=1+(isChallenge(2)?0:.1*(state.baseUpgrades.expGain||0));m*=Math.pow(1.05,state.prestigeUpgrades.expPrestige||0)*rankMult()*treeExpMult()*dimensionPtExpMultiplier();if(state.rank>=1)m*=3;m*=1+Math.max((state.rank-4)*.2,0);if(hasTree("14-1"))m*=1+Math.max(state.lv-599,0)*.05;m*=1+.5*challengeCompletedLevels(105);m*=achievementMultiplier("experience")*achievementMultiplier("rank")*achievementMultiplier("tokens")*achievementMultiplier("challenges");return m}
function pspMultiplier(){let m=dimensionPspMultiplier();if(state.rank>=8)m*=1+Math.max((state.rank-7)*.2,0);const p4=challengeCompletedLevels(4),a1=challengeCompletedLevels(101);if(p4>0)m*=1+p4;if(a1>0)m*=1+2*a1;m*=1+.5*challengeCompletedLevels(105);m*=achievementMultiplier("prestigePoints")*achievementMultiplier("prestigeCount");return m}
function prestigePspGain(){let raw=Math.max(0,(Number(state.nextPsp)||0)*pspMultiplier());if(isChallenge(101))raw=Math.pow(raw,.55-.05*activeChallengeLevel(101));if(isChallenge(106))raw=Math.pow(raw,.12-.02*activeChallengeLevel(106));return raw}
function ticketMultiplier(){let m=(hasTree("10-1")?2:1)*(hasTree("17-1")?3:1)*dimensionTicketMultiplier();m*=1+.05*(Number(state.prestigeUpgrades.ticketGain)||0);const p5=challengeCompletedLevels(5);if(p5>0)m*=1+p5;m*=achievementMultiplier("tickets");return m}
function lkMultiplier(){let m=(state.rank>=25?1+.1*(state.rank-24):1)*dimensionLkMultiplier()*achievementMultiplier("luck");m*=1+.05*(Number(state.baseUpgrades.lkGain)||0);m*=1+2*challengeCompletedLevels(103);return m}
function elapsed(layer){return Date.now()-Number(state.period[layer]?.start||Date.now())}
function hasTree(id){return !!state.tree[String(id)]}
function isChallenge(id){return state.challenge?.id===id}

// 【目的】対象タブとガイド項目を永続解放します。
// 【処理】一度条件を達成したら、リセットで現在値が下がっても解放状態を維持します。
function markTabHighlight(id){
  if(!state.tabHighlights)state.tabHighlights={};
  state.tabHighlights[id]=true;
}
function unlockTabIf(id,condition){
  if(condition&&!state.unlockedTabs[id]){state.unlockedTabs[id]=true;markTabHighlight(id)}
}
function unlockGuideIf(id,condition){
  if(condition&&!state.guideUnlocks[id]){state.guideUnlocks[id]=true;markTabHighlight("guide")}
}
function refreshUnlocks(){
  if(hasTree("14-1")&&Number(state.rank)>=50){state.challengeUnlocks=state.challengeUnlocks||{};state.challengeUnlocks[6]=true;}
  unlockTabIf("shop",state.pt>0||state.stats.totalPt>0);
  unlockTabIf("customize",state.pt>0||state.stats.totalPt>0);
  unlockTabIf("rebirth",state.lv>=10||state.stats.totalRebirths>0);
  unlockTabIf("prestige",state.lv>=25||state.stats.totalPrestiges>0);
  unlockTabIf("achievements",state.stats.totalPrestiges>0);
  unlockTabIf("challenge",state.everRank>=4);
  unlockTabIf("ascension",state.everRank>=9||state.stats.totalAscensions>0);
  unlockTabIf("minigame",state.everTree9||hasTree("3"));
  state.maxEquip=4+Math.min(Math.floor(Math.max(0,state.rank-1)/2),4);
  syncShopSlotCount();
  refreshAchievements();
}
function refreshGuideUnlocks(){
  unlockGuideIf("shop",state.pt>0||state.stats.totalPt>0);
  unlockGuideIf("customize",state.pt>0||state.stats.totalPt>0);
  unlockGuideIf("rebirth",state.lv>=10||state.stats.totalRebirths>0);
  unlockGuideIf("prestige",state.lv>=25||state.stats.totalPrestiges>0);
  unlockGuideIf("challenge",state.everRank>=4);
  unlockGuideIf("ascension",state.everRank>=9);
  unlockGuideIf("minigame",state.everTree9||hasTree("3"));

// 【目的】獲得したPtを最終的な倍率付きで加算します。
// 【処理】チャレンジ補正、各リセット単位の統計、最大Pt統計まで同時に更新します。
function addPtRaw(raw){
  let gain=Number(raw)*basePtMultiplier();
  if(isChallenge(1))gain=Math.pow(Math.max(gain,0),.75-.05*activeChallengeLevel(1));
  if(isChallenge(101))gain=Math.pow(Math.max(gain,0),.85-.05*activeChallengeLevel(101));
  if(isChallenge(104))gain/=Math.pow(1+.1*activeChallengeLevel(104),Math.floor(Math.max(0,Date.now()-state.challengeStartedAt)/1000)+30);
  if(isChallenge(106))gain=Math.pow(Math.max(0,gain),.12-.02*activeChallengeLevel(106));
  const p1=challengeCompletedLevels(1),p3=challengeCompletedLevels(3);
  if(p1>0)gain*=1+p1;
  if(p3>0)gain*=1+1.5*p3;
  if(!Number.isFinite(gain)||gain<0)gain=0;
  state.pt+=gain;state.stats.totalPt+=gain;
  for(const layer of ["rebirth","prestige","ascension"]){state.period[layer].pt=(Number(state.period[layer].pt)||0)+gain}state.period.dimensionBoost.pt=(Number(state.period.dimensionBoost?.pt)||0)+gain;
  state.stats.maxPtPrestige=Math.max(Number(state.stats.maxPtPrestige)||0,state.pt);
  state.stats.maxPtAscension=Math.max(Number(state.stats.maxPtAscension)||0,state.pt);
  refreshAchievements();
  return gain;
}

// 【目的】獲得Expを加算し、必要量に達したら連続してLvアップさせます。
// 【処理】Expは「現在Lvの必要量を消費→次Lvへ」の順で処理し、余ったExpを次Lvへ正しく持ち越します。
function addExpRaw(raw){
  raw=Number(raw);if(!Number.isFinite(raw)||raw<=0)return 0;
  let gain=raw*baseExpMultiplier();
  if(isChallenge(2))gain=Math.pow(Math.max(gain,0),.75-.05*activeChallengeLevel(2));
  if(isChallenge(101))gain=Math.pow(Math.max(gain,0),.85-.05*activeChallengeLevel(101));
  if(isChallenge(104))gain/=Math.pow(1+.1*activeChallengeLevel(104),Math.floor(Math.max(0,Date.now()-state.challengeStartedAt)/1000)+30);
  if(isChallenge(106))gain=Math.pow(Math.max(0,gain),.12-.02*activeChallengeLevel(106));
  const p2=challengeCompletedLevels(2),p3=challengeCompletedLevels(3);
  if(p2>0)gain*=1+p2;
  if(p3>0)gain*=1+1.5*p3;
  if(!Number.isFinite(gain)||gain<=0)return 0;
  state.exp=Number(state.exp)||0;
  state.lv=Math.max(1,Number(state.lv)||1);
  state.stats.totalExp=Number(state.stats.totalExp)||0;
  state.exp+=gain;state.stats.totalExp+=gain;
  for(const layer of ["rebirth","prestige","ascension"]){state.period[layer].exp=(Number(state.period[layer].exp)||0)+gain}state.period.dimensionBoost.exp=(Number(state.period.dimensionBoost?.exp)||0)+gain;
  let guard=0;
  while(state.exp>=expReq(state.lv)&&guard++<10000){state.exp-=expReq(state.lv);state.lv++;onLevelUp()}
  refreshAchievements();
  return gain;
}
function onLevelUp(){
  // 【目的】Lv到達報酬のNextPsPを獲得倍率から独立させます。
  // 【処理】ブースト倍率を参照せず、Lv条件だけでNextPsPを直接加算します。
  if(state.lv>=30&&state.lv%5===0)state.nextPsp+=5*Math.pow(1.5,(state.lv-25)/5);
  if(state.lv>=30)state.stats.reachedLv30ThisPrestige=true;
}

// 【目的】スライスLvに応じたPt/Expの基礎獲得量を返します。
// 【処理】Lv1を「0回強化」として扱い、レアリティ基礎値×Lv成長率で具体的な獲得量を計算します。
// 【目的】無限レベルスライスのレアリティ差を、初期効果の係数として定義します。
// 【処理】係数はLvごとの成長率とは分離し、Pt/Expは毎Lv×1.08、PsPは毎Lv×1.04で成長させます。
const UNLIMITED_PTE_RARITY_MULT={Common:1,Uncommon:2.35,Rare:5.2,Epic:7.7,Legendary:48.8,Mythical:190};
const UNLIMITED_PSP_RARITY_MULT={Common:1,Uncommon:1.5,Rare:2.3,Epic:2.8,Legendary:7.3,Mythical:14.5};
function sliceYield(id,lv=sliceLv(id)){
  const s=SLICES[id];if(!s)return 0;
  const rarityMult=s.max===Infinity?(UNLIMITED_PTE_RARITY_MULT[s.rarity]||1):1;
  return RARITY[s.rarity].yield*rarityMult*Math.pow(1.08,Math.max(0,lv-1));
}
function pspYield(id,lv=sliceLv(id)){
  const s=SLICES[id];if(!s)return 2;
  const rarityMult=s.max===Infinity?(UNLIMITED_PSP_RARITY_MULT[s.rarity]||1):1;
  return 2*rarityMult*Math.pow(1.04,Math.max(0,lv-1));
}
function ticketGain(lv){return lv*ticketMultiplier()}

// 【目的】ブーストを積み上げて次回スピンへ適用します。
// 【処理】倍率の高い順に保持し、消費時は先頭のブーストを1回だけ減らします。
function addBoost(mult,uses){if(!Number.isFinite(mult)||mult<=1||uses<=0)return;state.boosts.push({mult,uses,id:String(Math.random())});state.boosts.sort((a,b)=>b.mult-a.mult)}
// 【目的】現在適用するブースト倍率を返します。
// 【処理】残り回数があるブーストのうち、最も倍率が高い1つだけを適用し、他の倍率は積算しません。
function activeBoostMult(){
  const active=state.boosts.filter(b=>Number(b.uses)>0&&Number.isFinite(Number(b.mult)));
  return active.reduce((best,b)=>Math.max(best,Number(b.mult)||1),1);
}
function consumeBoostUses(existingBoostIds=null){
  // 【目的】スピンで実際に適用した最高倍率ブーストだけを消費します。
  // 【処理】スピン開始時点から存在したブーストのみ比較し、最も倍率が高い1件だけ残り回数を1減らします。同率でも1件だけを消費し、新規ブーストと待機ブーストは維持します。
  const candidates=state.boosts.filter(b=>existingBoostIds&&existingBoostIds.includes(b.id)&&Number(b.uses)>0);
  const active=candidates.reduce((best,b)=>!best||Number(b.mult)>Number(best.mult)?b:best,null);
  if(active)active.uses--;
  state.boosts=state.boosts.filter(x=>Number(x.uses)>0);
}
function boostApplicationMultiplier(){let m=activeBoostMult();if(state.overflowBoost>1)m*=state.overflowBoost;return m}

// 【目的】スライスの現在Lv・次Lvの具体的効果を説明文として作ります。
// 【処理】カスタマイズ・ショップの両画面で同じ内容を表示し、Lv変更後は自動で更新します。
// 【目的】一時的なブーストを除き、現在の永続・ランク・実績・ツリー・チャレンジ倍率を反映した効果量を表示します。
// 【処理】実際の獲得処理と同じ順番で固定倍率とチャレンジ補正を計算し、スライス一覧の現在Lv・次Lv表示に使います。
function displayedPtGain(raw){
  let gain=Math.max(0,Number(raw)||0)*basePtMultiplier();
  if(isChallenge(1))gain=Math.pow(gain,.75-.05*activeChallengeLevel(1));
  if(isChallenge(101))gain=Math.pow(gain,.85-.05*activeChallengeLevel(101));
  gain*=1+challengeCompletedLevels(1);gain*=1+1.5*challengeCompletedLevels(3);
  return Number.isFinite(gain)?Math.max(0,gain):0;
}
function displayedExpGain(raw){
  let gain=Math.max(0,Number(raw)||0)*baseExpMultiplier();
  if(isChallenge(2))gain=Math.pow(gain,.75-.05*activeChallengeLevel(2));
  if(isChallenge(101))gain=Math.pow(gain,.85-.05*activeChallengeLevel(101));
  gain*=1+challengeCompletedLevels(2);gain*=1+1.5*challengeCompletedLevels(3);
  return Number.isFinite(gain)?Math.max(0,gain):0;
}
function displayedNextPspGain(raw){
  const convert=total=>{let value=Math.max(0,total)*pspMultiplier();if(isChallenge(101))value=Math.pow(value,.55-.05*activeChallengeLevel(101));return Number.isFinite(value)?Math.max(0,value):0};
  const before=Math.max(0,Number(state.nextPsp)||0);return Math.max(0,convert(before+Math.max(0,Number(raw)||0))-convert(before));
}
function sliceSpecific(id,lv){
  const s=SLICES[id],factor=sliceYield(id,lv),next=sliceYield(id,lv+1),pt=(x)=>displayedPtGain(x),exp=(x)=>displayedExpGain(x),psp=(x)=>`NextPsP +${fmt(x)}（プレステージ時 +${fmt(displayedNextPspGain(x))} PsP相当）`;
  switch(s.type){
    case"ptSmall":return `Pt +${fmt(pt(factor))} → 次Lv +${fmt(pt(next))}`;
    case"expSmall":return `Exp +${fmt(exp(factor))} → 次Lv +${fmt(exp(next))}`;
    case"mix":return `Pt +${fmt(pt(factor))} / Exp +${fmt(exp(factor))} → 次Lv Pt +${fmt(pt(next))} / Exp +${fmt(exp(next))}`;
    case"ptMedium":{const streak=state.consecutive?.id===id?(Number(state.consecutive.n)||0):0,d=Math.pow(1.12,Math.max(0,streak));return `Pt 基準+${fmt(pt(3*factor/d))}（連続で減衰） → 次Lv 基準+${fmt(pt(3*next/d))}`}
    case"expMedium":{const streak=state.consecutive?.id===id?(Number(state.consecutive.n)||0):0,d=Math.pow(1.12,Math.max(0,streak));return `Exp 基準+${fmt(exp(3*factor/d))}（連続で減衰） → 次Lv 基準+${fmt(exp(3*next/d))}`}
    case"ptRandom":return `Pt +${fmt(pt(.5*factor))}～${fmt(pt(1.5*factor))} → 次Lv +${fmt(pt(.5*next))}～${fmt(pt(1.5*next))}`;
    case"expRandom":return `Exp +${fmt(exp(.5*factor))}～${fmt(exp(1.5*factor))} → 次Lv +${fmt(exp(.5*next))}～${fmt(exp(1.5*next))}`;
    case"randomAll":return `候補: Pt +${fmt(pt(3*factor))} / Exp +${fmt(exp(3*factor))} / ×1.5ブースト×2 / ${psp(pspYield(id,lv))} / Ticket +${fmt(ticketGain(lv))}`;
    case"pspSmall":return `${psp(pspYield(id,lv))} → 次Lv ${psp(pspYield(id,lv+1))}`;
    case"energyCharge":{const v=18+2*(lv-1);return `En +${v} → 次Lv +${v+2}`}
    case"energySmall":return `En +${2*(lv+1)}（上限超過分は消失） → 次Lv +${2*(lv+2)}`;
    case"miniBoost":return `2回 ×${fmt(1.45+.05*lv)}ブースト → 次Lv ×${fmt(1.45+.05*(lv+1))}`;
    case"comboContinue":return `コンボ回数+1（現在のコンボ倍率 ×${fmt(Math.pow(1.2,Math.max(0,Number(state.combo)||0)+1))}）`;
    case"cooldownShorten":return `残りクールタイムを${30+3*lv}%短縮 → 次Lv ${Math.min(45,33+3*lv)}%`;
    case"quickPoint":return `Pt +${fmt(pt(factor))}、残りクールタイム -50% → 次Lv Pt +${fmt(pt(next))}`;
    case"quickExp":return `Exp +${fmt(exp(factor))}、残りクールタイム -50% → 次Lv Exp +${fmt(exp(next))}`;
    case"dupe":return `直前のスライスを2回発動（現在: ${state.previousSlice&&SLICES[state.previousSlice]?SLICES[state.previousSlice].name:"なし"}）`;
    case"levelUp":return `現在のPt以下の強化コストの装備スライスを無料で1Lv強化`;
    case"prestigePoint":{const v=7*Math.pow(1.04,lv-1);return `NextPsP +${fmt(v)} → 次Lv +${fmt(v*1.04)}`}
    case"energyPt":return `現在Enなら約${fmt(pt(state.en/2*5*factor))} Pt → 次Lv 約${fmt(pt(state.en/2*5*next))} Pt`;
    case"energyExp":return `現在Enなら約${fmt(exp(state.en/2*5*factor))} Exp → 次Lv 約${fmt(exp(state.en/2*5*next))} Exp`;
    case"energyChance":{const raw=8*Math.pow(1.04,lv-1);return `成功率は現在En% → 成功時 ${psp(raw)}; 次Lv ${psp(raw*1.04)}`}
    case"charged":return `左右スライスを次回だけ強化 → 次Lvで強化倍率が上昇`;
    case"discharge":return `次3回をEn量に応じて強化 → 次Lvで係数上昇`;

    case"longBoost":return `次5回 ×${fmt(1.3+.1*lv)} → 次Lv ×${fmt(1.3+.1*(lv+1))}`;

    case"ptCombo":{const c=Math.pow(1.2,Math.max(0,Number(state.combo)||0)+1);return `Pt +${fmt(pt(factor*c))}（コンボ込み） → 次Lv +${fmt(pt(next*c))}`}

// 【目的】スライス表示カードを共通化します。
// 【処理】レアリティ、Lv、Tag、具体的な現在効果と次Lv効果、操作ボタンをまとめて表示します。
function sliceCard(id,action=""){
  const s=SLICES[id];if(!s)return `<div class="card locked">不明なスライス</div>`;
  const lv=sliceLv(id),r=RARITY[s.rarity];
  return `<div class="card" style="border-color:${r.c}"><div class="slice-name">${s.name}</div><div class="row"><span class="badge" style="background:${r.c};color:#111">${s.rarity}</span><span>Lv ${lv}</span></div><div class="small">${s.effect}</div><div class="small">Tag: ${s.tag.join(" + ")}</div><div style="margin-top:8px">${sliceSpecific(id,lv)}</div>${action?`<div style="margin-top:8px">${action}</div>`:""}</div>`;
}
function shopCostMultiplier(){return Math.pow(.8,challengeCompletedLevels(6))}
function sliceCost(id,lv=sliceLv(id)){const s=SLICES[id];if(!s)return Infinity;const b={Common:10,Uncommon:75,Rare:500,Epic:1250,Legendary:1e5,Mythical:2.5e6}[s.rarity];const r=s.max<Infinity?2:1.2;return b*Math.pow(r,Math.max(0,lv-1))*shopCostMultiplier()}

// 【目的】ショップ再入荷時に同じスライスが同時に並ばないようにします。
// 【処理】ロック中のスライスを固定し、そのIDを抽選除外集合へ入れて残りの枠を埋めます。
function sanitizeShop(){
  const seen=new Set();
  for(let i=0;i<state.shop.length;i++){
    const o=state.shop[i];
    if(!o||!SLICES[o.id]||!shopSliceUnlocked(SLICES[o.id])||seen.has(o.id)){state.shop[i]=null;state.shopLocks[i]=false;continue}
    if(sliceLv(o.id)>=SLICES[o.id].max){state.shop[i]=null;state.shopLocks[i]=false;continue}
    seen.add(o.id);
  }
}
function availableShopRarities(){return Object.keys(RARITY).filter(r=>(r!=="Legendary"||hasTree("6"))&&(r!=="Mythical"||hasTree("13-1")))}
function shopSliceUnlocked(s){
  if(s.tag.includes("スイッチ")&&Number(state.stats.totalRebirths||0)<1)return false;
  if(s.tag.includes("En")&&Number(state.stats.totalPrestiges||0)<1)return false;
  if((s.tag.includes("Ticket")||s.tag.includes("Lk"))&&!hasTree("3"))return false;
  return true;
}
function eligibleShopSlices(rarity,exclude=new Set()){
  return Object.entries(SLICES).filter(([id,s])=>s.rarity===rarity&&!exclude.has(id)&&shopSliceUnlocked(s)&&sliceLv(id)<s.max)
}
// 【目的】Rank9・Rank12以降の再入荷ボーナスを実処理に反映します。
// 【処理】Rank9で再入荷時間を25%短縮し、Rank12から3Rankごとに品数を1枠ずつ増やします。
function shopSlotCount(){return 3+rankRestockSliceBonus()}
function shopRefreshDuration(){return 15*60*1000*(state.rank>=9?.75:1)}
function syncShopSlotCount(){
  if(!Array.isArray(state.shop))state.shop=[];if(!Array.isArray(state.shopLocks))state.shopLocks=[];
  const target=shopSlotCount();
  if(state.shop.length>target)state.shop=state.shop.slice(0,target);
  if(state.shopLocks.length>target)state.shopLocks=state.shopLocks.slice(0,target);
  while(state.shop.length<target){
    const exclude=new Set(state.shop.filter(Boolean).map(o=>o.id));
    const o=randomShopSlice(exclude);state.shop.push(o);state.shopLocks.push(false);
  }
  while(state.shopLocks.length<target)state.shopLocks.push(false);
}
function weightedRarity(){const rr=availableShopRarities(),total=rr.reduce((a,r)=>a+RARITY[r].w,0);let p=Math.random()*total;for(const r of rr){p-=RARITY[r].w;if(p<=0)return r}return rr[0]}
function randomShopSlice(exclude=new Set()){
  for(let t=0;t<100;t++){const r=weightedRarity(),list=eligibleShopSlices(r,exclude);if(list.length){const [id]=list[Math.floor(Math.random()*list.length)];return{id}}}
  const fallback=Object.entries(SLICES).find(([id,s])=>!exclude.has(id)&&shopSliceUnlocked(s)&&sliceLv(id)<s.max)?.[0];return fallback?{id:fallback}:null;
}
function refillShop(resetManual=true){
  const count=shopSlotCount();
  state.shop=Array.isArray(state.shop)?state.shop.slice(0,count):[];while(state.shop.length<count)state.shop.push(null);
  state.shopLocks=Array.isArray(state.shopLocks)?state.shopLocks.slice(0,count):[];while(state.shopLocks.length<count)state.shopLocks.push(false);
  sanitizeShop();
  const old=state.shop,locks=state.shopLocks,next=Array(count).fill(null),nextLocks=Array(count).fill(false),exclude=new Set();
  for(let i=0;i<count;i++)if(locks[i]&&old[i]){next[i]=old[i];nextLocks[i]=true;exclude.add(old[i].id)}
  for(let i=0;i<count;i++)if(!next[i]){const o=randomShopSlice(exclude);if(o){next[i]=o;exclude.add(o.id)}}
  state.shop=next;state.shopLocks=nextLocks;
  if(resetManual)state.manualRestocks=0;
  state.shopNextRefresh=Date.now()+shopRefreshDuration();
}
function manualRestock(){if(isBlockedByChallenge("shop"))return toast("このチャレンジ中はショップを利用できません");const cost=100*Math.pow(2,state.manualRestocks||0);if(state.pt<cost)return toast("Ptが足りません");state.pt-=cost;state.manualRestocks++;refillShop(false);playSfx("restock");commit()}
function buyShop(i){
  if(isBlockedByChallenge("shop"))return toast("このチャレンジ中はショップを利用できません");
  const o=state.shop[i];if(!o)return;
  const id=o.id,dup=!!state.slices[id];
  if(dup&&(isChallenge(4)||isChallenge(102)))return toast("このチャレンジ中はスライスレベルを上げられません");
  const cost=dup?sliceCost(id,sliceLv(id))/3:sliceCost(id,1);
  if(state.pt<cost)return toast("Ptが足りません");
  state.pt-=cost;playSfx("buy");
  if(dup)state.slices[id]=Math.min(SLICES[id].max,sliceLv(id)+1);else{state.slices[id]=1;if(!state.ownedOrder.includes(id))state.ownedOrder.push(id)}
  state.shop[i]=null;state.shopLocks[i]=false;commit();
}

// 【目的】装備中・所持中のスライス情報を常に有効な状態に保ちます。
// 【処理】古いセーブに消えたIDがあっても、初期2スライスを補充してルーレットが止まらないようにします。
function sanitizeOwnedSlices(){
  const equippedBefore=Array.isArray(state.equipped)?state.equipped.join("|"): "";
  const owned=Object.keys(state.slices).filter(id=>SLICES[id]&&Number(state.slices[id])>0);
  state.slices=Object.fromEntries(owned.map(id=>[id,Math.min(SLICES[id].max,Math.max(1,Number(state.slices[id])||1))]));
  state.ownedOrder=(Array.isArray(state.ownedOrder)?state.ownedOrder:[]).filter(id=>SLICES[id]&&state.slices[id]);
  for(const id of owned)if(!state.ownedOrder.includes(id))state.ownedOrder.push(id);
  state.equipped=(Array.isArray(state.equipped)?state.equipped:[]).filter(id=>SLICES[id]&&state.slices[id]);
  if(state.equipped.length<2)for(const id of INITIAL_SLICES)if(!state.equipped.includes(id))state.equipped.push(id);
  state.equipped=state.equipped.slice(0,Math.max(2,state.maxEquip||4));
  if(equippedBefore!==state.equipped.join("|"))state.previousSlice=null;
}
function sliceLv(id){return Math.max(1,Number(state.slices[id])||1)}
function removeEquipped(id){state.equipped=state.equipped.filter(x=>x!==id);sanitizeOwnedSlices()}

// 【目的】スピン回復タイマーを管理します。
// 【処理】満タンならタイマーを消し、未満なら15秒（各種強化後）ごとに1個だけ回復します。
function ensureSpinRecoveryTimer(){if(state.spins<spinMax()&&Number(state.cooldownUntil)<=Date.now())state.cooldownUntil=Date.now()+spinCooldown()*1000}
function recoverSpinTick(){
  const now=Date.now(),max=spinMax();
  state.spins=Math.min(max,Math.max(0,Number(state.spins)||0));
  if(state.spins>=max){state.cooldownUntil=0;return}
  if(Number(state.cooldownUntil)>now)return;
  state.spins++;
  if(state.spins<max)state.cooldownUntil=now+spinCooldown()*1000;
  else state.cooldownUntil=0;
}
function spinAvailable(){return state.spins>0&&!isBlockedByChallenge("spin")}
let lastCooldownReductionAt=0;
// 【目的】スピン回復タイマーの残り時間を0.95倍にします。
// 【処理】短い受付間隔を設け、満タンまたはタイマー終了時は変更しません。
function reduceSpinCooldown(){
  const now=Date.now();if(now-lastCooldownReductionAt<180)return;lastCooldownReductionAt=now;
  if(state.spins>=spinMax()||Number(state.cooldownUntil)<=now){toast("短縮できる回復タイマーがありません");return}
  const remaining=Number(state.cooldownUntil)-now;state.cooldownUntil=now+remaining*.95;save();updateDynamicText();
}

// 【目的】ルーレットの見た目だけをCanvasへ描画します。
// 【処理】スライスごとの明るさを少し変えながら、現在の装備順で円を描きます。
function rarityBrightness(hex,pos,total){const amt=Math.round((pos/Math.max(1,total-1)-.5)*22),m=hex.match(/\w\w/g).map(x=>parseInt(x,16)),p=v=>Math.max(0,Math.min(255,v+amt));return `rgb(${p(m[0])},${p(m[1])},${p(m[2])})`}
function drawWheel(angle=0){
  const c=document.getElementById("wheel");if(!c)return;
  sanitizeOwnedSlices();
  const ctx=c.getContext("2d"),w=c.width,h=c.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.43,arr=wheelDisplayEquipped||state.equipped,step=Math.PI*2/arr.length;
  ctx.clearRect(0,0,w,h);
  for(let i=0;i<arr.length;i++){
    const s=SLICES[arr[i]],a0=angle+i*step-Math.PI/2,a1=a0+step;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fillStyle=rarityBrightness(RARITY[s.rarity].c,i,arr.length);ctx.fill();ctx.strokeStyle="rgba(0,0,0,.28)";ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate((a0+a1)/2);ctx.textAlign="right";ctx.fillStyle=(s.rarity==="Common"||s.rarity==="Uncommon")?"#111":"#fff";ctx.font="bold 14px system-ui";ctx.fillText(`${s.name} Lv${sliceLv(arr[i])}`,r-12,5);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,62,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--panel');ctx.fill();ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--border');ctx.lineWidth=2;ctx.stroke();
}

// 【目的】指定スライスに対するブーストや特殊効果を一括で処理します。
// 【処理】ID不整合を最初に検証し、Pt/Expを必ず専用加算関数へ渡すことで経験値処理を安定させます。
function applySlice(id,boostMult=1,comboMult=1){
  const s=SLICES[id];
  if(!s||!RARITY[s.rarity]){state.lastSpinResult="無効なスライス結果を検出しました";return}
  const lv=sliceLv(id),factor=sliceYield(id,lv),common=x=>x*boostMult;
  switch(s.type){
    case"ptSmall":addPtRaw(common(factor));break;
    case"expSmall":addExpRaw(common(factor));break;
    case"mix":addPtRaw(common(factor));addExpRaw(common(factor));break;
    case"ptMedium":addPtRaw(common(3*factor/Math.pow(1.12,Math.max(0,state.consecutive.n-1))));break;
    case"expMedium":addExpRaw(common(3*factor/Math.pow(1.12,Math.max(0,state.consecutive.n-1))));break;
    case"ptRandom":addPtRaw(common(factor*(.5+Math.random())));break;
    case"expRandom":addExpRaw(common(factor*(.5+Math.random())));break;
    case"randomAll":{
      const opts=["pt","exp","boost","psp","ticket"].filter(x=>(x!=="psp"||state.prestiges>0)&&(x!=="ticket"||hasTree("3")));
      const x=opts[Math.floor(Math.random()*opts.length)]||"pt";
      if(x==="pt")addPtRaw(common(3*factor));
      else if(x==="exp")addExpRaw(common(3*factor));
      else if(x==="boost")addBoost(1.5,2);
      else if(x==="psp")state.nextPsp+=pspYield(id,lv);
      else if(x==="ticket"){const g=ticketGain(lv);state.ticket+=g;state.stats.totalTicket+=g}
      break;
    }
    case"pspSmall":state.nextPsp+=pspYield(id,lv);break;
    case"energyCharge":{const add=(18+2*(lv-1))*dimensionEnGainMultiplier();state.en+=add;const over=Math.max(0,state.en-maxEnergy());if(over>0){state.en=maxEnergy();state.overflowBoost*=1+over/100}break}
    case"energySmall":state.en=Math.min(maxEnergy(),state.en+2*(lv+1)*dimensionEnGainMultiplier());break;
    case"miniBoost":addBoost(1.45+.05*lv,2);break;
    case"comboContinue":break;
    case"cooldownShorten":{const pct=(30+3*lv)/100;state.cooldownUntil=Date.now()+Math.max(0,Number(state.cooldownUntil)-Date.now())*(1-pct);break}
    case"quickPoint":addPtRaw(common(factor));state.cooldownUntil=Date.now()+Math.max(0,Number(state.cooldownUntil)-Date.now())*.5;break;
    case"quickExp":addExpRaw(common(factor));state.cooldownUntil=Date.now()+Math.max(0,Number(state.cooldownUntil)-Date.now())*.5;break;
    case"dupe":break;
    case"levelUp":{const availablePt=Math.max(0,Number(state.pt)||0);for(const equippedId of [...state.equipped]){const equippedSlice=SLICES[equippedId],equippedLv=sliceLv(equippedId),cost=sliceCost(equippedId,equippedLv);if(equippedSlice&&equippedLv<equippedSlice.max&&Number.isFinite(cost)&&cost<=availablePt)state.slices[equippedId]=equippedLv+1}break}
    case"prestigePoint":state.nextPsp+=7*Math.pow(1.04,lv-1);break;
    case"energyPt":{const use=state.en/2;state.en-=use;addPtRaw(common(use*5*factor));break}
    case"energyExp":{const use=state.en/2;state.en-=use;addExpRaw(common(use*5*factor));break}
    case"energyChance":{const old=Math.max(0,Number(state.en)||0),success=Math.random()*100<old;state.en=Math.max(0,state.en-100);if(success)state.nextPsp+=8*Math.pow(1.04,lv-1);state.lastSliceOutcome=`エネルギーチャンス: ${success?"成功":"失敗"}（発動判定 ${fmt(Math.min(old,100))}%）`;break}
    case"charged":{if(state.en<20){addPtRaw(common(factor));break}state.en-=20;state.charged={left:1+(1.8+.2*lv),right:1+(1.8+.2*lv),valid:true};break}
    case"discharge":{const use=state.en;state.en=0;addBoost(1+use/100*(.8+.2*lv),3);break}
    case"switchPt":if(state.sliceSwitches[id]){addPtRaw(common(7*factor));state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;
    case"switchExp":if(state.sliceSwitches[id]){addExpRaw(common(7*factor));state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;
    case"switchBoost":if(state.sliceSwitches[id]){addBoost(1.7+.3*lv,3);state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;
    case"switch":for(const x of Object.keys(SLICES))if(SLICES[x].tag.includes("スイッチ"))state.sliceSwitches[x]=true;break;
    case"respin":state.nextRespinMultiplier=Math.max(1,Number(state.nextRespinMultiplier)||1)*(1.15+.05*lv)*comboMult;break;
    case"ptBurst":addPtRaw(common(10*factor));removeEquipped(id);break;
    case"expBurst":addExpRaw(common(10*factor));removeEquipped(id);break;
    case"longBoost":addBoost(1.3+.1*lv,5);break;
    case"boost":addBoost(1.6+.2*lv,3);break;
    case"shortBoost":addBoost(2.2+.3*lv,2);break;
    case"royalCard":addPtRaw(common(10*factor));addExpRaw(common(10*factor));addBoost(2,2);break;
    case"ptCombo":addPtRaw(common(factor));break;
    case"expCombo":addExpRaw(common(factor));break;
    case"ticket":{const g=ticketGain(lv);state.ticket+=g;state.stats.totalTicket+=g;break}
    case"luck":{const g=2*(lv+1)*lkMultiplier();state.lk+=g;state.stats.totalLk+=g;break}
  }
}

// 【目的】スピン開始時に結果スライスを確定します。
// 【処理】アニメーション終了時の角度計算でIDがずれる問題を避けるため、結果インデックスを先に保存します。
function spin(freeRespin=false,forcedRespinMultiplier=null){
  if(state.rotation){toast("スピン中です");return}
  if(!freeRespin&&!spinAvailable()){toast("スピンがありません");return}
  sanitizeOwnedSlices();
  wheelDisplayEquipped=[...state.equipped];
  let free=!!freeRespin;
  // 【目的】無限回帰I/IIのスピン消費回避率を加算方式で適用します。
  // 【処理】Iの20%とIIの10%を足して最大30%の単一抽選にし、独立抽選による実効28%化を防ぎます。
  const noConsumeChance=(hasTree("5-2") ? 0.20 : 0)+(hasTree("8-2") ? 0.10 : 0);
  if(!free&&Math.random()<noConsumeChance)free=true;
  if(!free)state.spins=Math.max(0,Number(state.spins)-1);
  state.currentRespinMultiplier=freeRespin?Math.max(1,Number(forcedRespinMultiplier??state.nextRespinMultiplier)||1):1;
  state.nextRespinMultiplier=1;
  if(state.spins<spinMax()&&Number(state.cooldownUntil)<=Date.now())state.cooldownUntil=Date.now()+spinCooldown()*1000;
  state.stats.totalSpins++;for(const layer of ["rebirth","prestige","ascension"])state.period[layer].spins=(Number(state.period[layer].spins)||0)+1;state.period.dimensionBoost.spins=(Number(state.period.dimensionBoost.spins)||0)+1;const autoEn=Number(state.baseUpgrades.autoEnergy)||0;if(autoEn>0)state.en=Math.min(maxEnergy(),state.en+autoEn*dimensionEnGainMultiplier());refreshAchievements();if(isChallenge(103)&&state.challenge)state.challenge.spinsUsed=(Number(state.challenge.spinsUsed)||0)+1;
  pendingSpinIndex=Math.floor(Math.random()*state.equipped.length);
  state.rotation=true;
  playSfx("rouletteSpin");save();updateDynamicText();animateSpin();
}

// 【目的】選ばれたスライスへ自然に着地する回転アニメーションを再生します。
// 【処理】演出時間だけCanvasを更新し、最後に確定済みのスライスへ結果処理を渡します。
function animateSpin(){
  const dur=state.debugCheats?.fastSpin?100:Math.max(.2,5-.2*(state.baseUpgrades.spinSpeed||0))*1000,start=performance.now(),startAngle=wheelAngle,arrLen=Math.max(1,(wheelDisplayEquipped||state.equipped).length),target=pendingSpinIndex??0,step=Math.PI*2/arrLen;
  const fullTurns=3+Math.floor(Math.random()*3);
  const randomWithinSlice=target+(0.1+Math.random()*0.8);
  const targetOffset=((( -randomWithinSlice*step)%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  const currentNorm=((startAngle%(Math.PI*2))+(Math.PI*2))%(Math.PI*2);
  const desired=startAngle+fullTurns*Math.PI*2+((targetOffset-currentNorm+Math.PI*2)%(Math.PI*2));
  function frame(t){
    const p=Math.min(1,(t-start)/dur),e=1-Math.pow(1-p,3);wheelAngle=startAngle+(desired-startAngle)*e;drawWheel(wheelAngle);
    if(p<1)requestAnimationFrame(frame);else resolveSpin();
  }
  requestAnimationFrame(frame);

// 【目的】コンボ判定と「直前のスライス」を含むスライス効果を共通処理します。

  state.pt=(!challengeStart&&lkInitial>0&&oldPt>0)?Math.pow(oldPt,.5-.5*Math.pow(.9,lkInitial)):0;
  state.everTree9=state.everTree9||hasTree("3");state.challenge=null;state.challengeStartedAt=0;
  state.challengeProgress=preservedChallengeProgress;
  state.challengeHistory={};
  for(const id of [1,2,3,4,5,6,101,102,103,104,105,106])if((Number(state.challengeProgress[id])||0)>0)state.challengeHistory[id]=true;
  // 【目的】報酬を獲得しないリセットをアセンション回数に含めません。
  // 【処理】チャレンジ開始用リセットは常に回数を増やさず、通常リセットも今回のToken獲得が0なら通算・累計回数を変更しません。
  if(!challengeStart&&gain>0){state.ascensions++;state.stats.totalAscensions++;}
  state.dimensionScore=oldDS*(oldTree["17-4"] ? 0.8 : 0.5);state.dimensionBoostsThisAscension=0;state.stats.maxDimensionScore=Math.max(Number(state.stats.maxDimensionScore)||0,state.dimensionScore);state.manualRestocks=0;state.shop=[null,null,null];state.shopLocks=[false,false,false];refillShop(false);ensureSpinRecoveryTimer();resetPeriod("ascension");
  return true;
}

// 【目的】予約中チャレンジを保持したまま、対応リセットだけを実行します。
// 【処理】予約しただけでは開始せず、プレイヤーがリボーン/プレステージ/アセンションボタンを押した瞬間にリセットと同時開始します。

// 【目的】ディメンションブーストを実行し、現在DSを上回るスコアだけを採用します。
// 【処理】スコアをリセット前に算出して上書きし、アセンション相当のリセットを行いますがTokenとアセンション回数は獲得しません。
function performDimensionBoost(){
  if(!hasTree("9"))return toast("ツリーID9の解放が必要です");
  if(state.challenge&&isBlockedByChallenge("ascension"))return toast("チャレンジ中はディメンションブーストを実行できません");
  const nextDS=calculateDimensionScore(),oldDS=Math.max(0,Number(state.dimensionScore)||0);
  if(!(nextDS>oldDS))return toast(`次のDS（${fmt(nextDS)}）が現在のDS（${fmt(oldDS)}）を上回っていません`);
  const oldPt=Math.max(0,Number(state.pt)||0),oldRank=Math.max(0,Number(state.rank)||0),oldLk=Number(state.lk)||0,oldLkUpgrades=Object.assign({},state.lkUpgrades),lkInitial=Number(state.lkUpgrades.ascensionInitialPt)||0,oldTree=Object.assign({},state.tree);
  playResetFx("DIMENSION BOOST");playSfx("reset");
  state.dimensionScore=nextDS;state.stats.maxDimensionScore=Math.max(Number(state.stats.maxDimensionScore)||0,nextDS);
  state.stats.totalDimensionBoosts=(Number(state.stats.totalDimensionBoosts)||0)+1;
  state.dimensionBoostsThisAscension=(Number(state.dimensionBoostsThisAscension)||0)+1;
  state.rank=oldTree["13-3"]?Math.floor(oldRank*.5):0;state.lv=1;state.exp=0;state.en=0;state.psp=0;state.nextPsp=0;state.baseUpgrades={};state.prestigeUpgrades={};
  state.slices={pt_small:1,exp_small:1};state.equipped=["pt_small","exp_small"];state.maxEquip=4;state.ownedOrder=["pt_small","exp_small"];
  state.previousSlice=null;state.combo=0;state.consecutive={id:null,n:0};state.sliceSwitches={};state.charged={left:1,right:1,valid:false};queuedRespinMultipliers=[];
  state.boosts=[];state.overflowBoost=1;state.rebirths=0;state.prestiges=0;state.currentCounts.rebirthsThisPrestige=0;state.stats.maxPtAscension=0;
  state.lk=oldLk;state.lkUpgrades=oldLkUpgrades;state.lkAutomationNext=0;
  state.pt=oldPt>0&&lkInitial>0?Math.pow(oldPt,.5-.5*Math.pow(.9,lkInitial)):0;
  state.challenge=null;state.challengeStartedAt=0;state.challengeQueue=null;state.manualRestocks=0;state.shop=[null,null,null];state.shopLocks=[false,false,false];refillShop(false);
  state.spins=Math.min(3,Math.max(0,Number(state.spins)||0));state.cooldownUntil=0;ensureSpinRecoveryTimer();resetPeriod("ascension");
  // 【目的】ディメンションブースト期間のステータスを新しい期間へ切り替えます。
  // 【処理】通算統計は保持し、このブースト期間の計測値だけをゼロへ戻します。
  state.period.dimensionBoost={start:Date.now(),totalPlayMs:0,spins:0,pt:0,exp:0,psp:0,rebirths:0,prestiges:0};
  refreshAchievements(true);save();renderApp();return true;
}

function tryReset(level){
  // 【目的】リセット処理内部で予約情報が消えても、該当チャレンジを確実に開始できるようにします。
  // 【処理】リセット前に予約を退避し、対応するリセットなら開始、別レイヤーの予約ならリセット後に復元します。
  const q=state.challengeQueue?{id:state.challengeQueue.id,layer:state.challengeQueue.layer}:null;
  if(q&&q.layer===level){
    const c=challenges.find(x=>x.id===q.id);
    if(!c)return false;
  }
  let ok=false;
  if(level==="rebirth")ok=performRebirth();
  else if(level==="prestige")ok=performPrestige(!!(q&&q.layer==="prestige"));
  else{
    const forced=(Number(state.stats.totalToken)||0)>=1&&state.treeRespecNext&&!(state.rank>=10&&!isBlockedByChallenge("ascension"))&&!isBlockedByChallenge("ascension");
    if(forced&&!confirm("通常条件を満たしていません。Token獲得量0でアセンションします。続行しますか？"))return false;
    const startingAscensionChallenge=!!(q&&q.layer==="ascension");
    ok=performAscension(forced,startingAscensionChallenge);
  }
  if(!ok)return false;
  if(q&&q.layer===level){state.challengeQueue=null;beginChallengeAfterReset(q.id)}
  else if(q&&!state.challengeQueue){state.challengeQueue=q;}
  commit();return true;
}
function isBlockedByChallenge(action){
  const c=state.challenge;if(!c)return false;
  if(c.layer==="prestige"&&(action==="prestige"||action==="ascension"))return true;
  if(c.id===6&&(action==="rebirth"||action==="shop"||action==="sliceUpgrade"||action==="baseUpgrade"))return true;
  if(c.id===104&&action==="rebirth"&&state.ui.batchRebirth)return true;
  if(c.id===105&&(action==="rebirth"||action==="prestige"))return true;
  if(c.layer==="ascension"&&action==="ascension")return true;
  if(c.id===103&&action==="prestige")return true;
  if(c.id===5&&action==="rebirth")return true;
  return false;
}

// 【目的】チャレンジを予約します。
// 【処理】予約情報だけを保存し、該当リセットが実行されるまではチャレンジ自体を開始しません。
function queueChallenge(id){
  const c=challenges.find(x=>x.id===id);if(!c||!c.req()||state.challenge)return;
  if(challengeMaxed(id))return toast("このチャレンジはLv5まで達成済みです");
  if(state.challengeQueue)return toast("すでにチャレンジを予約しています");
  state.challengeQueue={id:c.id,layer:c.layer};save();renderApp();
}

// 【目的】予約中チャレンジをキャンセルします。
// 【処理】予約だけを削除し、現在のゲーム進行には影響を与えません。
function cancelQueuedChallenge(){state.challengeQueue=null;save();renderApp()}

// 【目的】開始ボタンからチャレンジを開始します。
// 【処理】可能なら先に該当リセットを実行し、その直後にチャレンジ状態を作ります。予約は使いません。
function startChallenge(id){
  const c=challenges.find(x=>x.id===id);if(!c||!c.req()||state.challenge)return;
  if(challengeMaxed(id))return toast("このチャレンジはLv5まで達成済みです");
  if(c.layer==="prestige"){
    if(!performPrestige(true))return;
  }else{
    if(!performAscension(false,true))return;
  }
  beginChallengeAfterReset(id);commit();
}
function beginChallengeAfterReset(id){
  const c=challenges.find(x=>x.id===id);if(!c)return;
  state.challenge={id:c.id,layer:c.layer,name:c.name,level:challengeLevel(c.id),spinsUsed:0,previousAutoSpin:state.autoSpin,previousBatchRebirth:!!state.ui.batchRebirth};state.challengeStartedAt=Date.now();state.lastChallengeMessage="";if(c.id===103)state.autoSpin=false;if(c.id===104)state.ui.batchRebirth=false;
  // 【目的】チャレンジ開始時はアップグレード由来の初期通貨を無効にします。
  // 【処理】リセット処理の直後、チャレンジ状態を付与した時点でPt・Exp・En・NextPsPを初期値へ固定します。プレステージ時に正当に獲得したPsPなど、リセット対象でない通貨は保持します。
  state.pt=0;state.exp=0;state.en=0;state.nextPsp=0;
  if(c.layer==="prestige")state.lv=1;
  refreshAchievements();
}
function cancelChallenge(){if(state.challenge?.id===103)state.autoSpin=!!state.challenge.previousAutoSpin;if(state.challenge?.id===104)state.ui.batchRebirth=!!state.challenge.previousBatchRebirth;state.challenge=null;state.challengeStartedAt=0;save();renderApp()}
function challengeGoalReached(c){
  const l=Math.max(1,Math.min(5,Number(c.level)||challengeLevel(c.id)));
  if(c.id===1)return state.lv>=20+10*l;
  if(c.id===2)return state.pt>=Math.pow(10,4+2*l);
  if(c.id===3)return state.lv>=35+15*l&&state.pt>=Math.pow(10,6+3*l);
  if(c.id===4)return state.rank>=5+3*l;
  if(c.id===5)return state.lv>=250+50*l&&Date.now()-state.challengeStartedAt<=180000;
  if(c.id===6)return state.lv>=80+20*l&&Date.now()-state.challengeStartedAt<=30000;
  if(c.id===101)return state.psp>=5e3*Math.pow(20,l-1);
  if(c.id===102)return state.rank>=25+5*l;
  if(c.id===103)return state.pt>=Math.pow(10,12+3*l);
  if(c.id===104)return state.rank>=20;
  if(c.id===105)return state.pt>=Math.pow(10,24+6*l);
  if(c.id===106)return state.pt>=Math.pow(10,2+l)&&state.lv>=10+5*l;
  return false;
}
function playCheck(){
  const c=state.challenge;if(!c)return;
  if((c.id===5&&Date.now()-state.challengeStartedAt>180000)||(c.id===6&&Date.now()-state.challengeStartedAt>30000)){if(c.id===103)state.autoSpin=!!c.previousAutoSpin;state.challenge=null;state.challengeStartedAt=0;toast(`${challengeDisplayId(c)}の制限時間を超えました`);save();if(currentTab!=="guide")renderApp();else updateChallengeBar();return}
  if(challengeGoalReached(c)){
    const clearedLevel=Math.max(1,Math.min(5,Number(c.level)||challengeLevel(c.id)));
    state.challengeProgress=state.challengeProgress||{};
    state.challengeProgress[c.id]=Math.max(challengeCompletedLevels(c.id),clearedLevel);
    state.challengeHistory[c.id]=true;
    state.stats.completedChallenges=state.stats.completedChallenges||{};state.stats.completedChallenges[c.id]=true;
    if(c.id===103)state.autoSpin=!!c.previousAutoSpin;if(c.id===104)state.ui.batchRebirth=!!c.previousBatchRebirth;
    refreshAchievements(true);state.challenge=null;state.challengeStartedAt=0;
    playSfx("challenge");toast(`${c.name}Lv${clearedLevel} クリア!`);save();
    if(currentTab!=="guide")renderApp();else updateChallengeBar();
    return;
  }
  if(c.id===103&&!state.rotation&&(Number(c.spinsUsed)||0)>=55-5*activeChallengeLevel(103)){
    state.autoSpin=!!c.previousAutoSpin;state.challenge=null;state.challengeStartedAt=0;save();playSfx("challenge");toast("効率の再思考に失敗しました（スピン上限）");if(currentTab!=="guide")renderApp();else updateChallengeBar();
  }
  if(c.id===104&&state.ui.batchRebirth){state.ui.batchRebirth=!!c.previousBatchRebirth;state.challenge=null;state.challengeStartedAt=0;save();toast("時間膨張に失敗しました（まとめてリボーン）");if(currentTab!=="guide")renderApp();else updateChallengeBar();}
}

// 【目的】アセンションツリーの前提条件を、今後も一貫してOR条件で判定します。
// 【処理】前提IDが空なら初期解放、1つ以上あるなら列挙されたIDのどれか1つでも購入済みで解放します。AND条件は使用しません。
function treePrerequisitesMet(id){const req=tree[String(id)]?.req||[];return req.length===0||req.some(r=>hasTree(r))}
function nodeVisible(id){const key=String(id);return hasTree(key)||treePrerequisitesMet(key)}
function nodePurchasable(id){const key=String(id),n=tree[key];return !!n&&!hasTree(key)&&treePrerequisitesMet(key)}
function nodeDisplayId(id){return tree[String(id)]?.displayId||String(id)}
function treeSpent(){return Object.keys(state.tree).filter(id=>state.tree[id]).reduce((n,id)=>n+(tree[id]?.cost||0),0)}
function buyNode(id){
  id=String(id);if(!nodePurchasable(id))return;
  const n=tree[id];if(state.token<n.cost)return toast("Tokenが足りません");
  state.token-=n.cost;playSfx("node");state.tree[id]=true;state.ui.selectedTreeNode=id;state.everTree9=state.everTree9||String(id)==="3";
  // 【目的】ノード購入による再描画後もアセンションツリーの表示位置を維持します。
  // 【処理】購入前のスクロール位置をcommitへ渡し、新たにノードが表示されて高さが変わっても可能な範囲で同じ位置に戻します。
  commit(true);
}
function selectTreeNode(id){
  id=String(id);if(!tree[id])return;
  // 【目的】アセンションツリーでノードを選び直しても、表示中のスクロール位置を維持します。
  // 【処理】再描画前にツリー枠の縦横スクロール位置を保存し、再描画直後に新しい枠へ戻します。
  const oldWrap=document.querySelector(".treeSvgWrap"),scrollTop=oldWrap?.scrollTop||0,scrollLeft=oldWrap?.scrollLeft||0;
  state.ui.selectedTreeNode=id;renderApp();
  const newWrap=document.querySelector(".treeSvgWrap");
  if(newWrap){newWrap.scrollTop=scrollTop;newWrap.scrollLeft=scrollLeft;}
}
function treeContext(e,id){e.preventDefault();buyNode(id)}

// 【目的】6枠のアセンションツリーロードアウトを保存・有効化します。
// 【処理】保存時は購入済みノードだけを記録し、適用時はToken残高に合わせて下段のノードから削り、OR前提条件を満たす構成を再現します。
function saveTreeLoadout(slot){
  slot=Math.max(0,Math.min(5,Number(slot)||0));state.treeLoadouts=Array.isArray(state.treeLoadouts)?state.treeLoadouts:[];
  state.treeLoadouts[slot]={tree:Object.fromEntries(Object.entries(state.tree||{}).filter(([id,bought])=>bought&&tree[id])),savedAt:Date.now()};
  state.ui.treeLoadoutNotice=`ロードアウト${slot+1}へ${Object.keys(state.treeLoadouts[slot].tree).length}個のノードを保存しました。`;save();renderApp();
}
function toggleTreeLoadout(slot){
  slot=Math.max(0,Math.min(5,Number(slot)||0));const active=state.ui.activeTreeLoadout;
  const isActive=active!==null&&active!==undefined&&Number(active)===slot;
  if(!isActive&&!Number(state.treeLoadouts?.[slot]?.savedAt))return toast("このロードアウトは未保存です");
  state.ui.activeTreeLoadout=isActive?null:slot;
  state.ui.treeLoadoutNotice=state.ui.activeTreeLoadout===null?"ロードアウトの自動適用を解除しました。":`ロードアウト${slot+1}を有効化しました。ツリーのリセット時に適用されます。`;save();renderApp();
}
function changeTreeZoom(delta){state.ui.treeZoom=Math.max(.5,Math.min(1.5,Math.round((Number(state.ui.treeZoom||1)+delta)*10)/10));save();renderApp()}
function resetTreeZoom(){state.ui.treeZoom=1;save();renderApp()}
function applyActiveTreeLoadoutAfterReset(){
  const slot=state.ui.activeTreeLoadout;if(slot==null||slot<0||slot>5)return;
  const saved=state.treeLoadouts?.[slot]?.tree;if(!saved||typeof saved!=="object"||!Number(state.treeLoadouts?.[slot]?.savedAt))return;
  const selected=new Set(Object.keys(saved).filter(id=>saved[id]&&tree[id]));
  const cleanupPrerequisites=()=>{let changed=true;while(changed){changed=false;for(const id of [...selected]){const req=tree[id]?.req||[];if(req.length&&!req.some(r=>selected.has(r))){selected.delete(id);changed=true}}}};
  cleanupPrerequisites();
  const costOf=()=>[...selected].reduce((sum,id)=>sum+(tree[id]?.cost||0),0);
  let removed=0;
  while(costOf()>(Number(state.token)||0)&&selected.size){
    const candidates=[...selected].sort((a,b)=>(tree[b]?.y||0)-(tree[a]?.y||0)||String(b).localeCompare(String(a),undefined,{numeric:true}));
    if(!candidates.length)break;selected.delete(candidates[0]);removed++;cleanupPrerequisites();
  }
  state.tree={};
  const ordered=[...selected].sort((a,b)=>(tree[a]?.y||0)-(tree[b]?.y||0)||(tree[a]?.x||0)-(tree[b]?.x||0));
  let spent=0,applied=0;
  for(const id of ordered){const n=tree[id];if(!n||!treePrerequisitesMetForSet(n,state.tree))continue;if(spent+n.cost>Number(state.token||0))continue;state.tree[id]=true;state.token-=n.cost;spent+=n.cost;applied++}
  state.ui.selectedTreeNode=state.tree[state.ui.selectedTreeNode]?state.ui.selectedTreeNode:(Object.keys(state.tree).sort((a,b)=>(tree[a]?.y||0)-(tree[b]?.y||0))[0]||"1");
  state.ui.treeLoadoutNotice=`ロードアウト${slot+1}を適用しました（${applied}ノード / ${fmt(spent)} Token）。${removed?`Token不足のため下段から${removed}ノードを除外しました。`:""}`;
}
function treePrerequisitesMetForSet(n,purchased){const req=n?.req||[];return !req.length||req.some(id=>!!purchased[id])}

// 【目的】ランクボーナスを、達成済みと未達成で一目で区別できる一覧として生成します。

function rankBonusXDisplay(){return state.rank>=20?"現アセンション最大Pt":state.rank>=7?"現プレステージ最大Pt":"現在Pt"}
function rankMaxSliceBonus(){return state.rank>=3?Math.min(Math.floor((state.rank-1)/2),4):0}
function rankRestockSliceBonus(){return Math.min(Math.max(Math.floor((state.rank-9)/3),0),5)}

// 【目的】ガイドをプレイヤー向けの説明文として表示します。
// 【処理】条件名はタイトルから消し、まだ解放されていない項目は表示せず、式ではなくゲーム上の意味で説明します。
function guideContent(){

// 【目的】各チャレンジの目標値と現在値を、左下ウィンドウ用の共通データへ変換します。
// 【処理】複数目標のチャレンジは目標ごとに分離し、Pt・PsPは前の目標値1の対数進捗を使います。
function challengeDivisor104(){const l=activeChallengeLevel(104),secs=Math.floor(Math.max(0,Date.now()-Number(state.challengeStartedAt||Date.now()))/1000);return Math.pow(1+.1*l,secs+30)}
function challengeTimeLimit(id){return ({5:180000,6:30000})[Number(id)]||0}
function challengeGoalSpecs(c){
  if(!c)return [];
  const l=Math.max(1,Math.min(5,Number(c.level)||challengeLevel(c.id)));
  const linear=(name,value,target)=>({name,value,target,mode:"linear",previous:1});
  const logarithmic=(name,value,target)=>({name,value,target,mode:"log",previous:1});
  switch(Number(c.id)){
    case 1:return [linear("Lv",state.lv,20+10*l)];
    case 2:return [logarithmic("Pt",state.pt,Math.pow(10,4+2*l))];
    case 3:return [linear("Lv",state.lv,35+15*l),logarithmic("Pt",state.pt,Math.pow(10,6+3*l))];
    case 4:return [linear("Rank",state.rank,5+3*l)];
    case 5:return [linear("Lv",state.lv,250+50*l)];
    case 6:return [linear("Lv",state.lv,80+20*l)];
    case 101:return [logarithmic("PsP",state.psp,5e3*Math.pow(20,l-1))];
    case 102:return [linear("Rank",state.rank,25+5*l)];
    case 103:return [logarithmic("Pt",state.pt,Math.pow(10,12+3*l),1)];
    case 104:return [linear("Rank",state.rank,20)];
    case 105:return [logarithmic("Pt",state.pt,Math.pow(10,24+6*l),1)];
    case 106:return [logarithmic("Pt",state.pt,Math.pow(10,2+l),1),linear("Lv",state.lv,10+5*l)];
    default:return [];
  }
}
function challengeGoalPercent(g){return g.mode==="log"?logProgressPercent(g.value,g.target,g.previous):Math.max(0,Math.min(100,(Math.max(0,Number(g.value)||0)/Math.max(1,Number(g.target)||1))*100))}
// 【目的】チャレンジの各目標と残り制限を同じ形式のゲージへ反映します。
// 【処理】残り時間・残りスピンは100%から減少し、残量20%以下では赤く点滅します。
function updateChallengeProgress(){
  if(!state.challenge)return;
  const c=state.challenge,id=Number(c.id),level=activeChallengeLevel(id),elapsedMs=Math.max(0,Date.now()-Number(state.challengeStartedAt||Date.now()));
  if(id===103){
    const total=Math.max(0,55-5*level),left=Math.max(0,total-(Number(c.spinsUsed)||0)),pct=total>0?left/total*100:0;
    const valueEl=document.querySelector("[data-challenge-spins-value]"),fill=document.querySelector("[data-challenge-spins-fill]");
    if(valueEl)valueEl.textContent=`${fmt(left)} / ${fmt(total)} (${pct.toFixed(1)}%)`;
    if(fill){fill.style.width=`${pct}%`;fill.classList.toggle("critical",pct<=20)}
  }
  const limit=challengeTimeLimit(id);
  if(limit){
    const left=Math.max(0,limit-elapsedMs),pct=left/limit*100,timer=document.querySelector("[data-challenge-timer-value]"),fill=document.querySelector("[data-challenge-time-fill]");
    if(timer)timer.textContent=`${formatDuration(left)} / ${formatDuration(limit)} (${pct.toFixed(1)}%)`;
    if(fill){fill.style.width=`${pct}%`;fill.classList.toggle("critical",pct<=20)}
  }
  if(id===104){const d=document.querySelector("[data-challenge-divisor]");if(d)d.textContent=fmt(challengeDivisor104())}
  const specs=challengeGoalSpecs(c);
  specs.forEach((g,i)=>{
    const pct=challengeGoalPercent(g),label=document.querySelector(`[data-challenge-label="${i}"]`),value=document.querySelector(`[data-challenge-value="${i}"]`),fill=document.querySelector(`[data-challenge-fill="${i}"]`);
    if(label)label.textContent=`目標: ${g.name} ${fmt(g.target)}`;
    if(value)value.textContent=`${fmt(g.value)} / ${fmt(g.target)} (${pct.toFixed(1)}%)`;
    if(fill)fill.style.width=`${pct}%`;
  });
}

  updateChallengeProgress();
