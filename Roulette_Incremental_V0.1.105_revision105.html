// 【目的】通常のゲーム計算を使ってTU12まで自動プレイし、進行時間をスピードラン欄に記録します。
// 【処理】開始時に別領域へバックアップを作り、10倍速で通常のクールタイム・報酬計算を維持したまま、購入・リボーン・アセンション・トランセンデンスを自動判断します。
// 【目的】シミュレーターのアセンションツリー購入順を、指定されたロードアウトA/Bとチャレンジ進行に合わせます。
// 【処理】最初にAの13-1まで、次にBのチャレンジ解放ルート、その後はA/Bを切り替えながら最終Aルートとノード18を目指します。
const AUTO_SIM_TREE_COMMON=["1","2-2","3","4-1","5-1","6","7-3","7-2","8-1","9"];
const AUTO_SIM_TREE_A_INITIAL=[...AUTO_SIM_TREE_COMMON,"10-1","11-1","12-1","13-1"];
const AUTO_SIM_TREE_B_FIRST=[...AUTO_SIM_TREE_COMMON,"10-3","11-2","12-3","13-3"];
// 【目的】BルートでチャレンジA-4/A-5/A-6/P-6を解放するためのノードを、指定順で購入します。
// 【処理】A-5→A-6→A-4→P-6の順に必要ノードを並べ、購入順を保ったままTokenが足りない箇所で待機します。
const AUTO_SIM_TREE_B_LOOP=[...AUTO_SIM_TREE_B_FIRST,"14-2","15","16-2","17-2","13-2","10-2","11-1","12-1","13-1","14-1"];
// 【目的】Aルートを「Node15まで」と「チャレンジ一巡後の追加購入」に分離します。
// 【処理】追加購入はBルートのチャレンジ一巡後だけ実行し、初回AルートではNode15購入後にBへ切り替えます。
const AUTO_SIM_TREE_A_CORE=[...AUTO_SIM_TREE_A_INITIAL,"12-2","14-1","15"];
const AUTO_SIM_TREE_A_POST=["16-4","17-4","10-2","11-2","12-3","2-1","4-2","5-3","7-1","12-4","16-3","17-3"];
const AUTO_SIM_CHALLENGES_FIRST=[1,2,3,4,5,101,102,103];
// 【目的】構築Bでは、前半で試したA-1～A-3も含め、A-1～A-6を一巡するまでBを維持します。
// 【処理】P系チャレンジと全アセンションチャレンジを対象にし、未解放項目は解放されるまで構築Bで待ちます。
const AUTO_SIM_CHALLENGES_LOOP=[1,2,3,4,5,6,101,102,103,104,105,106];
function autoSimTokenTarget(){return (Number(state.stats.totalTranscendences)||0)===0?90:150}
function autoSimPhaseRoute(phase=state.autoSimulation?.planPhase){
  if(phase==="A_INITIAL")return [...AUTO_SIM_TREE_A_INITIAL];
  if(phase==="B_FIRST")return [...AUTO_SIM_TREE_B_FIRST];
  if(phase==="B_LOOP")return [...AUTO_SIM_TREE_B_LOOP];
  if(phase==="A_LOOP"){
    const sim=state.autoSimulation||{},route=[...AUTO_SIM_TREE_A_CORE];
    if(sim.aPostPending)route.push(...AUTO_SIM_TREE_A_POST);
    else if(currentTransTokenAtLeast(autoSimTokenTarget()))route.push("16-4","17-4");
    if(currentTransTokenAtLeast(autoSimTokenTarget()))route.push("18");
    return route;
  }
  return [...AUTO_SIM_TREE_A_INITIAL];
}
// 【目的】シミュレーション中にミニゲームを自動プレイし、各選択は期待値に基づいて決めます。
// 【処理】Ticketの必要予約分を残し、ハイ&ローは提示カードの半数を記憶、ビンゴは各抽選で30%の目押し成功率を使います。その他は公開情報から期待値を評価します。
function autoSimTicketBudget(){
  const ticket=getResourceUnits("ticket");
  if(!hasTransUpgrade("TU2"))return Number(gameDecimal(gameDecimal(ticket).div(FIXED_POINT_SCALE)).gt(gameDecimal(Number.MAX_SAFE_INTEGER))?gameDecimal(Number.MAX_SAFE_INTEGER):gameDecimal(ticket).div(FIXED_POINT_SCALE));
  const required=gameDecimal(numberToFixedUnits(1e6)).gt(getResourceUnits("lk"))?gameDecimal(numberToFixedUnits(1e6)).minus(getResourceUnits("lk")):gameDecimal(0);
  const multiplierUnits=numberToFixedUnits(Math.max(1e-9,lkMultiplier()));
  const reserve=gameDecimal(multiplierUnits).gt(gameDecimal("0"))?gameDecimal((gameDecimal(gameDecimal(gameDecimal(required).times(FIXED_POINT_SCALE)).plus(multiplierUnits)).minus(gameDecimal("1")))).div(multiplierUnits):gameDecimal(0);
  const available=gameDecimal(ticket).gt(reserve)?gameDecimal(ticket).minus(reserve):gameDecimal(0),whole=gameDecimal(available).div(FIXED_POINT_SCALE);
  return Number(gameDecimal(whole).gt(gameDecimal(Number.MAX_SAFE_INTEGER))?gameDecimal(Number.MAX_SAFE_INTEGER):whole);
}
function autoSimAddLk(gain){
  gain=Math.max(0,Number(gain)||0);if(!gain)return;
  addResourceGain("lk",gain,["transcendence"]);
  refreshAchievements(true);
}
function autoSimCardKey(c){return c?`${c.r}${c.s}`:""}
function autoSimHlProbability(current,remaining,memory){
  if(!remaining.length)return {high:0,low:0};
  const rank=highLowValue(current),known=remaining.filter(c=>memory.has(autoSimCardKey(c)));
  const unknown=remaining.length-known.length;
  // 忘れたカードは通常の残存ランク分布で評価し、実際の伏せ札の値は予測に使いません。
  const unseenRanks=[];for(let v=2;v<=14;v++)for(let n=0;n<4;n++)unseenRanks.push(v);
  const subtract=[current,...known];for(const c of subtract){const v=highLowValue(c),i=unseenRanks.indexOf(v);if(i>=0)unseenRanks.splice(i,1)}
  const denom=Math.max(1,unseenRanks.length);
  const pHigher=unseenRanks.filter(v=>v>rank).length/denom;
  const pLower=unseenRanks.filter(v=>v<rank).length/denom;
  const high=(known.filter(c=>highLowValue(c)>rank).length+unknown*pHigher)/remaining.length;
  const low=(known.filter(c=>highLowValue(c)<rank).length+unknown*pLower)/remaining.length;
  return {high,low};
}
function autoSimPlayHighLow(bet){
  let shown=shuffle(makeDeck()).slice(0,10),current=shown.pop(),deck=shuffle(shown);
  const memory=new Set(shuffle(shuffle([ ...shown,current ])).slice(0,5).map(autoSimCardKey));
  let amount=bet,hasWin=false,rounds=0,won=false;
  while(deck.length&&rounds++<12){
    const odds=autoSimHlProbability(current,deck,memory),best=Math.max(odds.high,odds.low);
    if(hasWin&&best<=.5)break;
    const dir=odds.high>=odds.low?"high":"low";autoSimChargeClick(`mini:hl:${dir}`);
    const next=deck.pop(),a=highLowValue(current),b=highLowValue(next);
    if(a===b){current=next;continue}
    const hit=(dir==="high"&&b>a)||(dir==="low"&&b<a);
    if(!hit){amount=0;hasWin=false;break}
    current=next;hasWin=true;won=true;
    const nextOdds=autoSimHlProbability(current,deck,memory),nextBest=Math.max(nextOdds.high,nextOdds.low);
    if(!deck.length||nextBest<=.5)break;
    amount*=2;
  }
  const gain=hasWin?gameDecimal(amount).times(lkMultiplier()):gameDecimal(0);autoSimAddLk(gain);
  state.autoSimulation.lastMiniGame="hl";
  autoSimSetAction(`ハイ&ロー（記憶率50% / ${won?`Lk +${fmt(gain)}`:"失敗"}）`,false);
}
function autoSimBlackjackMultiplier(value){return value>=22?0:value===21?10:value===20?3:value===19?2:value===18?1.5:value===17?1.3:value===16?1:value===15?.8:.5}
function autoSimPlayBlackjack(bet){
  const deck=shuffle(makeDeck());let hand=[deck.pop(),deck.pop()],steps=0;
  while(steps++<15){
    const value=handValue(hand);if(value>=21)break;
    const candidates=shuffle(deck).slice(0,Math.min(5,deck.length));if(!candidates.length)break;
    const standEV=autoSimBlackjackMultiplier(value);
    const hitEV=candidates.reduce((sum,c)=>sum+autoSimBlackjackMultiplier(handValue([...hand,c])),0)/candidates.length;
    if(hitEV<=standEV){autoSimChargeClick("mini:bj:stand");break;}
    autoSimChargeClick("mini:bj:hit");
    const card=candidates[Math.floor(Math.random()*candidates.length)];hand.push(card);
    const index=deck.findIndex(c=>autoSimCardKey(c)===autoSimCardKey(card));if(index>=0)deck.splice(index,1);
  }
  const gain=gameDecimal(bet).times(autoSimBlackjackMultiplier(handValue(hand))).times(lkMultiplier());autoSimAddLk(gain);
  state.autoSimulation.lastMiniGame="bj";autoSimSetAction(`ブラックジャック（期待値判断 / Lk +${fmt(gain)}）`,false);
}
const autoSimDiceEVCache=new Map();
function autoSimDiceExpectedAfterKeep(keptValues){
  const kept=[...keptValues].sort((a,b)=>a-b),key=kept.join(",");
  if(autoSimDiceEVCache.has(key))return autoSimDiceEVCache.get(key);
  const dice=[...kept],missing=5-dice.length;let total=0,count=0;
  const walk=()=>{if(dice.length===5){total+=dicePokerRole(dice).mult;count++;return}for(let v=1;v<=6;v++){dice.push(v);walk();dice.pop()}};
  if(missing===0){total=dicePokerRole(dice).mult;count=1}else walk();
  const value=total/Math.max(1,count);autoSimDiceEVCache.set(key,value);return value;
}
function autoSimDicePokerResolveRolls(initialDice,rollLimit=3){
  const dice=[...initialDice].slice(0,5).map(v=>Math.max(1,Math.min(6,Math.floor(Number(v)||1))));
  while(dice.length<5)dice.push(1+Math.floor(Math.random()*6));
  let rollsUsed=0;
  // 【目的】サイコロポーカーの振り直しを、現在の役と残りの出目の厳密な期待配当で選びます。
  // 【処理】保持する全32通りの期待倍率を比較し、改善しない場合は止め、改善する場合は最大3回まで振り直します。
  for(let roll=0;roll<Math.min(3,Math.max(0,Number(rollLimit)||0));roll++){
    const currentMult=dicePokerRole(dice).mult;let bestMask=31,bestEV=currentMult;
    for(let mask=0;mask<32;mask++){
      const kept=dice.filter((v,i)=>(mask&(1<<i))!==0),ev=autoSimDiceExpectedAfterKeep(kept);
      if(ev>bestEV+1e-9){bestEV=ev;bestMask=mask}
    }
    if(bestMask===31||bestEV<=currentMult+1e-9)break;
    autoSimChargeClick("mini:dice:reroll");
    for(let i=0;i<5;i++)if(!(bestMask&(1<<i)))dice[i]=1+Math.floor(Math.random()*6);
    rollsUsed++;
  }
  return {dice,rollsUsed,role:dicePokerRole(dice)};
}
function autoSimPlayDicePoker(bet){
  const hand=autoSimDicePokerResolveRolls(Array.from({length:5},()=>1+Math.floor(Math.random()*6)),3);
  autoSimChargeClick("mini:dice:payout");
  const gain=gameDecimal(bet).times(lkMultiplier()).times(hand.role.mult);autoSimAddLk(gain);
  state.autoSimulation.lastMiniGame="dice";autoSimSetAction(`サイコロポーカー（期待値最大の振り直し${hand.rollsUsed}回 / ${hand.role.name} / Lk +${fmt(gain)}）`,false);
}
// 【目的】シミュレーション開始時に残っていたサイコロポーカーも自動で完了させます。
// 【処理】既に支払われたTicketは再消費せず、残り回数を期待値判断で進めて配当を受け取り、対話UIに残って停滞する状態を解消します。
function autoSimResolveActiveDicePoker(){
  if(!autoSimulatorActive||!state.autoSimulation?.enabled||miniState?.type!=="dice")return false;
  const active=miniState;active.rolling=false;active.rollingDice=[];
  const hand=autoSimDicePokerResolveRolls(active.dice,active.rollsLeft);
  autoSimChargeClick("mini:dice:payout");

  const gain=base*hand.role.mult;autoSimAddLk(gain);
  state.lkResult=`サイコロポーカー: ${hand.role.name} ×${fmt(hand.role.mult)} / Lk +${fmt(gain)}`;
  miniState=null;miniResultVisible=true;state.autoSimulation.lastMiniGame="dice";
  state.autoSimulation.miniGameNextPlayAt=gameNow()+300000+Math.floor(Math.random()*300001);
  autoSimSetAction(`進行中のサイコロポーカーを自動完了（${hand.role.name} / Lk +${fmt(gain)}）`,false);
  autoSimNeedsSave=true;autoSimNeedsRender=true;return true;

// 【目的】追加Tokenの次回判定に加算する猶予時間をトランセンデンス回数に応じて短縮します。

  const describeTus=(list,startMs)=>list?.length?list.map(t=>`${escapeHtml(t.id)}（${formatDuration(Math.max(0,(Number(t.timeMs)||0)-startMs))}）`).join("、"):"なし";
  const transRows=(sr.transRuns||[]).map(run=>`<tr><td>${Number(run.index)||"—"}</td><td>${formatDuration(Number(run.durationMs)||0)}</td><td>${bestShow("transcendenceRun")}</td><td>${describeTus(run.tus,Number(run.startPlayMs)||0)}</td><td>${formatDuration(Number(run.totalPlayMs)||0)}</td></tr>`).join("");
  const currentTus=describeTus(sr.currentTransTus,Number(sr.transStartMs)||0);
  const review=sr.reviewSnapshots||{ascensions:[],transcendences:[]};
  const ascReview=(review.ascensions||[]).map((item,i)=>renderSimulationReviewSnapshot(item,"ascensions",i)).join("");
  const transReview=(review.transcendences||[]).map((item,i)=>renderSimulationReviewSnapshot(item,"transcendences",i)).join("");
  const reviewPanel=`<div class="panel"><h2>シミュレーション・リセット直前データ</h2><p class="small">シミュレーション実行中に保存したリセット直前の状態です。アセンションは直近20件、トランセンデンスは直近12件を保持し、各種類の直近2件は全状態、それ以前は比較用サマリーとして記録します。項目を開くと資源・倍率・ツリー・スライス・強化などを確認でき、JSONとしてコピーできます。</p><h3>直近20件のアセンション</h3>${ascReview||'<p class="small">まだアセンション直前データはありません。</p>'}<h3 style="margin-top:16px">直近12件のトランセンデンス</h3>${transReview||'<p class="small">まだトランセンデンス直前データはありません。</p>'}</div>`;
  const saveControls=`<div class="panel"><div class="row"><h2>スピードラン</h2><span class="spacer"></span><button id="saveSlotSwitchButton" type="button" onclick="switchSpeedrunSaveSlot()">${activeSaveSlot==="speedrun"?"本体セーブへ戻る":"スピードラン専用セーブへ移動"}</button>${localStorage.getItem("rouletteSpeedRunSave")?`<button class="danger" onclick="resetSpeedrunSaveSlot()">専用セーブをリセット</button>`:""}</div></div>`;
  // 【目的】本体・スピードランのどちらかでデバッグ機能を使った場合、両方のセーブでクリア祝いを隠します。
  // 【処理】2つの保存データと現在編集中のstateを横断し、アクセス解除・チート使用履歴・有効なチート設定を確認します。
  const saveDataHasDebugCheats=raw=>{
    if(!raw||typeof raw!=="object")return false;
    const c=raw.debugCheats||{};
    return !!raw.debugCheatsUsed||!!raw.debugCheatsEverUsed||!!raw.ui?.debugAccessUnlocked||!!(
      c.zeroCooldown||c.fastSpin||c.zeroIntervalBase||c.zeroIntervalSlice||c.zeroIntervalSliceBuy||c.zeroIntervalPrestige||
      Number(c.gameSpeed??1)!==1||c.paused
    );
  };
  const anySaveHasDebugCheats=(()=>{
    const current=saveDataHasDebugCheats(state);
    const stored=["rouletteAscensionSave","rouletteSpeedRunSave"].some(key=>{try{return saveDataHasDebugCheats(JSON.parse(localStorage.getItem(key)||"null"))}catch(_){return false}});
    return current||stored;
  })();
  const congratulations=!anySaveHasDebugCheats?`<div class="panel"><p style="font-weight:800">Roulette Incremental V0.1 クリアおめでとうございます</p><p>次のアップデートまでスピードランをしながらしばらくお待ちください</p></div>`:"";
  const simPanel=state.ui?.debugAccessUnlocked?`<div class="panel"><div class="row"><button class="primary" onclick="startAutoSimulation()" ${autoSimulatorActive||state.autoSimulation?.enabled||hasTransUpgrade("TU12")?"disabled":""}>完全自動シミュレーション開始</button><button class="danger" onclick="stopAutoSimulation('手動停止',true)" ${autoSimulatorActive||state.autoSimulation?.enabled?"":"disabled"}>停止</button></div><p id="autoSimStatus" class="note">${escapeHtml(autoSimStatusText())}</p><div id="autoSimResetMonitor">${autoSimResetMonitorMarkup()}</div><label style="display:block;margin:8px 0"><input type="checkbox" ${state.autoSimulation?.autoEquipSlices!==false?"checked":""} onchange="setAutoSimSliceOptimization(this.checked)"> スライス構成を自動最適化（手動変更時は自動的に一時停止）</label><p class="small">A初期ルート→B初回ルートでP-1～P-5/A-1～A-3に挑戦し、その後はAルートとBルートを切り替えます。Token獲得見込みが1未満なら通常アセンションは行いません。ただしB構築中にA-1～A-6を予約している場合は、追加Token不要でチャレンジ開始アセンションを実行します。B構築では解放済みチャレンジを一巡し、成功の有無でA/Bを選択します。アセンションチャレンジは失敗判定まで最大30分待機します。構築Aでは各アセンション後の追加0→1枚目は無期限、2枚目以降は前回の追加Token所要時間+10分を期限にします。期限到達時にToken見込みが低下していれば、記録済みの追加Token数へ到達した瞬間にアセンションします。入場条件を満たすアセンションチャレンジがあれば同時に開始します。構築Bでは前回追加Token間隔+20分を維持します。TU12購入で停止します。</p></div>`:"";
  const arrivalPanel=`<div class="panel"><h2>到達時間</h2><p class="small">最初のスピンからゲーム内累計プレイ時間を計測します。最速記録は2つのセーブで共有され、デバッグ用チート未使用のプレイだけが更新対象です。</p><table><tr><th>ステップ</th><th>今回</th><th>最速記録</th></tr>${rows.map(([name,key])=>`<tr><td>${name}</td><td>${show(key)}</td><td>${bestShow(key)}</td></tr>`).join("")}</table>${state.debugCheatsUsed?'<p class="small">デバッグ用チートを使用したため、このセーブの記録は最速記録に反映されません。</p>':""}</div>`;
  const transPanel=`<div class="panel"><h3>各トランセンデンス</h3><table><tr><th>回</th><th>所要時間</th><th>最速</th><th>その区間に購入したTU</th><th>ゲーム開始からの累計</th></tr>${transRows||'<tr><td colspan="5" class="small">まだトランセンデンスを実行していません。</td></tr>'}<tr><td>進行中</td><td>${formatDuration(Math.max(0,speedrunNow()-(Number(sr.transStartMs)||0)))}</td><td>${bestShow("transcendenceRun")}</td><td>${currentTus}</td><td>${formatDuration(speedrunNow())}</td></tr></table></div>`;
  return `${saveControls}${congratulations}${simPanel}${arrivalPanel}${transPanel}${state.ui?.debugAccessUnlocked?reviewPanel:""}`;
}

// 【処理】現在タブに対応する描画関数だけを呼び出し、通常の時間更新では呼び出しません。
function page(t){switch(t){case'roulette':return pageRoulette();case'customize':return pageCustomize();case'shop':return pageShop();case'rebirth':return pageRebirth();case'prestige':return pagePrestige();case'challenge':return pageChallenge();case'ascension':return pageAscension();case'transcendence':return pageTranscendence();case'minigame':return pageMini();case'achievements':return pageAchievements();case'speedrun':return pageSpeedrun();case'guide':return `<div class="panel"><h2>ガイド</h2>${guideContent()}</div>`;case'status':return pageStatus();case'settings':return pageSettings();default:return pageRoulette()}}

// 【目的】ゲーム全体を一定間隔で更新します。
// 【処理】スピン回復、Lk自動化、ショップ再入荷、チャレンジ判定、ヘッダー・テキスト更新だけを行い、DOM全体は作り直しません。
function tick(){
  // 【目的】自動シミュレーションと通常tickが同時にクールタイム・受動生産を処理する二重計上を防ぎます。
  // 【処理】シミュレーター実行中は通常tickを完全にスキップし、停止応答と画面更新だけを担当します。
  if(autoSimulatorActive&&state.autoSimulation?.enabled){
    if(!autoSimBatchRunning&&!autoSimBatchScheduled&&!autoSimStopRequested)runAutoSimulator();
    const simText=autoSimStatusText();for(const id of ["autoSimStatus","autoSimStatusSettings","autoSimOverlayStatus"]){const n=document.getElementById(id);if(n)n.textContent=simText;}
    syncAutoSimOverlay();return;
  }
  const now=gameNow(),dt=Math.max(0,now-state.lastTick);state.lastTick=now;
  if(gameClockPaused){updateHeaderText();updateTabDynamicText();return}
  if(state.playClockStarted){state.stats.totalPlayMs+=dt;state.period.dimensionBoost.totalPlayMs=(Number(state.period.dimensionBoost.totalPlayMs)||0)+dt;state.period.transcendence.totalPlayMs=(Number(state.period.transcendence.totalPlayMs)||0)+dt;}
  recoverSpinTick();runLkAutomation();runZeroIntervalAutomationCheats();
  const esGainUnits=essenceProductionGainUnits(dt);if(gameDecimal(esGainUnits).gt(gameDecimal("0"))){addResourceGainUnits("es",esGainUnits,["transcendence"]);}
  if(runDestinyAutomation()){save();renderAppAfterAutomation()}
  if(now>=state.shopNextRefresh){refillShop(true);save()}
  refreshUnlocks();refreshGuideUnlocks();playCheck();refreshAchievements(true);updateHeaderText();updateTabDynamicText();refreshOpenPurchaseButtons();refreshOpenProgressTab();
  if(autoSimulatorActive&&!autoSimBatchRunning){runAutoSimulator();const simText=autoSimStatusText();for(const id of ["autoSimStatus","autoSimStatusSettings"]){const simStatus=document.getElementById(id);if(simStatus)simStatus.textContent=simText;}}
  if(state.autoSpin&&state.everRank>=1&&spinAvailable()&&autoSpinCanRun()&&!state.rotation)spin();
}

function resetAchievementToastBaseline(){
  achievementToastLevels={};
  for(const a of achievementDefs)achievementToastLevels[a.id]=achievementLevel(a.id);
  achievementToastReady=true;
}

// 【目的】利用できないボタンもクリックイベントを受け取れる状態にし、見た目だけを半透明にします。
// 【処理】disabled属性を表示用マーカーへ置換し、クリック時はキャプチャ段階でイベントを止めるため、利用不可の処理は実行されません。
const softDisableInternalRemoval=new WeakSet();
function markSoftDisabledButton(button){
  if(!(button instanceof HTMLButtonElement)||!button.hasAttribute("disabled"))return;
  button.dataset.softDisabled="true";button.classList.add("soft-disabled");
  softDisableInternalRemoval.add(button);button.removeAttribute("disabled");
}
function normalizeSoftDisabledButtons(root){
  if(!root)return;
  if(root instanceof HTMLButtonElement)markSoftDisabledButton(root);
  if(root.querySelectorAll)root.querySelectorAll("button[disabled]").forEach(markSoftDisabledButton);
}
document.addEventListener("click",event=>{
  const target=event.target instanceof Element?event.target:null;
  // 【目的】一時停止中に操作でゲーム状態が進まないようにします。
  // 【処理】タブ移動と「ゲーム再開」だけ許可し、それ以外のゲーム内クリックは停止します。
  if(gameClockPaused&&target&&!target.closest("#gamePauseToggle")&&!target.closest("#gamePauseToggleDock")&&!target.closest("#saveSlotSwitchButton")&&!target.closest("#tabs")&&!(currentTab==="settings"&&target.closest("#content"))){
    event.preventDefault();event.stopImmediatePropagation();event.stopPropagation();return;
  }
  const button=target?target.closest('button[data-soft-disabled="true"]'):null;
  if(button){event.preventDefault();event.stopImmediatePropagation();event.stopPropagation();}
},true);
normalizeSoftDisabledButtons(document);
const softDisabledObserver=new MutationObserver(records=>{
  for(const record of records){
    if(record.type==="attributes"&&record.target instanceof HTMLButtonElement){
      const button=record.target;
      if(button.hasAttribute("disabled")){markSoftDisabledButton(button);continue;}
      if(softDisableInternalRemoval.has(button)){softDisableInternalRemoval.delete(button);continue;}
      // 【目的】動的な購入可否更新後、再び購入可能になったボタンを確実にクリック可能にします。
      // 【処理】ゲーム側がdisabled属性を外した場合は古いソフト無効化マーカーと見た目を解除します。
      if(button.dataset.softDisabled==="true"){delete button.dataset.softDisabled;button.classList.remove("soft-disabled");}
    }
    for(const node of record.addedNodes||[])normalizeSoftDisabledButtons(node);
  }
});
softDisabledObserver.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["disabled"]});
normalizeSoftDisabledButtons(document);

// 【目的】ブラウザを終了したときにも最新状態を保存します。
// 【処理】自動セーブは静かに行い、プレイヤーへのトーストは表示しません。
load();
// 【目的】再読み込み後にシミュレーションが勝手に再開して操作を奪うことを防ぎます。
// 【処理】進行中フラグだけ解除し、保存済みのゲーム進行・戦略フェーズを保持して停止状態で起動します。
if(state.autoSimulation?.enabled){state.autoSimulation.enabled=false;state.autoSimulation.lastAction="ページ再読み込みで停止（進行状況は保持）";autoSimulatorActive=false;autoSimRestoreSettings();save();}
renderApp();syncAutoSimOverlay();resetAchievementToastBaseline();setInterval(tick,250);setInterval(()=>{if(!document.hidden){updateHeaderText();updateTabDynamicText()}},100);setInterval(save,5000);setInterval(createAutomaticBackup,AUTO_BACKUP_INTERVAL_MS);
// 【目的】F5やタブ終了時に、保存データへ回転中フラグが残らないようにします。
// 【処理】ブラウザの再読み込み動作は妨げず、離脱直前に回転だけを解除して保存します。
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&autoSimulatorActive){e.preventDefault();e.stopImmediatePropagation();stopAutoSimulation("Escキーで停止",true);return}
  // 【目的】ボタンにフォーカスしたままEnterを押し続ける連続クリックを抑止します。
  // 【処理】Enterの自動リピート時だけ既定動作を止め、最初の1回は有効にします。
  if(e.key==="Enter"&&e.repeat&&document.activeElement?.tagName==="BUTTON"){e.preventDefault();e.stopImmediatePropagation();return}
  if(e.key==="F5"){state.rotation=false;pendingSpinIndex=null;wheelDisplayEquipped=null;save()}
},true);
window.addEventListener("pagehide",()=>flushSave());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave()});
window.addEventListener("beforeunload",()=>{state.rotation=false;pendingSpinIndex=null;wheelDisplayEquipped=null;flushSave()});
const colorScheme=window.matchMedia?.("(prefers-color-scheme: dark)");if(colorScheme){const onSystemThemeChange=()=>{if(state.settings.theme==="system"){applyTheme();save();updateDynamicText()}};if(colorScheme.addEventListener)colorScheme.addEventListener("change",onSystemThemeChange);else if(colorScheme.addListener)colorScheme.addListener(onSystemThemeChange)}
</script>
</body>
</html>
