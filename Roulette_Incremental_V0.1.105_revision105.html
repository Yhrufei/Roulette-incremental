<style>

.rPsP{color:var(--psp)} .rToken{color:var(--token)} .rTicket{color:#9c8300}.rLk{color:var(--lk)} .rCtl{color:#008040}.rEs{color:#408000}.rDt{color:#a58c00}

.tabbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:10px;white-space:nowrap}

.slice-codex-entry{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-width:130px}

.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))} .settings-icon-grid{grid-template-columns:repeat(auto-fill,60px);grid-auto-flow:row dense;justify-content:start;align-content:start;gap:8px}

/* 【目的】長いスライス説明を狭いカードへ押し込まず、カード寸法を揃えたまま内部スクロールで読めるようにします。 */

.card.slice-card{height:340px;min-height:340px;max-height:340px;display:flex;flex-direction:column;overflow:hidden;}
.slice-card-heading{flex:0 0 auto;min-width:0;max-height:86px;overflow:auto;overscroll-behavior-y:auto;scrollbar-gutter:stable;}
.slice-card-scroll{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior-y:auto;scrollbar-gutter:stable;overflow-wrap:anywhere;padding:2px 4px 2px 0;}

.slice-card-actions{flex:0 0 auto;max-height:92px;overflow:auto;overscroll-behavior-y:auto;border-top:1px solid var(--border);margin-top:8px;padding-top:7px;}
.card.shop-offer-card{height:292px;min-height:292px;max-height:292px;display:flex;flex-direction:column;overflow:hidden;}

.shop-offer-actions{flex:0 0 auto;padding-top:7px;}
.slice-codex-entry{height:92px;min-height:92px;max-height:92px;overflow:auto;overscroll-behavior-y:auto;scrollbar-gutter:stable;white-space:normal;overflow-wrap:anywhere;}
.customize-overview-panel>.row,.customize-owned-controls{min-width:0;gap:8px;}

.customize-owned-controls label{white-space:nowrap;flex:0 0 auto;}
.customize-slice-item{min-width:0;}
.autoSimEntryDetail{max-height:3.8em;overflow:auto;overscroll-behavior-y:auto;scrollbar-gutter:stable;overflow-wrap:anywhere}

/* 【目的】自動シミュレーション中に、各チャレンジの入場条件とロードアウト別の達成率を表示します。 */
.autoSimEntryProgress{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:12px}
.autoSimEntrySummary{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}

.locked{opacity:.55}

.slice-name{font-weight:700}

.boostList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.note{padding:9px 11px;background:var(--panel2);border-left:4px solid var(--accent);border-radius:8px}

.nodeCol{display:flex;flex-direction:column;gap:10px}

.node small{display:block;color:var(--muted);margin-top:4px}

.tree-loadouts{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:10px 0}.tree-loadout-active{border-color:var(--accent)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.challengeBar{position:fixed;left:14px;bottom:14px;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 11px;box-shadow:0 5px 18px rgba(0,0,0,.12);width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 120px);overflow:auto}.active-challenge-panel+.active-challenge-panel{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}.challenge-goal{margin-top:7px}.challenge-goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}.challenge-goal-head span{color:var(--muted)}.challenge-goal .progress{height:9px;margin-top:4px}
.treeSvgWrap{width:100%;height:700px;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:8px}.rank-achieved{background:color-mix(in srgb,var(--good) 14%,var(--panel))}.rank-upcoming{background:color-mix(in srgb,var(--accent) 8%,var(--panel))}.spinResult{min-height:54px}.bingo-wrap{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.bingo-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bingo-board{border-collapse:separate;border-spacing:6px;margin:8px auto 14px;width:min(100%,360px);table-layout:fixed}.bingo-board td{position:relative;height:70px;text-align:center;vertical-align:middle;border:2px solid var(--border);border-radius:9px;background:var(--panel2);font-size:20px;font-weight:800;overflow:hidden}.bingo-board td.is-hit{background:rgba(58,190,115,.22);border-color:#32b768}.bingo-hole{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:46px;color:#32b768;opacity:.75}.bingo-board td.is-hit .bingo-hole{display:flex}.bingo-ball-stage{min-height:110px;display:flex;align-items:center;justify-content:center;margin:10px 0}.bingo-ball{width:92px;height:92px;border-radius:50%;background:var(--ball,#fff);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.24),0 3px 9px rgba(0,0,0,.18)}.bingo-ball::before{content:"";position:absolute;width:65%;height:65%;left:17.5%;top:17.5%;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.18)}.bingo-ball-number{position:relative;z-index:1;color:#111;font-size:28px;font-weight:900}.bingo-history{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.bingo-history-item{border:1px solid var(--border);border-radius:8px;padding:4px 7px;font-size:13px}.bingo-board td>span:first-child{position:relative;z-index:1}.bingo-hole{z-index:2;pointer-events:none}.bingo-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.bingo-result{padding:10px;border-radius:8px;margin-top:10px;background:rgba(58,190,115,.12)}.bingo-ball.is-spinning{animation:bingo-pulse .28s ease-in-out infinite}@keyframes bingo-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.dice-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}.die-choice{display:flex;flex-direction:column;align-items:center;gap:4px}.die{font-size:54px;line-height:1.15;width:76px;height:76px;display:grid;place-items:center;border:2px solid var(--border);border-radius:12px;background:var(--panel2);box-shadow:0 3px 7px rgba(0,0,0,.12)}.die-face{width:52px;height:52px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;padding:5px;box-sizing:border-box;background:#fff;border-radius:8px}.pip{width:100%;height:100%;max-width:11px;max-height:11px;border-radius:50%;background:#19202a;justify-self:center;align-self:center}.die-choice input{margin-right:4px}.die.roll{animation:dice-roll .12s infinite alternate}@keyframes dice-roll{from{transform:translateY(-4px) rotate(-7deg)}to{transform:translateY(4px) rotate(7deg)}}

.treeDetails{margin-top:12px}
.resetFx{animation:resetFx .45s ease-out forwards}
@keyframes resetFx{0%{opacity:0;transform:scale(.96)}25%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}
details summary{cursor:pointer;font-weight:700}
.kbd{padding:2px 6px;border:1px solid var(--border);border-radius:5px;background:var(--panel2);font-family:monospace}
@media(max-width:760px){
  .tabs{top:0;position:relative}

/* ===== 読みやすいUI用の追加スタイル ===== */
.dynamicText{font-variant-numeric:tabular-nums}
.rank-achieved{background:color-mix(in srgb,var(--good) 16%,var(--panel));font-weight:700}

.card-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}

  .transcendence-accent{background:#008040!important;border-color:#008040!important;color:#fff!important}

.app-dialog-root[hidden]{display:none!important}
.app-dialog-card{width:min(560px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 12px 40px #0007}
.app-dialog-card h2{margin:0 0 10px;font-size:1.15rem}
.app-dialog-message{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 12px;line-height:1.55}
.app-dialog-input{width:100%;min-height:96px;resize:vertical;border:1px solid var(--border);border-radius:9px;background:var(--panel2);color:var(--text);padding:10px;font:inherit}
.app-dialog-text{white-space:pre-wrap;max-height:min(70vh,760px);overflow:auto;line-height:1.85;margin:14px 0;padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);}
.app-dialog-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.app-dialog-actions button{min-width:88px}


/* 【目的】スライスの装備・強化ボタンと購入プレビューを明確に分けます。 */
/* 【処理】ボタンを左列、まとめ買いのコスト・購入レベルを右列へ固定し、カード下部に独立テキストを残しません。 */
.slice-action-layout{display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;gap:9px;width:100%;}
.slice-action-buttons{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:max-content;}
.slice-action-info{min-width:0;line-height:1.35;overflow-wrap:anywhere;}
.slice-effect-preview{line-height:1.45;}
.status-period-btn{border:1px solid var(--border);background:var(--panel2);border-radius:8px;min-width:38px;min-height:36px;padding:5px;display:inline-flex;align-items:center;justify-content:center}.status-period-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.game-speed-dock{position:fixed;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 16px);padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 4px 18px #0003}.game-speed-dock[hidden]{display:none}.game-speed-dock button{padding:5px 8px;font-size:12px}
/* 【目的】タブ内の各セクションを一貫した見た目で開閉できるようにします。 */
.collapsible-tab-section{padding:0!important;overflow:hidden}
.collapsible-tab-section>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;min-height:48px;user-select:none}
.collapsible-tab-section>summary::-webkit-details-marker{display:none}
.collapsible-tab-section>summary::after{content:"▾";margin-left:auto;color:var(--muted);font-size:14px;transition:transform .15s ease}
.collapsible-tab-section:not([open])>summary::after{transform:rotate(-90deg)}
.collapsible-tab-section>summary h2,.collapsible-tab-section>summary h3,.collapsible-tab-section>summary h4,.collapsible-tab-section>summary h5{margin:0!important}
.collapsible-tab-section>summary>.row{width:100%;margin:0!important}
.collapsible-tab-section-body{padding:0 16px 16px}

.auto-spin-reserve-control{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:7px 2px 10px}
.auto-spin-reserve-control label{font-size:13px}
 .auto-spin-reserve-control input[type=range]{width:min(260px,100%);accent-color:var(--accent)}
/* 【目的】タブ見出しの先頭アイコンを、隣接する見出しテキストと同じ大きさに揃えます。 */
/* 【処理】画像の元サイズに関係なく1emへ統一し、行高と中央位置を合わせます。 */
.tab-page-title-icon{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;flex:0 0 1em;line-height:1;vertical-align:-.12em;margin-right:.12em;}
.tab-page-title-icon img.resource-icon{display:block!important;width:1em!important;height:1em!important;max-width:1em!important;max-height:1em!important;object-fit:contain;}
.tab-page-title-icon .inline-emoji-icon{font-size:1em;line-height:1;}

</style>

<script>
'use strict';
const ExtendedDecimal = globalThis.Decimal;
if(typeof ExtendedDecimal !== 'function') throw new Error('break_eternity.js の読み込みに失敗しました');
// 【目的】ゲーム内時間をデバッグ速度に合わせて進めます。
// 【処理】実時間を基準に仮想時刻を連続計算し、速度切替時に時刻が飛ばないようアンカーを更新します。
let gameClockRealAnchor=Date.now();
let gameClockVirtualAnchor=gameClockRealAnchor;
let gameClockScale=1;
let gameClockPaused=false;
function normalizedGameSpeed(value){const n=Number(value);return [2,3,5,10].includes(n)?n:1}
function gameNow(){return gameClockPaused?gameClockVirtualAnchor:gameClockVirtualAnchor+(Date.now()-gameClockRealAnchor)*gameClockScale}
function initializeGameClockFromState(){
  const real=Date.now(),offset=Number(state?.debugCheats?.gameClockOffset)||0;
  gameClockPaused=!!state?.debugCheats?.paused;
  gameClockRealAnchor=real;
  const savedPausedTime=Number(state?.debugCheats?.pausedVirtualTime);
  gameClockVirtualAnchor=gameClockPaused&&Number.isFinite(savedPausedTime)&&savedPausedTime>0?savedPausedTime:real+offset;
  gameClockScale=normalizedGameSpeed(state?.debugCheats?.gameSpeed);
}
function setGameClockScale(value,persist=true){
  const real=Date.now(),virtual=gameNow();
  gameClockRealAnchor=real;gameClockVirtualAnchor=virtual;gameClockScale=normalizedGameSpeed(value);if(gameClockScale!==1)markDebugCheatUsed();
  if(typeof state!=="undefined"&&state){if(!state.debugCheats)state.debugCheats={};state.debugCheats.gameSpeed=gameClockScale;state.debugCheats.gameClockOffset=virtual-real;if(gameClockPaused)state.debugCheats.pausedVirtualTime=virtual;state.lastTick=virtual;if(persist){save();renderApp();toast(`ゲーム速度を${gameClockScale}倍にしました`)}}
}
// 【目的】デバッグ用チートからゲーム内時間を一時停止・再開します。
// 【処理】仮想時刻をアンカーとして固定し、停止中の時間が再開時や再読み込み後に加算されないようにします。
function setGameClockPaused(paused,persist=true){
  const real=Date.now(),virtual=gameNow();
  gameClockRealAnchor=real;gameClockVirtualAnchor=virtual;gameClockPaused=!!paused;if(gameClockPaused)markDebugCheatUsed();
  if(typeof state!=="undefined"&&state){
    if(!state.debugCheats)state.debugCheats={};
    state.debugCheats.paused=gameClockPaused;
    state.debugCheats.pausedVirtualTime=gameClockPaused?virtual:null;
    state.debugCheats.gameClockOffset=virtual-real;
    state.lastTick=virtual;
    if(persist){save();renderApp();toast(gameClockPaused?"ゲームを一時停止しました":"ゲームを再開しました")}
  }
}
function toggleGamePause(){setGameClockPaused(!gameClockPaused)}
function runAfterUnpaused(callback){if(gameClockPaused){setTimeout(()=>runAfterUnpaused(callback),100);return}callback()}

// 【目的】チャレンジのレベル別の係数を読みやすく表示します。
// 【処理】小数第2位までに整え、末尾の不要な0を取り除きます。
function challengeExponent(n){return Number(n.toFixed(2)).toString()}
// 【目的】クリア済みレベル数と次回挑戦レベルを共通管理します。
// 【処理】各チャレンジの進行を0～5の整数に制限し、初回はLv1、Lv5クリア後は最大達成とします。
function challengeCompletedLevels(id){return Math.max(0,Math.min(5,Math.floor(Number(state.challengeProgress?.[id])||0)))}
function challengeLevel(id){return Math.min(5,challengeCompletedLevels(id)+1)}
function activeChallengeLevel(id){const active=getActiveChallenge(id);return active?Math.max(1,Math.min(5,Number(active.level)||challengeLevel(id))):challengeLevel(id)}
function challengeMaxed(id){return challengeCompletedLevels(id)>=5}
function challengeInfo(c,level=challengeLevel(c.id)){return {handicap:typeof c.handicap==='function'?c.handicap(level):c.handicap,goal:typeof c.goal==='function'?c.goal(level):c.goal,bonus:typeof c.bonus==='function'?c.bonus(level):c.bonus}}
function challengeCurrentBonus(c){const cleared=challengeCompletedLevels(c.id);return cleared>0?challengeInfo(c,cleared).bonus:'なし（未クリア）'}
function challengeNextBonus(c){const cleared=challengeCompletedLevels(c.id);return cleared>=5?'最大レベル達成':challengeInfo(c,cleared+1).bonus}

function achievementLevel(id){return state.achievements?.unlocked?.[id]?Math.max(0,Number(state.achievements.levels?.[id])||0):0}
function achievementMultiplier(id){const def=achievementDefs.find(x=>x.id===id);return gameDecimal(def?def.mult(achievementLevel(id)):1)}
// 【目的】実績の残高・回数・目標値をすべてDecimalへ揃えます。
// 【処理】実績値と目標値はすでに通常の通貨・回数単位なので、固定小数点スケールで再除算せずDecimal同士で比較します。
const MAX_ACHIEVEMENT_LEVEL=1000000;
function achievementValueDecimal(value){return gameDecimal(value??0)}
function achievementTargetDecimal(def,level){return achievementValueDecimal(def.target(level))}
function achievementReached(def,value,level){return value.gte(achievementTargetDecimal(def,level))}
function calculateAchievementLevel(def,value,currentLevel){
  let low=Math.max(0,Math.min(MAX_ACHIEVEMENT_LEVEL,Math.floor(Number(currentLevel)||0)));
  if(low>=MAX_ACHIEVEMENT_LEVEL||!achievementReached(def,value,low))return low;
  let high=Math.min(MAX_ACHIEVEMENT_LEVEL,Math.max(1,low+1));
  while(high<MAX_ACHIEVEMENT_LEVEL&&achievementReached(def,value,high)){
    low=high;high=Math.min(MAX_ACHIEVEMENT_LEVEL,high*2);
  }
  if(high===MAX_ACHIEVEMENT_LEVEL&&achievementReached(def,value,high))return MAX_ACHIEVEMENT_LEVEL;
  while(low+1<high){const mid=Math.floor((low+high)/2);if(achievementReached(def,value,mid))low=mid;else high=mid;}
  return Math.min(MAX_ACHIEVEMENT_LEVEL,low+1);
}
// 【目的】桁数が大きく伸びる目標の進捗を、対数目盛りのゲージへ変換します。
// 【処理】前の目標値を基準に log(現在値/前の目標値 + 1) / log(次の目標値/前の目標値 + 1) を計算し、0～100%へ収めます。
function log10OnePlusFixedRatio(numeratorUnits,denominatorUnits){
  if(gameDecimal(numeratorUnits).lte(gameDecimal("0")))return 0;
  if(gameDecimal(denominatorUnits).lte(gameDecimal("0")))return Infinity;
  const delta=gameDecimal(log10FixedUnits(numeratorUnits)).minus(log10FixedUnits(denominatorUnits));
  if(gameDecimal(delta).gt(16))return delta;
  if(gameDecimal(delta).lt(-16))return toExtendedDecimal(10).pow(delta).div(Math.LN10).toNumber();
  return toExtendedDecimal(10).pow(delta).plus(1).log10().toNumber();
}
function logProgressPercent(value,target,previousGoal=1){
  if((value instanceof ExtendedDecimal)||(target instanceof ExtendedDecimal)||(previousGoal instanceof ExtendedDecimal)){
    const v=(value instanceof ExtendedDecimal)?value:numberToFixedUnits(value),previous=(previousGoal instanceof ExtendedDecimal)?previousGoal:numberToFixedUnits(previousGoal),goal=(target instanceof ExtendedDecimal)?target:numberToFixedUnits(target);
    const safePrevious=gameDecimal(previous).gt(gameDecimal("0"))?previous:FIXED_POINT_SCALE,denominator=log10OnePlusFixedRatio(goal,safePrevious);
    if(!Number.isFinite(denominator)||denominator<=0)return gameDecimal(v).gte(goal)?100:0;
    const numerator=log10OnePlusFixedRatio(v,safePrevious),ratio=numerator/denominator;
    return Math.max(0,Math.min(100,(Number.isFinite(ratio)?ratio:0)*100));
  }
  const v=Math.max(0,Number(value)||0),previous=Math.max(Number.MIN_VALUE,Number(previousGoal)||1),goal=Math.max(previous,Number(target)||previous);
  const denominator=Math.log10(gameDecimal(1).plus(gameDecimal(goal).div(previous)));
  if(!Number.isFinite(denominator)||denominator<=0)return gameDecimal(v).gte(goal)?100:0;
  const ratio=Math.log10(gameDecimal(1).plus(gameDecimal(v).div(previous)))/denominator;
  return Math.max(0,Math.min(100,(Number.isFinite(ratio)?ratio:0)*100));
}
// 【目的】条件達成済みの実績を永続解放し、現在値に応じてレベルアップします。
// 【処理】未解放実績は表示・効果対象にせず、解放後はリセット後も状態とレベルを維持します。
function refreshAchievements(notify=false){
  if(!state.achievements)state.achievements={levels:{},unlocked:{}};
  if(!state.achievements.levels)state.achievements.levels={};
  if(!state.achievements.unlocked)state.achievements.unlocked={};
  if(!state.stats.completedChallenges)state.stats.completedChallenges={};
  for(const a of achievementDefs){if(a.unlock()&&!state.achievements.unlocked[a.id]){state.achievements.unlocked[a.id]=true;if(currentTab!=="achievements")markTabHighlight("achievements")}}
  // 【目的】Revision101で固定小数点の再除算により過剰に上がった数値系実績を、Revision102への初回更新時に補正します。
  // 【処理】累計・最高記録で再現できるスピン回数・Rank・Prestige回数は現在の正しい実績値から再計算し、履歴を復元できないチャレンジ実績は正当な最大Lv30を上限にします。
  if(state.achievements.decimalScaleCorrectionV102!==true){
    for(const id of ["spins","rank","prestigeCount"]){
      const def=achievementDefs.find(item=>item.id===id);
      if(def&&state.achievements.unlocked[id]){
        const corrected=calculateAchievementLevel(def,achievementValueDecimal(def.value()),0);
        state.achievements.levels[id]=corrected;
        achievementToastLevels[id]=corrected;
      }
    }
    if(state.achievements.levels.challenges!=null){
      state.achievements.levels.challenges=Math.min(30,Math.max(0,Math.floor(Number(state.achievements.levels.challenges)||0)));
      achievementToastLevels.challenges=state.achievements.levels.challenges;
    }
    state.achievements.decimalScaleCorrectionV102=true;
  }
  for(const a of achievementDefs){
    if(!state.achievements.unlocked[a.id])continue;
    const currentLevel=Math.max(0,Number(state.achievements.levels[a.id])||0);
    const value=achievementValueDecimal(a.value());
    const level=calculateAchievementLevel(a,value,currentLevel);
    state.achievements.levels[a.id]=level;
    const notifiedLevel=Math.max(0,Number(achievementToastLevels[a.id]??0)||0);
    if(notify&&achievementToastReady&&level>notifiedLevel){
      const gained=level-notifiedLevel;if(currentTab!=="achievements")markTabHighlight("achievements");playSfx("achievement");toast(`${a.name}の実績がレベル${level}に上がりました${gained>1?`（${gained}レベル上昇）`:""}`);
    }
    if(notify)achievementToastLevels[a.id]=level;
  }
}

function challengeDisplayId(c){if(!c)return "";return c.layer==="prestige"?`P-${c.id}`:`A-${c.id-100}`}
function challengeByDisplayId(s){return challenges.find(c=>challengeDisplayId(c)===s)||null}

// 【目的】チャレンジのレイヤー優先順位を共通化し、下位レイヤーへの挑戦を上位予約・挑戦中でも許可します。
// 【処理】プレステージ=0、アセンション=1、トランセンデンス=2とし、予約キューは下位レイヤーを先に処理します。
function challengeLayerOrder(layer){return layer==="prestige"?0:layer==="ascension"?1:layer==="transcendence"?2:-1}
// 【目的】レイヤーをまたいで同時進行するチャレンジを、旧セーブとも互換のある形で管理します。
// 【処理】state.challengeを互換用の主チャレンジとして残し、追加チャレンジはparallelChallengesに保持します。上位レイヤーを主状態として優先します。
function activeChallengeEntries(){
  const raw=[state.challenge,...(Array.isArray(state.parallelChallenges)?state.parallelChallenges:[])].filter(c=>c&&Number.isFinite(Number(c.id)));
  const seen=new Set(),entries=[];
  for(const c of raw){const id=Number(c.id);if(seen.has(id))continue;seen.add(id);const def=challenges.find(x=>Number(x.id)===id);if(!c.layer)c.layer=def?.layer||"prestige";if(!Number(c.startedAt))c.startedAt=id===Number(state.challenge?.id)?(Number(state.challengeStartedAt)||gameNow()):gameNow();entries.push(c)}
  return entries.sort((a,b)=>challengeLayerOrder(b.layer)-challengeLayerOrder(a.layer)||Number(a.id)-Number(b.id));
}
function setActiveChallengeEntries(entries){
  const unique=new Map();for(const c of entries||[]){if(!c||!Number.isFinite(Number(c.id)))continue;const id=Number(c.id),def=challenges.find(x=>Number(x.id)===id);unique.set(id,{...c,id,layer:def?.layer||c.layer||"prestige",startedAt:Number(c.startedAt)||gameNow()})}
  const ordered=[...unique.values()].sort((a,b)=>challengeLayerOrder(b.layer)-challengeLayerOrder(a.layer)||Number(a.id)-Number(b.id));
  state.challenge=ordered[0]||null;state.parallelChallenges=ordered.slice(1);state.challengeStartedAt=state.challenge?Number(state.challenge.startedAt)||gameNow():0;
}
function getActiveChallenge(id){return activeChallengeEntries().find(c=>Number(c.id)===Number(id))||null}
function hasAnyActiveChallenge(){return activeChallengeEntries().length>0}
function challengeStartedAtFor(challengeOrId){const c=typeof challengeOrId==="object"&&challengeOrId?challengeOrId:getActiveChallenge(challengeOrId);return Math.max(0,Number(c?.startedAt)||(Number(c?.id)===Number(state.challenge?.id)?Number(state.challengeStartedAt):0)||gameNow())}
function removeActiveChallenge(id){setActiveChallengeEntries(activeChallengeEntries().filter(c=>Number(c.id)!==Number(id)))}
function normalizeActiveChallengeState(){const old=state.challenge,oldStart=Number(state.challengeStartedAt)||gameNow();const entries=[old,...(Array.isArray(state.parallelChallenges)?state.parallelChallenges:[])].filter(Boolean).map(c=>({...c,startedAt:Number(c.startedAt)||(Number(c.id)===Number(old?.id)?oldStart:gameNow())}));setActiveChallengeEntries(entries)}
function challengeQueueEntries(){
  const all=[state.challengeQueue,...(Array.isArray(state.challengeQueueBacklog)?state.challengeQueueBacklog:[])].filter(q=>q&&Number.isFinite(Number(q.id))&&(q.layer==="prestige"||q.layer==="ascension"));
  const unique=new Map();for(const q of all){const id=Number(q.id);if(!unique.has(id)){const c=challenges.find(x=>Number(x.id)===id);unique.set(id,{id,layer:c?.layer||q.layer});}}
  return [...unique.values()].sort((a,b)=>challengeLayerOrder(a.layer)-challengeLayerOrder(b.layer)||a.id-b.id);
}
function setChallengeQueueEntries(entries){
  const unique=new Map();for(const q of entries||[]){if(!q)continue;const id=Number(q.id),c=challenges.find(x=>x.id===id);if(!c||challengeMaxed(id))continue;unique.set(id,{id,layer:c.layer});}
  const ordered=[...unique.values()].sort((a,b)=>challengeLayerOrder(a.layer)-challengeLayerOrder(b.layer)||a.id-b.id);
  state.challengeQueue=ordered.shift()||null;state.challengeQueueBacklog=ordered;
}
function removeQueuedChallengeEntry(id){setChallengeQueueEntries(challengeQueueEntries().filter(q=>Number(q.id)!==Number(id)))}
function promoteQueuedChallenge(){setChallengeQueueEntries(challengeQueueEntries())}
function challengePriorityLabel(c){return c?`${challengeDisplayId(c)}「${c.name}」`:"対象チャレンジ"}
function challengeActionBlockMessage(c){
  if(!c)return "チャレンジが見つかりません";
  const targetOrder=challengeLayerOrder(c.layer);
  for(const active of activeChallengeEntries())if(targetOrder>=challengeLayerOrder(active.layer))return `${challengePriorityLabel(active)}が進行中です`;
  const lowerQueued=challengeQueueEntries().find(q=>challengeLayerOrder(q.layer)<targetOrder);
  if(lowerQueued){const queued=challenges.find(x=>x.id===lowerQueued.id);return `まず${challengePriorityLabel(queued)}の予約を取り消してください`}
  const sameLayerQueued=challengeQueueEntries().find(q=>challengeLayerOrder(q.layer)===targetOrder&&Number(q.id)!==Number(c.id));
  if(sameLayerQueued){const queued=challenges.find(x=>x.id===sameLayerQueued.id);return `${challengePriorityLabel(queued)}を先に処理してください`}
  return "";
}
function challengeResetBlockMessage(level,matchingQueueId=null){
  const targetOrder=level==="rebirth"?-1:level==="prestige"?0:level==="ascension"||level==="dimensionBoost"?1:level==="transcendence"?2:-1;
  for(const active of activeChallengeEntries())if(targetOrder>=challengeLayerOrder(active.layer))return `${challengePriorityLabel(active)}が進行中です`;
  const blocking=challengeQueueEntries().find(q=>challengeLayerOrder(q.layer)<targetOrder||(challengeLayerOrder(q.layer)===targetOrder&&Number(q.id)!==Number(matchingQueueId)));
  if(blocking){const c=challenges.find(x=>x.id===blocking.id);return `まず${challengePriorityLabel(c)}の予約を取り消してください`}
  return "";
}
function challengeResetAllowed(level,matchingQueueId=null){const message=challengeResetBlockMessage(level,matchingQueueId);if(message){toast(message);return false}return true}

// 【目的】一時的な通知を表示します。

// 【処理】ユーザーがこのページで一度でもポインター操作をしてから音を有効化し、設定で効果音を無効にできるようにします。

function playSfx(kind="tap"){
  if(!soundHasUserClicked||state?.settings?.sound===false)return;
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  const patterns={
    tab:[[520,.045],[690,.05]],spin:[[280,.07],[420,.09]],slice:[[560,.06],[760,.08]],buy:[[660,.07],[880,.1]],upgrade:[[440,.06],[590,.06],[790,.1]],
    reset:[[560,.09],[380,.12],[250,.16]],challenge:[[500,.07],[700,.07],[920,.13]],achievement:[[660,.06],[880,.06],[1100,.15]],restock:[[420,.05],[600,.07]],node:[[500,.06],[740,.08]]
  };
  if(!state.settings.rouletteSfx&&["rouletteSpin","rouletteSlice"].includes(kind))return;
  patterns.rouletteSpin=patterns.spin;patterns.rouletteSlice=patterns.slice;
  const notes=patterns[kind]||patterns.tab;
  try{
    if(!soundContext)soundContext=new Ctx();
    if(soundContext.state==="suspended")soundContext.resume();
    let t=soundContext.currentTime;
    for(const [frequency,duration] of notes){
      const osc=soundContext.createOscillator(),gain=soundContext.createGain();
      osc.type="sine";osc.frequency.setValueAtTime(frequency,t);
      gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      osc.connect(gain);gain.connect(soundContext.destination);osc.start(t);osc.stop(t+duration+.01);t+=duration*.86;

}

// 【目的】ブラウザ標準のalert/confirm/promptを使わず、ゲーム内モーダルで応答を取得します。

let appDialogResolve=null;

function closeAppDialog(value=null){

function showAppDialog(options={}){

  const title=escapeHtml(options.title|| (mode==="confirm"?"確認":mode==="prompt"?"入力":mode==="text"?"テキスト":"お知らせ"));
  const message=options.messageHtml?String(options.message||""):escapeHtml(options.message||"");
  const isInput=mode==="prompt",isText=mode==="text",isParagraph=isText&&options.paragraph===true;
  const inputMarkup=isParagraph?`<p class="app-dialog-text" id="appDialogValue">${escapeHtml(options.value??"")}</p>`:(isInput||isText)?`<textarea class="app-dialog-input" id="appDialogValue" ${isText?'readonly':''} aria-label="${isText?'コピーするテキスト':'入力内容'}">${escapeHtml(options.value??options.defaultValue??"")}</textarea>`:"";
  const okLabel=escapeHtml(options.okLabel||(mode==="confirm"?"続行":mode==="prompt"?"決定":"閉じる"));
  const cancelMarkup=mode==="confirm"||mode==="prompt"?`<button type="button" data-dialog-action="cancel">${escapeHtml(options.cancelLabel||"キャンセル")}</button>`:"";
  const copyMarkup=isText&&!options.hideCopy?`<button type="button" data-dialog-action="copy">コピー</button>`:"";
  root.innerHTML=`<section class="app-dialog-card" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle"><h2 id="appDialogTitle">${title}</h2><p class="app-dialog-message">${message}</p>${inputMarkup}<div class="app-dialog-actions">${copyMarkup}${cancelMarkup}<button type="button" class="primary" data-dialog-action="ok">${okLabel}</button></div></section>`;
  return new Promise(resolve=>{
    appDialogResolve=resolve;
    root.querySelector('[data-dialog-action="ok"]')?.addEventListener("click",()=>{
      const input=root.querySelector("#appDialogValue");closeAppDialog(isInput?(input?.value??""):mode==="confirm"?true:null);

// 【目的】数値を設定に応じた短縮表記へ変換します。
// 【処理】ユーザー指定のShort表記ルールを使い、必要なら科学表記・工学表記にも切り替えます。
// 【目的】Numberとbreak_eternity.jsのDecimalで、同じ数値形式設定を使って表示します。
// 【処理】Short各種・アルファベット・科学表記・工学表記をDecimalの指数演算で処理し、巨大数をNumberへ変換しません。
function fmt(n){
  if(n instanceof ExtendedDecimal){
    if(n.isNan())return "NaN";
    if(!n.isFinite())return n.sign<0?"-∞":"∞";
    if(n.eq(0))return "0";
    const negative=n.lt(0),abs=n.abs(),sign=negative?"-":"";
    if(abs.lt(1000)){const small=abs.toNumber();return `${sign}${Number(small.toFixed(3)).toString()}`}
    const mode=Number(state?.settings?.numberFormat)||5;
    const exponentDecimal=abs.log10().floor(),exponent=exponentDecimal.toNumber();
    if(!Number.isFinite(exponent)||Math.abs(exponent)>=1e15)return `${sign}${abs.toString()}`;
    const scientific=()=>{
      const mantissa=abs.div(gamePow(10,exponent)).toNumber();
      return `${sign}${mantissa.toFixed(2)}e${exponent}`;
    };
    if(mode===5)return scientific();
    if(mode===6){
      const e=Math.floor(exponent/3)*3;
      const mantissa=abs.div(gamePow(10,e)).toNumber();
      return `${sign}${mantissa.toFixed(2)}e${e}`;
    }
    if(mode>=1&&mode<=3){
      const maxExponent=mode===1?14:mode===2?32:302;
      if(exponent>maxExponent)return scientific();
      const group=Math.floor(exponent/3);
      if(group<1)return `${sign}${abs.toNumber().toFixed(0)}`;
      const scaled=abs.div(gamePow(1000,group)).toNumber();
      const shortMantissa=mode===1&&group===4?scaled.toFixed(3).replace(/\.?0+$/,""):scaled.toPrecision(3);
      const names={1:"K",2:"M",3:"B",4:"T",5:"Qa",6:"Qi",7:"Sx",8:"Sp",9:"Oc",10:"No"};
      let suffix=names[group];
      if(!suffix){
        const a=["","U","D","T","Q","Qi","S","Sp","O","N"][(group-1)%10]||"";
        const b=["","De","Vi","Tr","Qd","Qu","Sg","St","Og","Ng"][Math.floor((group-1)/10)]||"";
        suffix=`${a}${b}`;
      }
      return `${sign}${shortMantissa}${suffix}`;
    }
    if(mode===4){
      const group=Math.floor(exponent/3);
      if(group<1)return `${sign}${abs.toNumber().toPrecision(3)}`;
      // 極端に長い接尾辞は読みづらくなるため、科学表記へ切り替えます。
      if(group>10000)return scientific();
      let x=group,suffix="";
      while(x>0){x--;suffix=String.fromCharCode(97+x%26)+suffix;x=Math.floor(x/26)}
      const scaled=abs.div(gamePow(1000,group)).toNumber();
      return `${sign}${scaled.toPrecision(3)}${suffix}`;
    }
    return scientific();
  }
  if(typeof n==="string"&&/^[-+]?\d+(?:\.\d+)?e[-+]?\d+$/i.test(n)){try{return fmt(gameDecimal(n))}catch(_){return "0"}}
  n=Number(n);
  if(!Number.isFinite(n))return n===Infinity?"∞":"0";
  if(Math.abs(n)<1000)return Number(n.toFixed(3)).toString();
  const mode=Number(state.settings.numberFormat)||5;
  if(mode===5)return n.toExponential(2).replace("e+","e");
  if(mode===6){const e=Math.floor(Math.log10(Math.abs(n))/3)*3;return `${(n/Math.pow(10,e)).toFixed(2)}e${e}`}
  if(mode>=1&&mode<=3)return short(n,mode===1?14:mode===2?30:300);
  if(mode===4){
    const e=Math.floor(Math.log10(Math.abs(n))/3)*3,idx=e/3;
    if(idx<1)return n.toPrecision(3);
    let x=idx,s="";
    while(x>0){x--;s=String.fromCharCode(97+x%26)+s;x=Math.floor(x/26)}
    return `${(n/Math.pow(1000,idx)).toPrecision(3)}${s}`;
  }
  return n.toPrecision(3);
}

// 【目的】Short形式の単位を変換します。
// 【処理】K/M/B/TからNo以降の2文字単位まで、指定された添字計算で生成します。
function short(n,maxE){
  const e=Math.floor(Math.log10(Math.abs(n))/3)*3;
  if(e<3)return n.toFixed(0);
  if(e>maxE)return n.toExponential(2).replace("e+","e");
  const names={1:"K",2:"M",3:"B",4:"T",5:"Qa",6:"Qi",7:"Sx",8:"Sp",9:"Oc",10:"No"};
  const idx=e/3;
  if(names[idx]){const scaled=n/Math.pow(10,e),mantissa=maxE===14&&idx===4?scaled.toFixed(3).replace(/\.?0+$/,""):scaled.toPrecision(3);return `${mantissa}${names[idx]}`;}
  const a=["","U","D","T","Q","Qi","S","Sp","O","N"][(idx-1)%10]||"";
  const b=["","De","Vi","Tr","Qd","Qu","Sg","St","Og","Ng"][Math.floor((idx-1)/10)]||"";
  return `${(n/Math.pow(10,e)).toPrecision(3)}${a}${b}`;
}

// 【目的】プレイヤーが入力したTicket数を数値へ変換します。
// 【処理】通常の数値、5e4、50.0e3、1.5K、1.5kなどを内部数値に変換しますが、入力欄の文字列自体は変更しません。
function parseAmountUnits(value){
  const raw=String(value??"").trim().replace(/,/g,"");if(!raw)return gameDecimal(0);
  const m=raw.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:e([+-]?\d+))?\s*([a-zA-Z]+)?$/i);if(!m)return gameDecimal(0);
  const suffix={k:1,m:2,b:3,t:4,qa:5,qi:6,sx:7,sp:8,oc:9,no:10};
  const unit=m[3]?suffix[m[3].toLowerCase()]:0;if(unit==null)return gameDecimal(0);
  const exponent=Number(m[2]||0)+unit*3;if(!Number.isFinite(exponent))return gameDecimal(0);
  return numberToFixedUnits(`${m[1]}e${exponent}`);
}

// 【目的】レベルアップに必要なExpを返します。
// 【処理】現在レベルに応じた必要Expを計算し、Expバーやデバッグ・Lvアップ処理で共有します。
// 【目的】Lvの一の位が9の必要Exp倍率を、以降10Lvごとに×1.5へ切り替えます。
// 【処理】Lv9→10、19→20、29→30…でのみ段階倍率を増加させます。
// 【目的】次Lvに必要なExpを小数6桁のDecimal固定小数点で返します。
// 【処理】20×1.1^(Lv-1)×1.5^floor((Lv+1)/10) をbreak_eternity.jsのDecimal累乗で計算し、固定上限は適用しません。
function expReqDecimal(lv){
  const levelText=(lv instanceof ExtendedDecimal)?(gameDecimal(lv).gt(0)?lv:gameDecimal(1)).toString():String(Math.max(1,Math.floor(Number(lv)||1)));
  const level=new ExtendedDecimal(levelText);
  const firstGrowth=gameDecimal(1.1).pow(level.minus(1));
  const secondExponent=level.plus(1).div(10).floor();
  return gameDecimal(20).times(firstGrowth).times(gameDecimal(1.5).pow(secondExponent));
}
function expReqUnits(lv){return decimalToFixedUnits(expReqDecimal(lv))}
function expReq(lv){return expReqDecimal(lv)}
// 【目的】Rankごとのリボーン必要Lvを定数時間で正確に求めます。
// 【処理】10Rank単位の増分を等差数列の和へ変形し、Rankが大きくても逐次ループしません。
function rebirthRequiredLv(rank=state.rank){const r=Math.max(0,Math.floor(Number(rank)||0)),q=Math.floor(r/10),rem=r%10;return 10+10*r+25*q*(q-1)+5*q*rem}
// 【目的】まとめてリボーンで、現在Lvから到達できる最大Rankを求めます。
// 【処理】次Rankへ到達する条件 rebirthRequiredLv(target-1) <= Lv を二分探索します。
function batchRebirthTargetRank(lv=state.lv,rank=state.rank){const current=Math.max(0,Math.floor(Number(rank)||0)),level=Math.max(0,Number(lv)||0),canReach=target=>rebirthRequiredLv(target-1)<=level;let lo=current+1,hi=Math.min(Number.MAX_SAFE_INTEGER,Math.max(lo+1,lo*2));while(hi<Number.MAX_SAFE_INTEGER&&canReach(hi)){lo=hi;hi=Math.min(Number.MAX_SAFE_INTEGER,hi*2)}if(!canReach(lo))return current;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(canReach(mid))lo=mid;else hi=mid-1}return lo}
function dimensionEnergyCapBonus(){const ds=resourceDecimal("dimensionScore");if(ds.lt(2000))return gameDecimal(0);return ds.minus(2000).div(10).sqrt().floor().min(200).max(0)}
function dimensionEnGainMultiplier(){const ds=resourceDecimal("dimensionScore");return ds.lt(10000)?gameDecimal(1):ds.div(10000).pow(.1).max(1).min(1.5)}
function dimensionPtExpMultiplier(){return resourceDecimal("dimensionScore").sqrt().max(1)}
function dimensionPspMultiplier(){const ds=resourceDecimal("dimensionScore");return ds.lt(500)?gameDecimal(1):ds.div(500).pow(.25).max(1)}
function dimensionLkMultiplier(){const ds=resourceDecimal("dimensionScore");return ds.lt(1000)?gameDecimal(1):ds.div(1000).pow(.25).max(1)}
function dimensionTicketMultiplier(){const ds=resourceDecimal("dimensionScore");return ds.lt(5000)?gameDecimal(1):ds.div(5000).pow(.15).max(1)}
function dimensionOtherScoreMultiplier(){return gameDecimal(hasTree("16-4")?2:1).times(1+challengeCompletedLevels(104))}
function calculateDimensionScore(){
  // 【目的】Pt・Rank・PsPからDSを算出し、10^1024を超える値も保持します。
  // 【処理】残高の対数と倍率をDecimalで評価し、Numberへ戻さず返します。
  const pt=gameDecimal(getOwnerDecimal(state,"pt")),psp=resourceDecimal("psp");
  const ptLog=pt.gt(0)?pt.log10():gameDecimal(0),pspLog=psp.gt(0)?psp.log10():gameDecimal(0);
  const ptTerm=ptLog.gt(24)?ptLog.minus(18):gameDecimal(1).plus(pt.div("1e18")).log10();
  const pspTerm=pspLog.gt(10)?pspLog.minus(10):gameDecimal(1).plus(psp.div("1e10")).log10();
  const rankTerm=gameDecimal(effectiveRank()).minus(24).max(0);
  return ptTerm.times(rankTerm).times(pspTerm).times(dimensionOtherScoreMultiplier()).times(dimensionScoreMultiplier()).max(0);
}

// 【目的】スピン回復の待ち時間を返します。
// 【処理】基礎能力、PsP強化、ツリー、チャレンジによる短縮・延長をまとめて計算します。
function spinCooldown(){
  if(state.debugCheats?.zeroCooldown)return 0;
  let c=15*Math.pow(.95,state.baseUpgrades.cooldown||0)*Math.pow(.93,state.prestigeUpgrades.prestigeCd||0);
  if(hasTree("4-2"))c*=.75;
  if(isChallenge(3))c*=(4+activeChallengeLevel(3));
  const weakenedLevel=challengeCompletedLevels(102);
  if(weakenedLevel>0)c*=Math.max(.1,1-(25+5*weakenedLevel)/100);
  return c;
}

// 【目的】現在の最大スピン所持数を返します。
// 【処理】PsP強化とチャレンジ#3の制限を反映し、常に1以上を返します。
function spinMax(){let m=3+(state.prestigeUpgrades.spinCap||0);if(isChallenge(3))m=Math.max(1,Math.floor(m*.2));return m}
// 【目的】各種リセット後にスピンを所持上限まで補充します。
// 【処理】回復待ちを解除し、リセット後の強化・チャレンジ状態を反映したspinMax()まで一括補充します。
function restoreSpinsAfterReset(){state.spins=spinMax();state.cooldownUntil=0;ensureSpinRecoveryTimer();}
function levelPtMult(){return isChallenge(1)?gameDecimal(1):gameDecimal(1+.05*(state.lv-1)).pow(1+.5*(hasTransUpgrade("TU4")?1:0))}
// 【目的】Rank由来のPt/Exp倍率を、指定された6段階のソフトキャップで抑えます。
// 【処理】実倍率の境界100・1e3・1e5・1e7・1e9・1e11に対し、以後の増加分へ順に0.8・0.7・0.6・0.5・0.4・0.3乗を適用して境界を連続接続します。
const RANK_SOFTCAP_THRESHOLDS=[100,1e3,1e5,1e7,1e9,1e11];

function markTabHighlight(id){
  // 【目的】設定で通知を切ったタブは強調表示しません。
  // 【処理】通知設定を確認し、有効なタブだけを未読状態にします。

function unlockTabIf(id,condition){

// 【目的】新しく表示可能になった要素を一度だけ検知し、該当タブを強調します。
// 【処理】初回実行では既存の解放状態を通知済みとして記録し、以後は未記録IDだけを通知します。リセット後の再解放は既読状態で抑止します。
function collectUnlockNoticeSnapshot(){
  const snapshot={challenges:{},minigames:{},shopSlices:{},upgrades:{},statusItems:{},treeNodes:{},sliceCollection:{},affordableTransUpgrades:{}};
  const put=(group,id)=>{snapshot[group][String(id)]=true};
  for(const c of challenges){let unlocked=false;try{unlocked=!!c.req()}catch(_){unlocked=false}if(unlocked)put("challenges",c.id)}
  if(state.unlockedTabs.minigame){put("minigames","hl");put("minigames","bj");if(hasTree("11-1"))put("minigames","dice");if(hasTree("14-2"))put("minigames","bingo")}
  const rarities=new Set(availableShopRarities());
  for(const [id,s] of Object.entries(SLICES))if(rarities.has(s.rarity)&&shopSliceUnlocked(s,id))put("shopSlices",id);
  // 【目的】図鑑の全スライスを初めて集め終えた瞬間にカスタマイズタブを通知します。
  // 【処理】所持または取得履歴のあるIDを数え、全件揃った時だけ完了フラグをスナップショットへ追加します。
  const allSliceIds=Object.keys(SLICES),collectedSliceCount=allSliceIds.filter(id=>!!(state.sliceCollectionSeen?.[id]||state.slices?.[id])).length;
  if(allSliceIds.length>0&&collectedSliceCount>=allSliceIds.length)put("sliceCollection","complete");

  const addUpgrades=(tab,defs)=>{for(const u of defs||[])put("upgrades",`${tab}:${u.id}`)};
  addUpgrades("shop",baseUpgrades.filter(u=>(u.id!=="spinSpeed"||Number(state.stats.totalRebirths||0)>0)&&(!["energyMax","nextPsp"].includes(u.id)||Number(state.stats.totalPrestiges||0)>0)&&(!u.treeReq||hasTree(u.treeReq))));
  addUpgrades("prestige",prestigeUpgrades.filter(u=>!u.treeReq||hasTree(u.treeReq)));
  if(state.unlockedTabs.minigame)addUpgrades("minigame",lkUpgradeDefs.filter(u=>!u.treeReq||hasTree(u.treeReq)));
  const transUnlocked=hasTree("18")||(Number(state.stats.totalTranscendences)||0)>0;
  if(transUnlocked){
    addUpgrades("transcendence",essenceUpgradeDefs);
    // 【目的】トランセンデンスアップグレードが実際に購入可能になった瞬間だけ同タブを強調します。
    // 【処理】未購入・実装済みのアップグレードについて対応通貨残高を確認し、購入可能IDを専用スナップショットへ記録します。
    for(const u of transUpgradeDefs){
      if(hasTransUpgrade(u.id)||u.unavailable||!Number.isFinite(u.cost)||!u.currency||u.currency==="unknown")continue;
      const cost=typeof u.costUnits==="function"?u.costUnits():numberToFixedUnits(u.cost);
      if(resourceAtLeast(u.currency,cost))put("affordableTransUpgrades",u.id);
    }
    if(hasTransUpgrade("TU2"))addUpgrades("minigame",destinyUpgradeDefs.slice(0,hasTransUpgrade("TU6")?destinyUpgradeDefs.length:4));
  }
  for(const id of Object.keys(tree))if(nodeVisible(id))put("treeNodes",id);

  const st=state.stats||{};
  ["ptMult","expMult","playTime","spinCount","earnedPt","earnedExp"].forEach(id=>put("statusItems",id));
  if(gameDecimal(getFixedField(st,"totalPsp")).gt(gameDecimal("0"))||gameDecimal(getResourceUnits("psp")).gt(gameDecimal("0")))put("statusItems","pspMult");
  if(gameDecimal(getFixedField(st,"totalTicket")).gt(gameDecimal("0")))put("statusItems","ticketMult");
  if(gameDecimal(getFixedField(st,"totalLk")).gt(gameDecimal("0")))put("statusItems","lkMult");
  if(Number(st.totalDimensionBoosts)>0||hasTree("9"))put("statusItems","dsMult");
  if(gameDecimal(getFixedField(st,"totalCtl")).gt(gameDecimal("0")))put("statusItems","ctlMult");
  if(gameDecimal(getFixedField(st,"totalEs")).gt(gameDecimal("0")))put("statusItems","esMult");
  if(gameDecimal(getFixedField(st,"totalDt")).gt(gameDecimal("0")))put("statusItems","dtMult");
  if(Number(st.totalRebirths)>0)put("statusItems","rebirthCount");
  if(Number(state.everRank)>0)put("statusItems","rankReached");
  if(Number(st.totalPrestiges)>0)put("statusItems","prestigeCount");
  if(gameDecimal(getFixedField(st,"totalPsp")).gt(gameDecimal("0")))put("statusItems","pspGain");
  if(Number(st.totalDimensionBoosts)>0||hasTree("9"))put("statusItems","dimensionBoostCount");
  if(Number(st.totalAscensions)>0)put("statusItems","ascensionCount");
  if(gameDecimal(getFixedField(st,"totalToken")).gt(gameDecimal("0")))put("statusItems","tokenGain");
  if(gameDecimal(getFixedField(st,"totalTicket")).gt(gameDecimal("0")))put("statusItems","ticketGain");
  if(gameDecimal(getFixedField(st,"totalLk")).gt(gameDecimal("0")))put("statusItems","lkGain");
  if(Number(st.maxDimensionScore)>0||resourceDecimal("dimensionScore").gt(0))put("statusItems","maxDs");
  if(Number(st.totalTranscendences)>0)put("statusItems","transcendenceCount");
  if(gameDecimal(getFixedField(st,"totalCtl")).gt(gameDecimal("0")))put("statusItems","ctlGain");
  if(gameDecimal(getFixedField(st,"totalEs")).gt(gameDecimal("0")))put("statusItems","esGain");
  if(gameDecimal(getFixedField(st,"totalDt")).gt(gameDecimal("0")))put("statusItems","dtGain");
  return snapshot;
}
function scanUnlockHighlights(){
  if(!state.unlockNoticeSeen)state.unlockNoticeSeen=structuredClone(defaultState.unlockNoticeSeen);
  const seen=state.unlockNoticeSeen,snapshot=collectUnlockNoticeSnapshot();
  const groups=Object.keys(snapshot);
  if(!seen.initialized){
    for(const group of groups){seen[group]=seen[group]||{};for(const id of Object.keys(snapshot[group]))seen[group][id]=true;}
    seen.initialized=true;return;
  }
  const tabFor={challenges:"challenge",minigames:"minigame",shopSlices:"shop",statusItems:"status",treeNodes:"ascension",sliceCollection:"customize",affordableTransUpgrades:"transcendence"};
  for(const group of groups){
    seen[group]=seen[group]||{};
    for(const id of Object.keys(snapshot[group])){
      if(seen[group][id])continue;
      seen[group][id]=true;
      const tab=group==="upgrades"?id.split(":",1)[0]:tabFor[group];
      if(tab)markTabHighlight(tab);
    }
  }
}

// 【目的】獲得したPtを最終的な倍率付きで加算します。
// 【処理】チャレンジ補正、各リセット単位の統計、最大Pt統計まで同時に更新します。
function addPtRaw(raw){
  // 【目的】Pt獲得をbreak_eternity.jsで直接計算し、Numberへ丸めず資源・統計へ記録します。
  // 【処理】チャレンジ補正をDecimalで適用し、現在残高・通算・期間統計・最大記録を同じDecimal値で更新します。
  let gain=gameDecimal(raw);
  gain=gain.max(0).times(basePtMultiplier());
  if(isChallenge(1))gain=gain.pow(.75-.05*activeChallengeLevel(1));
  if(isChallenge(101))gain=gain.pow(.85-.05*activeChallengeLevel(101));
  if(isChallenge(104)){const seconds=Math.floor(Math.max(0,gameNow()-challengeStartedAtFor(104))/1000)+30;gain=gain.div(gamePow(1+.1*activeChallengeLevel(104),seconds));}
  if(isChallenge(106))gain=gain.pow(.12-.02*activeChallengeLevel(106));
  gain=gain.times(1+challengeCompletedLevels(1)).times(1+1.5*challengeCompletedLevels(3)).max(0);
  if(gain.lte(0))return 0;
  addOwnerDecimal(state,"pt",gain);addOwnerDecimal(state.stats,"totalPt",gain);
  const current=resourceDecimal("pt");
  for(const base of ["maxPtPrestige","maxPtAscension"]){if(current.gt(getOwnerDecimal(state.stats,base)))setOwnerDecimal(state.stats,base,current)}
  if(activeSpinGainTracker){const approx=gain.toNumber();activeSpinGainTracker.pt=safeAddFiniteNumber(activeSpinGainTracker.pt,Number.isFinite(approx)?approx:Number.MAX_VALUE)}
  for(const layer of ["transcendence","rebirth","prestige","ascension","dimensionBoost"])if(state.period?.[layer])addOwnerDecimal(state.period[layer],"pt",gain);
  refreshAchievements();return gain.toNumber();
}

// 【目的】獲得Expを加算し、必要量に達したら連続してLvアップさせます。
// 【処理】Expは「現在レベルの必要量を消費→次レベルへ」の順で処理し、余ったExpを次レベルへ正しく持ち越します。
function addExpRaw(raw){
  // 【目的】Exp獲得とLv必要ExpをDecimalで処理し、1e310を超える獲得でも正しくLv進行させます。
  // 【処理】Decimalで補正・加算し、現在Lvの必要量を順番に消費します。1回の更新上限は10000Lvで、残りExpは保持され次tickで続行します。
  let gain=gameDecimal(raw);
  gain=gain.max(0).times(baseExpMultiplier());
  if(isChallenge(2))gain=gain.pow(.75-.05*activeChallengeLevel(2));
  if(isChallenge(101))gain=gain.pow(.85-.05*activeChallengeLevel(101));
  if(isChallenge(104)){const seconds=Math.floor(Math.max(0,gameNow()-challengeStartedAtFor(104))/1000)+30;gain=gain.div(gamePow(1+.1*activeChallengeLevel(104),seconds));}
  if(isChallenge(106))gain=gain.pow(.12-.02*activeChallengeLevel(106));
  gain=gain.times(1+challengeCompletedLevels(2)).times(1+1.5*challengeCompletedLevels(3)).max(0);
  if(gain.lte(0))return 0;
  // 【目的】前回リボーン後にExpが何回加算されたかをシミュレーションの編成判断に使います。
  // 【処理】正のExp獲得イベントごとに1回だけ数え、複数Lv上昇や獲得量の大きさでは増やしません。
  if(state.period?.rebirth)state.period.rebirth.expGainCount=Math.max(0,Math.floor(Number(state.period.rebirth.expGainCount)||0))+1;
  addResourceDecimalGain("exp",gain,["transcendence","rebirth","prestige","ascension","dimensionBoost"]);
  if(activeSpinGainTracker){const approx=gain.toNumber();activeSpinGainTracker.exp=safeAddFiniteNumber(activeSpinGainTracker.exp,Number.isFinite(approx)?approx:Number.MAX_VALUE)}
  let guard=0,required;
  while(guard++<10000){required=expReqDecimal(state.lv);if(resourceDecimal("exp").lt(required))break;subtractOwnerDecimal(state,"exp",required);state.lv++;onLevelUp()}
  refreshAchievements();return gain.toNumber();
}

function onLevelUp(){
  // 【目的】統計に通算・各期間の最高到達Lvを記録します。
  // 【処理】レベル上昇のたびに各期間の最高値を更新し、現在のプレステージ内の最高到達Lvへ到達した後の待機時計を開始・再開始します。
  state.stats.maxLv=Math.max(1,Number(state.stats.maxLv)||1,Number(state.lv)||1);
  for(const layer of ["rebirth","prestige","ascension","dimensionBoost","transcendence"]){if(state.period?.[layer])state.period[layer].maxLv=Math.max(1,Number(state.period[layer].maxLv)||1,Number(state.lv)||1)}
  const prestigeWait=state.autoSimulation;
  // 【目的】前回リボーン直前のLvへ初めて到達した瞬間に、プレステージ前の5秒待機を開始します。
  // 【処理】到達目標は固定し、待機終了時刻が未設定の場合だけ設定します。待機中にさらにLvが上がってもタイマーを再スタートしません。
  if(prestigeWait?.enabled&&Number(prestigeWait.postRebirthPrestigeTargetLv)>0&&Number(state.lv)>=Number(prestigeWait.postRebirthPrestigeTargetLv)&&!(Number(prestigeWait.postRebirthPrestigeReadyAt)>0)){
    prestigeWait.postRebirthPrestigeReadyAt=speedrunNow()+5000;
    prestigeWait.lastAction=`前回リボーン到達Lv ${fmtFullCount(prestigeWait.postRebirthPrestigeTargetLv)}：プレステージまで5秒待機`;
    autoSimNeedsSave=true;autoSimNeedsRender=true;
  }
  // 【目的】リボーン条件を新たに満たしたタイミングでリボーンタブを強調します。
  // 【処理】プレイヤーLvが次の必要Lvへ到達した場合だけ強調し、通常の表示更新は行いません。
  if(!state.challenge&&!isBlockedByChallenge("rebirth")&&state.lv>=rebirthRequiredLv())markTabHighlight("rebirth");
  // 【目的】Lv到達報酬のNextPsPを獲得倍率から独立させ、スピン結果にも記録します。
  // 【処理】ブースト倍率を参照せずNextPsPを直接加算し、実際の獲得量を結果表示用トラッカーへ記録します。
  if(state.lv>=30&&state.lv%5===0){const gain=gameDecimal(5).times(gamePow(LEVEL_PSP_BONUS_EFFECT_BASE,(state.lv-25)/5));addResource("nextPsp",gain);if(activeSpinGainTracker){const n=gain.toNumber();activeSpinGainTracker.pspNext=safeAddFiniteNumber(activeSpinGainTracker.pspNext,Number.isFinite(n)?n:Number.MAX_VALUE)}}
  if(state.lv>=30)state.stats.reachedLv30ThisPrestige=true;
}

// 【目的】スライスLvに応じたPt/Expの基礎獲得量を返します。
// 【処理】Lv1を「0回強化」として扱い、レアリティ基礎値×Lv成長率で具体的な獲得量を計算します。
// 【目的】スライスの効果成長底と、初期コスト差を補うレアリティ倍率を一元管理します。
// 【処理】無限Lvスライスのコスト底1.2に対し、初期コスト比を対数で求め、各効果底の累乗として補正倍率を自動算出します。
const SLICE_INITIAL_COST_BY_RARITY={Common:10,Uncommon:75,Rare:500,Epic:1250,Legendary:100000,Mythical:2500000};
const SLICE_COST_GROWTH_BASE=1.2;
const PTE_SLICE_EFFECT_BASE=1.08;
const PSP_EFFECT_BASE_EXPONENT=Math.log(1.5)/Math.log(Math.sqrt(Math.pow(1.1,10)*1.5));
const PSP_SLICE_EFFECT_BASE=Math.pow(1.08,PSP_EFFECT_BASE_EXPONENT);
const NEXT_PSP_UPGRADE_EFFECT_BASE=Math.pow(Math.pow(1.25,PSP_EFFECT_BASE_EXPONENT),BASE_UPGRADE_EFFECT_EXPONENT);
const PSP_SLICE_EFFECT_BASE_FORMULA="1.08^(log(1.5)/log(sqrt(1.1^10*1.5)))";
const NEXT_PSP_UPGRADE_EFFECT_BASE_FORMULA="(1.25^(log(1.5)/log(sqrt(1.1^10*1.5))))^(log(1.08)/log(1.2))";
function unlimitedSliceRarityCompensation(effectBase,rarity){
  const commonCost=SLICE_INITIAL_COST_BY_RARITY.Common;
  const initialCost=SLICE_INITIAL_COST_BY_RARITY[rarity]??commonCost;
  const costExponent=Math.log(initialCost/commonCost)/Math.log(SLICE_COST_GROWTH_BASE);
  return Math.pow(effectBase,costExponent);
}
const UNLIMITED_PTE_RARITY_MULT=Object.fromEntries(Object.keys(RARITY).map(rarity=>[rarity,unlimitedSliceRarityCompensation(PTE_SLICE_EFFECT_BASE,rarity)]));
const UNLIMITED_PSP_RARITY_MULT=Object.fromEntries(Object.keys(RARITY).map(rarity=>[rarity,unlimitedSliceRarityCompensation(PSP_SLICE_EFFECT_BASE,rarity)]));
function sliceYield(id,lv=sliceLv(id)){
  const s=SLICES[id];if(!s)return gameDecimal(0);
  const rarityMult=s.max===Infinity?(UNLIMITED_PTE_RARITY_MULT[s.rarity]||1):1;
  return gameDecimal(RARITY[s.rarity].yield).times(rarityMult).times(gamePow(PTE_SLICE_EFFECT_BASE,Math.max(0,lv-1)));
}
function pspYield(id,lv=sliceLv(id)){
  const s=SLICES[id];if(!s)return gameDecimal(2);
  const rarityMult=s.max===Infinity?(UNLIMITED_PSP_RARITY_MULT[s.rarity]||1):1;
  return gameDecimal(2).times(rarityMult).times(gamePow(PSP_SLICE_EFFECT_BASE,Math.max(0,lv-1)));
}
// 【目的】スライス由来のNextPsPに、その時点のPsP倍率を反映します。
// 【処理】倍率適用済みの加算分を別管理し、プレステージ時に同じ倍率を二重適用しないようにします。
function addNextPspFromSlice(raw){
  const rawDecimal=gameDecimal(raw).max(0);if(rawDecimal.lte(0))return gameDecimal(0);
  const gain=rawDecimal.times(pspMultiplier());
  addOwnerDecimal(state,"nextPsp",gain);addOwnerDecimal(state,"nextPspPreMult",gain);
  if(activeSpinGainTracker){const approx=gain.toNumber();activeSpinGainTracker.pspNext=safeAddFiniteNumber(activeSpinGainTracker.pspNext,Number.isFinite(approx)?approx:Number.MAX_VALUE)}
  return gain;
}
function ticketGain(lv){return gameDecimal(lv).times(ticketMultiplier())}

// 【目的】ブーストを積み上げて次回スピンへ適用します。
// 【処理】倍率の高い順に保持し、消費時は先頭のブーストを1回だけ減らします。
function addBoost(mult,uses){
  const d=gameDecimal(mult),count=Math.max(0,Math.floor(Number(uses)||0));
  if(d.isNan()||!d.gt(1)||count<=0)return;
  const existing=state.boosts.find(b=>gameDecimal(b.multDecimal??b.mult??1).eq(d));
  if(existing){existing.uses=Math.max(0,Number(existing.uses)||0);existing.freshUses=Math.max(0,Number(existing.freshUses)||0)+count;existing.strengthenedUses=Math.max(0,Math.min(existing.uses,Number(existing.strengthenedUses)||0));}

// 【目的】装備中・所持中のスライス情報を常に有効な状態に保ちます。
// 【処理】古いセーブに消えたIDがあっても、初期2スライスを補充してルーレットが止まらないようにします。
function sanitizeOwnedSlices(){
  // 【目的】装備中・所持中のスライスを有効なIDだけに整理し、編集時の意図しない初期スライス装備を防ぎます。
  // 【処理】Pt/Exp比率の自動補完は行わず、装備数が2未満のときだけ初期スライスで補います。枠超過は後ろから切り落とします。
  const equippedBefore=Array.isArray(state.equipped)?state.equipped.join("|"):"";
  const owned=Object.keys(state.slices||{}).filter(id=>SLICES[id]&&Number(state.slices[id])>0);
  state.sliceCollectionSeen=state.sliceCollectionSeen||{};for(const id of owned)state.sliceCollectionSeen[id]=true;
  state.slices=Object.fromEntries(owned.map(id=>[id,Math.min(SLICES[id].max,Math.max(1,Number(state.slices[id])||1))]));
  state.ownedOrder=(Array.isArray(state.ownedOrder)?state.ownedOrder:[]).filter(id=>SLICES[id]&&state.slices[id]);
  for(const id of owned)if(!state.ownedOrder.includes(id))state.ownedOrder.push(id);
  state.equipped=(Array.isArray(state.equipped)?state.equipped:[]).filter((id,i,a)=>SLICES[id]&&state.slices[id]&&a.indexOf(id)===i);
  const capacity=Math.max(2,Number(state.maxEquip)||4);
  if(state.equipped.length>capacity)state.equipped=state.equipped.slice(0,capacity);
  if(state.equipped.length<=1){for(const id of INITIAL_SLICES){if(state.equipped.length>=2)break;if(!state.slices[id]){state.slices[id]=1;if(!state.ownedOrder.includes(id))state.ownedOrder.push(id);state.sliceCollectionSeen[id]=true;}if(!state.equipped.includes(id)){state.equipped.push(id);state.sliceLoadoutFillers=Array.from(new Set([...(state.sliceLoadoutFillers||[]),id]));}}}
  if(equippedBefore!==state.equipped.join("|"))state.previousSlice=null;
}

function sliceLv(id){return Math.max(1,Number(state.slices[id])||1)}
function removeEquipped(id){state.equipped=state.equipped.filter(x=>x!==id);if(state.charged?.targets)delete state.charged.targets[id];sanitizeOwnedSlices()}

// 【目的】スピン回復タイマーを管理します。

function ensureSpinRecoveryTimer(){if(state.spins<spinMax()&&Number(state.cooldownUntil)<=gameNow())state.cooldownUntil=gameNow()+spinCooldown()*1000}

  const now=gameNow(),max=spinMax();

function spinAvailable(){return state.spins>0&&!isBlockedByChallenge("spin")}
// 【目的】自動スピンで温存する最大Spinsの割合を個別に設定できるようにします。
// 【処理】最大所持数×設定割合を切り上げた数だけ残し、それを超える所持数のときだけ自動スピンします。
function autoSpinReserveCount(){const pct=Math.max(0,Math.min(100,Number(state.settings?.autoSpinReservePercent)||0));return Math.min(spinMax(),Math.ceil(spinMax()*pct/100));}

let lastCooldownReductionAt=0;

// 【目的】ルーレットの見た目だけをCanvasへ描画します。

function rarityBrightness(hex,pos,total){const amt=Math.round((pos/Math.max(1,total-1)-.5)*22),m=hex.match(/\w\w/g).map(x=>parseInt(x,16)),p=v=>Math.max(0,Math.min(255,v+amt));return `rgb(${p(m[0])},${p(m[1])},${p(m[2])})`}
// 【目的】装備中のすべてのスライスに同じ当選確率を割り当てます。

function wheelSliceGeometry(arr=wheelDisplayEquipped||state.equipped){
  const count=Math.max(1,arr.length),width=Math.PI*2/count;

function chooseWeightedWheelIndex(geometry){const total=geometry.reduce((a,x)=>a+x.weight,0);let p=Math.random()*total;for(let i=0;i<geometry.length;i++){p-=geometry[i].weight;if(p<0)return i}return Math.max(0,geometry.length-1)}

// 【目的】指定スライスに対するブーストや特殊効果を一括で処理します。

    case"energySmall":{const cap=numberToFixedUnits(maxEnergy()),gain=multiplyFixedUnits(numberToFixedUnits(2*(lv+1)),dimensionEnGainMultiplier()),next=gameDecimal(getResourceUnits("en")).plus(gain);setResourceUnits("en",gameDecimal(next).gt(cap)?cap:next);break}
    case"miniBoost":addBoost(1.45+.05*lv,2);break;
    case"comboContinue":break;
    case"cooldownShorten":{const pct=(30+3*lv)/100;state.cooldownUntil=gameNow()+Math.max(0,Number(state.cooldownUntil)-gameNow())*(1-pct);break}
    case"quickPoint":addPtRaw(common(factor));state.cooldownUntil=gameNow()+Math.max(0,Number(state.cooldownUntil)-gameNow())*.5;break;
    case"quickExp":addExpRaw(common(factor));state.cooldownUntil=gameNow()+Math.max(0,Number(state.cooldownUntil)-gameNow())*.5;break;
    case"dupe":break;
    case"levelUp":{const availablePtUnits=getPtUnits();for(const equippedId of [...state.equipped]){const equippedSlice=SLICES[equippedId],equippedLv=sliceLv(equippedId),costUnits=sliceCostUnits(equippedId,equippedLv);if(equippedSlice&&equippedLv<equippedSlice.max&&gameDecimal(costUnits).lte(availablePtUnits))state.slices[equippedId]=equippedLv+1}break}
    case"prestigePoint":{

      const preShareUnits=gameDecimal(oldTotalUnits).gt(gameDecimal("0"))?gameDecimal((gameDecimal(preUnits).times(FIXED_POINT_SCALE))).div(oldTotalUnits):gameDecimal(0);
      const consumePreUnits=multiplyFixedUnitValues(consumeRawUnits,preShareUnits);
      subtractResourceUnits("nextPsp",consumeRawUnits);subtractResourceUnits("nextPspPreMult",consumePreUnits);
      const consumeApprox=fixedUnitsToNumber(consumeRawUnits),gainApprox=fixedUnitsToNumber(actualGainUnits);

      addResourceGainUnits("psp",actualGainUnits,["transcendence","ascension","dimensionBoost"]);

    case"energyPt":{const useUnits=gameDecimal(getResourceUnits("en")).div(gameDecimal("2"));subtractResourceUnits("en",useUnits);addPtRaw(fixedUnitsToDecimal(multiplyFixedUnits(useUnits,gameDecimal(gameDecimal(5).times(factor)).div(25).times(boostMult))));break}
    case"energyExp":{const useUnits=gameDecimal(getResourceUnits("en")).div(gameDecimal("2"));subtractResourceUnits("en",useUnits);addExpRaw(fixedUnitsToDecimal(multiplyFixedUnits(useUnits,gameDecimal(gameDecimal(5).times(factor)).div(25).times(boostMult))));break}

    case"switchPt":if(state.sliceSwitches[id]){addPtRaw(common(gameDecimal(7).times(factor)));state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;
    case"switchExp":if(state.sliceSwitches[id]){addExpRaw(common(gameDecimal(7).times(factor)));state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;
    case"switchBoost":if(state.sliceSwitches[id]){addBoost(1.7+.3*lv,3);state.sliceSwitches[id]=false}else addPtRaw(common(factor));break;

    case"respin":state.nextRespinMultiplier=Math.max(1,Number(state.nextRespinMultiplier)||1)*(1.15+.05*lv)*comboMult;break;

    case"expBurst":addExpRaw(common(gameDecimal(10).times(factor)));removeEquipped(id);break;
    case"longBoost":addBoost(1.3+.1*lv,5);break;
    case"boost":addBoost(1.6+.2*lv,3);break;
    case"shortBoost":addBoost(2.2+.3*lv,2);break;
    case"royalCard":addPtRaw(common(gameDecimal(10).times(factor)));addExpRaw(common(gameDecimal(10).times(factor)));addBoost(2,2);break;
    case"ptCombo":addPtRaw(common(factor));break;
    case"expCombo":addExpRaw(common(factor));break;

// 【目的】初回スピン時にだけプレイ時間計測を開始します。
// 【処理】初回スピンより前の起動・メニュー操作時間を除外し、各期間の開始時刻も同時に揃えます。
function startPlayClockOnFirstSpin(){if(state.playClockStarted)return;const now=gameNow();state.playClockStarted=true;state.stats.totalPlayMs=0;state.lastTick=now;for(const layer of ["rebirth","prestige","ascension","dimensionBoost","transcendence"]){if(state.period?.[layer]){state.period[layer].start=now;if("totalPlayMs" in state.period[layer])state.period[layer].totalPlayMs=0}}}

// 【目的】スピン開始時に結果スライスを確定します。
// 【処理】アニメーション終了時の角度計算でIDがずれる問題を避けるため、結果インデックスを先に保存します。
function spin(freeRespin=false,forcedRespinMultiplier=null){
  if(state.rotation){toast("スピン中です");return}
  if(!freeRespin&&!spinAvailable()){toast("スピンがありません");return}
  startPlayClockOnFirstSpin();
  activatePendingBoostUses();
  sanitizeOwnedSlices();
  wheelDisplayEquipped=[...state.equipped];
  let free=!!freeRespin;
  // 【目的】無限回帰I/IIのスピン消費回避率を加算方式で適用します。
  // 【処理】Iの20%とIIの10%を足して最大30%の単一抽選にし、独立抽選による実効28%化を防ぎます。
  const noConsumeChance=(hasTree("5-2") ? 0.20 : 0)+(hasTree("8-2") ? 0.10 : 0);
  if(!free&&Math.random()<noConsumeChance)free=true;
  if(!free)state.spins=Math.max(0,Number(state.spins)-1);
  state.currentRespinMultiplier=freeRespin?Math.max(1,Number(forcedRespinMultiplier??state.nextRespinMultiplier)||1):1;state.currentSpinIsRespin=!!freeRespin;

// 【目的】整数多項式コストの区間合計をO(1)で計算します。

function performPrestige(challengeStart=false){
  if(state.autoSimulation?.enabled&&!autoSimResetReady("prestige"))return false;

function parseTreeLoadoutText(text){
  const order=[],seen=new Set(),raw=String(text||"").trim();
  // 【目的】ノードIDをカンマで並べた短い文字列をロードアウトとして読み込みます。

// 【目的】装飾処理が重なった箇所に同じアイコンが連続表示されるのを防ぎます。
// 【処理】各要素の直下に並ぶアイコンを比較し、空白を挟んで同一画像・同一絵文字が続く場合だけ後続を削除します。
function removeDuplicateAdjacentIcons(root){
  if(!root)return;
  // 【目的】本体セーブのルーレットタブ見出しに小型Rankアイコンが再挿入されるのを防ぎます。
  // 【処理】他の装飾処理の後にも、対象summary内のRank.pngだけを最後に取り除きます。スピードラン専用セーブには適用しません。
  if(currentTab==="roulette"&&activeSaveSlot==="main"){
    if(root.matches?.("summary.collapsible-tab-section-summary"))root.querySelectorAll('img.inline-resource-icon[alt="Rank"]').forEach(img=>img.remove());
    root.querySelectorAll?.('summary.collapsible-tab-section-summary img.inline-resource-icon[alt="Rank"]').forEach(img=>img.remove());
  }
  // 【目的】カスタマイズタブ上部の折りたたみsummary直下に誤挿入される4連続画像を除去します。
  // 【処理】先頭summaryとその見出し外コンテナだけを走査し、隣接するIMGが4枚以上のまとまりを削除します。見出し内のSlices.pngは保持します。
  if(currentTab==="customize"){
    const topSummary=root.querySelector(".collapsible-tab-section-summary");
    if(topSummary){
      const containers=[topSummary,...topSummary.querySelectorAll("*")].filter(parent=>!parent.closest("h2,h3,h4,h5"));
      for(const parent of containers){
        let run=[];
        const flush=()=>{if(run.length>=4)for(const img of run)img.remove();run=[]};
        for(const child of [...parent.childNodes]){
          if(child.nodeType===1&&child.tagName==="IMG"){run.push(child);continue;}
          if(child.nodeType===3&&/^\s*$/.test(child.nodeValue||""))continue;
          flush();
        }
        flush();
      }
    }
  }
  // 【目的】見出し内に同じ資源アイコンが複数経路から挿入される問題を全タブで防ぎます。
  // 【処理】同一画像ごとに最大サイズ（同サイズなら非inline）を1つだけ残し、重複を包む空の装飾要素も除去します。
  const headingNodes=[];
  if(root.matches?.("h2,h3,h4,h5,summary,.layer-title"))headingNodes.push(root);
  root.querySelectorAll?.("h2,h3,h4,h5,summary,.layer-title").forEach(h=>headingNodes.push(h));
  for(const heading of headingNodes){
    const groups=new Map();
    for(const img of heading.querySelectorAll("img.resource-icon")){
      const src=img.getAttribute("src")||"";if(!src)continue;
      if(!groups.has(src))groups.set(src,[]);groups.get(src).push(img);
    }
    for(const imgs of groups.values()){
      if(imgs.length<2)continue;
      const score=img=>Math.max(Number(img.getAttribute("width"))||0,Number(img.getAttribute("height"))||0,parseFloat(img.style.width)||0,parseFloat(img.style.height)||0)+(img.classList.contains("inline-resource-icon")?-0.25:0);
      imgs.sort((a,b)=>score(b)-score(a));const keep=imgs[0];
      for(const duplicate of imgs.slice(1)){const wrapper=duplicate.closest(".tab-page-title-icon");if(wrapper&&wrapper.querySelectorAll("img.resource-icon").length===1)wrapper.remove();else duplicate.remove();}
    }
  }
  const parents=[root,...root.querySelectorAll("*")];
  const iconIdentity=node=>{
    if(node.nodeType!==1)return null;
    if(node.matches("img.resource-icon"))return `img:${node.getAttribute("src")||node.getAttribute("alt")||""}`;
    if(node.matches(".inline-emoji-icon"))return `emoji:${node.textContent.trim()}`;
    if(node.matches(".tab-page-title-icon,.resource-title")){
      const child=node.querySelector("img.resource-icon,.inline-emoji-icon");
      if(child?.matches("img.resource-icon"))return `img:${child.getAttribute("src")||child.getAttribute("alt")||""}`;
      if(child?.matches(".inline-emoji-icon"))return `emoji:${child.textContent.trim()}`;
    }
    return null;
  };
  for(const parent of parents){
    let previous=null;
    for(const child of [...parent.childNodes]){
      if(child.nodeType===3&&/^\s*$/.test(child.nodeValue||""))continue;
      const identity=iconIdentity(child);
      if(identity&&identity===previous){
        // resource-titleにはアイコン以外に項目名も含まれるため、重複時は画像だけを除去します。
        if(child.nodeType===1&&child.classList.contains("resource-title")){
          const duplicateIcon=child.querySelector("img.resource-icon,.inline-emoji-icon");
          if(duplicateIcon)duplicateIcon.remove();
        }else child.remove();
        continue;
      }
      previous=identity;
    }
  }
}

function autoSimChallengeEntryMetrics(c,buildKey){

  // totalPtUnits は直近のPtリセット以降の獲得量として取得済みです。全期間の開始値を再度引きません。
  const earnedSinceAscUnits=totalPtUnits;
  const ascElapsed=Math.max(0,speedrunNow()-(Number(sim.lastAscensionAt)||0)),ascSpins=Math.max(0,Number(state.period?.ascension?.spins)||0);
  const evidence=sim.challengeEvidence?.[buildKey]||{},hasEvidence=id=>!!evidence[`${id}:${L}`];

  const noPostAscReset=(Number(state.stats.totalRebirths)||0)===(Number(sim.ascensionRunStartRebirths)||0)&&(Number(state.stats.totalPrestiges)||0)===(Number(sim.ascensionRunStartPrestiges)||0);
  const rows=[];

    const n=Number(current)||0,t=Number(target)||0;
    const pct=ratio===null?(t>0?Math.max(0,Math.min(1,n/t)):met?1:0):Math.max(0,Math.min(1,Number(ratio)||0));
    rows.push({label,current:currentText===null?(/\b(?:Lv|Rank)\b/.test(label)?fmtFullCount(current):fmt(n)):String(currentText),target:targetText===null?(/\b(?:Lv|Rank)\b/.test(label)?fmtFullCount(target):fmt(t)):String(targetText),met:!!met,detail,ratio:pct});
  };
  if(c.id===1)add("最高Lv",maxLv,20+15*L);
  else if(c.id===2){const target=numberToPtUnits(`1e${5+3*L}`),met=gameDecimal(totalPtUnits).gte(target);add("累計獲得Pt",fixedUnitsToNumber(totalPtUnits),fixedUnitsToNumber(target),met,"",met?1:Math.min(1,Math.pow(10,gameDecimal(log10FixedUnits(totalPtUnits)).minus(log10FixedUnits(target)))),fmtPtUnits(totalPtUnits),fmtPtUnits(target));}
  else if(c.id===3){add("最高Lv",maxLv,35+20*L);const target=numberToPtUnits(`1e${7+3*L}`),met=gameDecimal(totalPtUnits).gte(target);add("累計獲得Pt",fixedUnitsToNumber(totalPtUnits),fixedUnitsToNumber(target),met,"",met?1:Math.min(1,Math.pow(10,gameDecimal(log10FixedUnits(totalPtUnits)).minus(log10FixedUnits(target)))),fmtPtUnits(totalPtUnits),fmtPtUnits(target));}
  else if(c.id===4)add("最高Rank",maxRank,9+6*L);
  else if(c.id===5){const target=300+75*L;add("入場判定：180秒以内の最高Lv",fastLv,target,gameDecimal(fastLv).gte(target),`今回のプレステージ中に記録されたLv`);}
  else if(c.id===6){add("最高Rank",maxRank,50+10*L);const target=numberToFixedUnits(`1e${6+2*L}`),met=gameDecimal(totalPspUnits).gte(target);add("累計獲得PsP",fixedUnitsToNumber(totalPspUnits),fixedUnitsToNumber(target),met,"",met?1:Math.min(1,Math.pow(10,gameDecimal(log10FixedUnits(totalPspUnits)).minus(log10FixedUnits(target)))),fmtFixedUnits(totalPspUnits),fmtFixedUnits(target));add("最高Lv（自動入場条件）",maxLv,300+60*L);}
  else if(c.id===101){const targetUnits=autoSimA1EntryPspThresholdUnits(L),met=gameDecimal(maxPspUnits).gte(targetUnits);add("最高PsP（自動入場条件）",fixedUnitsToNumber(maxPspUnits),fixedUnitsToNumber(targetUnits),met,`ゴール ${fmt(5000*Math.pow(20,L-1))} PsP / ハンデ指数 ${fmt(.8-.05*L)} / ×10^${L}`,met?1:Math.min(1,Math.pow(10,gameDecimal(log10FixedUnits(maxPspUnits)).minus(log10FixedUnits(targetUnits)))),fmtFixedUnits(maxPspUnits),fmtFixedUnits(targetUnits));}
  else if(c.id===102)add("最高Rank",maxRank,15+5*L);

?'ハイ&ロー':selected==='bj'?'ブラックジャック':selected==='dice'?'サイコロポーカー':'ビンゴ'}</h3>${selected==='hl'?`次のカードの数字の大小を予想するゲームです。<br>最初の3秒に使われるカードが全て表示されます。<br>その後、1枚の最初のカードが配られゲーム開始です。<br>次のカードが今のカードより大きいと思うときはHighを、<br>逆に小さいと思うときはLowを選んでください。<br>同点だった場合は何も変わらず続行します。<br>予想が当たった場合、切り上げて運を獲得するか、全部を再び賭けて2倍にするか、<br>半分だけ獲得して残った半分を倍にするか選べます。<br>数字の大きさは A&gt;K&gt;Q&gt;J&gt;10&gt;9&gt;...&gt;3&gt;2 です.`:selected==='bj'?`手札の数字が21を超える直前で止めるゲームです。<br>開始すると2枚のカードが配られます。<br>そこからさらにHitして1枚引くかStandして終了するか選べます。<br>Hitをする際は5枚の候補カードの中からランダムに引かれます。<br>Standした時の数値の合計に基づいて運を獲得します。<br>ここで扱う数値はカードの数字にのみ影響し、<br>Aは11か1, KQJは10, 残りはカードの数字と同じです.`:selected==='dice'?`5つのサイコロを振り、役を揃えるゲームです。<br>サイコロを振った後、出た役に不満があれば<br>一部またはすべてのサイコロを振りなおすことができます。<br>振り直しは振ったサイコロの個数にかかわらず3回までです.`:`ビンゴカードの数字を縦横ななめいずれかの列で揃えるゲームです。<br>開始後、3x3のカードが配られた後、当選番号を抽選します。<br>カードの数字のいずれかが当選したら、そのカードに穴が開き、穴の開いた<br>数字が1列揃うたびに配当の倍率が上がります。<br>番号は12回抽選されます。<br>このゲームは目押しができるので100%運ではありません。`}</div><div id="miniGameArea" style="margin-top:14px"></div>${selected==='bingo'?`<div class="panel" style="margin:12px 0 0"><h3>ビンゴ 配当表</h3><table><tr><th>完成ライン</th><th>配当倍率</th></tr>${[[0,0],[1,2],[2,5],[3,10],[4,20],[5,30],[6,50]].map(([lines,mult])=>`<tr><td>${lines===0?'0':lines+'ライン'}</td><td>×${mult}</td></tr>`).join('')}</table></div>`:""}${selected==='dice'?`<div class="panel" style="margin:12px 0 0"><h3>サイコロポーカー 役・配当表</h3><table><tr><th>役</th><th>成立条件</th><th>配当倍率</th></tr>${[["ファイブダイス","5個すべて同じ",50],["フォーダイス","4個が同じ",20],["ストレート","1～5 または 2～6",10],["フルハウス","3個同じ＋2個同じ",8],["スリーダイス","3個が同じ",3],["ツーペア","2組のペア",1],["ワンペア","1組のペア",0.5],["ノーペア","ペアなし",0]].map(([name,condition,mult])=>`<tr><td>${name}</td><td>${condition}</td><td>×${fmt(mult)}</td></tr>`).join("")}</table></div>`:""}${selected==='bj'?`<div class="panel" style="margin:12px 0 0"><h3 data-no-resource-icon>ブラックジャック配当表</h3><table><tr><th>合計</th><th>倍率</th></tr>${[['21',10],['20',3],['19',2],['18',1.5],['17',1.3],['16',1],['15',.8],['14以下',.5],['22以上',0]].map(([v,m])=>`<tr><td>${v}</td><td>×${ // 【目的】ミニゲームの現在状態を描画します。
// 【処理】ハイ&ロー・ブラックジャック・サイコロポーカー・ビンゴの表示を切り替え、賭け額と配当はDecimal固定小数点から表示します。
function renderMini(){
  const area=document.getElementById("miniGameArea");
  if(!area)return;
  if(currentTab==="minigame"&&state.ui.selectedMiniGame==="bingo"){
    renderBingo();
    updateMiniBasicLkText();
    return;
  }
  if(!miniState){
    if(miniResultVisible&&state.lkResult)area.innerHTML=`${state.miniResultCardsHtml||""}<div class="note mini-result">${state.lkResult}</div>`;
    else area.innerHTML="";
    updateMiniBasicLkText();
    return;
  }
  if(miniState.type==='dice'){
    const role=dicePokerRole(miniState.dice);
    const basicUnits=miniState.basicUnitsDecimal?gameDecimal(miniState.basicUnitsDecimal):numberToFixedUnits(miniState.basic||0);
    const payoutUnits=multiplyFixedUnits(basicUnits,role.mult);
    area.innerHTML=`<div class="card"><div class="row"><b>サイコロポーカー</b><span class="spacer"></span>残り振りなおし: ${miniState.rollsLeft}/3</div><div class="dice-row">${miniState.dice.map((v,i)=>`<label class="die-choice"><span class="die ${miniState.rollingDice?.includes(i)?'roll':''}">${dieFace(v)}</span><span><input type="checkbox" ${miniState.selected[i]?'checked':''} onchange="toggleDieSelection(${i},this.checked)" ${miniState.rolling||miniState.rollsLeft<=0?'disabled':''}>振りなおす</span></label>`).join('')}</div><div class="note">現在の役: <b>${role.name}</b> / 配当倍率: ×${fmt(role.mult)}<br>基本獲得Lk: ${fmtFixedUnits(basicUnits)} / 配当予定: ${fmtFixedUnits(payoutUnits)} Lk</div><div class="row"><button onclick="rerollDice()" ${miniState.rolling||miniState.rollsLeft<=0?'disabled':''}>選択したサイコロを振りなおす</button><button class="primary" onclick="dicePokerPayout()" ${miniState.rolling?'disabled':''}>配当を獲得して終了</button></div></div>`;
    return;
  }
  if(miniState.type==='hl'){
    const betText=fmtFixedUnits(miniBetUnits());
    if(miniState.stage===1){
      area.innerHTML=`<div class="card"><b>記憶タイム</b><div class="card-row">${miniState.shown.map(cardBox).join('')}</div><div class="small">3秒後に伏せられます。</div></div>`;
      return;
    }
    if(miniState.stage===3){
      area.innerHTML=`<div class="card"><div class="note">${miniState.lastRoundResult||'的中！'}<br>現在の基本獲得Lk: ${betText}</div><div class="hl-reveal-pair" style="display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0">${(miniState.revealed||[]).slice(-2).map(cardBox).join('<span aria-hidden="true" style="font-size:24px;font-weight:bold">→</span>')}</div><div class="row"><button onclick="hlFinishAll()">同量のLkを獲得して終了</button><button onclick="hlContinueHalf()">半分を次に賭けて継続</button><button onclick="hlContinueDouble()">全部を次に賭けて基本獲得量×2</button></div></div>`;
      updateMiniBasicLkText();
      return;
    }
    area.innerHTML=`<div class="card"><div><b>場のカード:</b> ${cardBox(miniState.current)}</div><div>残り ${miniState.deck.length}枚</div>${miniState.lastRoundResult?`<div class="note">${miniState.lastRoundResult}</div>`:""}<div class="row"><button onclick="hlGuess('high')">High</button><button onclick="hlGuess('low')">Low</button></div></div>`;
    updateMiniBasicLkText();
    return;
  }
  if(miniState.type==='bj'){
    const v=handValue(miniState.hand);
    area.innerHTML=`<div class="card"><div><b>手札</b></div><div class="card-row">${miniState.hand.map(cardBox).join('')}</div><div>合計: <b>${v}</b></div><div><b>候補カード</b></div><div class="card-row">${miniState.candidates.map(cardBox).join('')}</div>${miniState.lastRoundResult?`<div class="note">${miniState.lastRoundResult}</div>`:""}<div class="row"><button onclick="bjHit()" ${v>=21||!miniState.candidates.length?'disabled':''}>Hit</button><button onclick="bjStand()">Stand</button></div></div>`;
    updateMiniBasicLkText();
  }
}

// 【目的】サイコロポーカーの役と配当倍率を判定します。
// 【処理】複数条件を判定し、もっとも高い配当の役を1つだけ返します。
function dicePokerRole(dice){
  const counts=[1,2,3,4,5,6].map(v=>dice.filter(d=>d===v).length).sort((a,b)=>b-a);
  const sorted=[...new Set(dice)].sort((a,b)=>a-b),straight=sorted.length===5&&(sorted.join(',')==='1,2,3,4,5'||sorted.join(',')==='2,3,4,5,6');
  if(counts[0]===5)return{name:'ファイブダイス',mult:50};
  if(counts[0]===4)return{name:'フォーダイス',mult:20};
  if(straight)return{name:'ストレート',mult:10};
  if(counts[0]===3&&counts[1]===2)return{name:'フルハウス',mult:8};
  if(counts[0]===3)return{name:'スリーダイス',mult:3};
  if(counts.filter(n=>n===2).length>=2)return{name:'ツーペア',mult:1};
  if(counts[0]===2)return{name:'ワンペア',mult:.5};
  return{name:'ノーペア',mult:0};
}
// 【目的】サイコロの目を、端末のフォントに左右されない視覚的なサイコロとして描画します。
// 【処理】CSSの3×3配置に黒い点を配置し、1～6の目を一定の見た目で表示します。
function dieFace(n){
  const points=({1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]})[Number(n)]||[4];
  return `<span class="die-face" aria-label="${Number(n)}">${Array.from({length:9},(_,i)=>`<i class="pip" style="opacity:${points.includes(i)?1:0}"></i>`).join("")}</span>`;
}
function startDicePoker(){state.miniResultCardsHtml="";
  if(!hasTree('11-1'))return toast('ツリーID11-1の解放が必要です');
  const betUnits=parseAmountUnits(state.ui.ticketBet),minBet=numberToFixedUnits(500);if(gameDecimal(betUnits).lt(minBet))return toast('サイコロポーカーの最低賭けTicketは500です');if(gameDecimal(betUnits).gt(getResourceUnits("ticket")))return toast('Ticketが足りません');
  const bet=fixedUnitsToNumber(betUnits),basicUnits=multiplyFixedUnits(betUnits,lkMultiplier());subtractResourceUnits("ticket",betUnits);state.ui.selectedMiniGame='dice';state.lkResult='';miniResultVisible=false;
  miniState={type:'dice',bet,betUnitsDecimal:betUnits.toString(),basic:fixedUnitsToNumber(basicUnits),basicUnitsDecimal:basicUnits.toString(),dice:Array.from({length:5},()=>1+Math.floor(Math.random()*6)),rollsLeft:3,selected:[false,false,false,false,false],rolling:true,rollingDice:[0,1,2,3,4]};
  save();renderMini();playSfx('spin');setTimeout(()=>runAfterUnpaused(()=>{if(miniState?.type==='dice'){miniState.rolling=false;miniState.rollingDice=[];renderMini()}}),650);
}
function toggleDieSelection(i,checked){if(!miniState||miniState.type!=='dice'||miniState.rolling)return;miniState.selected[i]=!!checked;renderMini()}
function rerollDice(){
  if(!miniState||miniState.type!=='dice'||miniState.rolling||miniState.rollsLeft<=0)return;
  const chosen=miniState.selected.map((v,i)=>v?i:-1).filter(i=>i>=0);if(!chosen.length)return toast('振りなおすサイコロを1個以上選んでください');
  miniState.rolling=true;miniState.rollingDice=[...chosen];playSfx('spin');renderMini();
  setTimeout(()=>runAfterUnpaused(()=>{if(!miniState||miniState.type!=='dice')return;for(const i of chosen)miniState.dice[i]=1+Math.floor(Math.random()*6);miniState.rollsLeft--;miniState.rolling=false;miniState.rollingDice=[];miniState.role=dicePokerRole(miniState.dice);renderMini();save()}),650);
}
function dicePokerPayout(){
  if(!miniState||miniState.type!=='dice'||miniState.rolling)return;
  const role=dicePokerRole(miniState.dice),gainUnits=multiplyFixedUnits(gameDecimal(miniState.basicUnitsDecimal||numberToFixedUnits(miniState.basic).toString()),role.mult);state.miniResultCardsHtml=captureMiniResultCards();addResourceGainUnits("lk",gainUnits,["transcendence"]);state.lkResult=`サイコロポーカー: ${role.name} ×${fmt(role.mult)} / Lk +${fmtFixedUnits(gainUnits)}`;miniState=null;miniResultVisible=true;playSfx('achievement');save();renderApp();
}

// 【目的】永続実績の現在レベル・進捗・現在効果・次の効果を一覧表示します。
// 【処理】未解放実績はDOMに含めず、解放済み実績だけをゲージ付きカードで描画します。
function achievementGaugePercent(id,value,goal,previousGoal){
  const v=achievementValueDecimal(value),g=achievementValueDecimal(goal),p=achievementValueDecimal(previousGoal);
  if(v.lte(0))return 0;
  if(g.lte(p))return v.gte(g)?100:0;
  if(id==="rank"||id==="spins"){
    // 【目的】ランク実績とスピン回数実績のゲージを、前目標から次目標までの線形進捗に統一します。
    // 【処理】(現在値－前目標)/(次目標－前目標)をDecimalで計算し、0～100%に制限します。
    const ratio=v.minus(p).div(g.minus(p)).toNumber();
    return Math.max(0,Math.min(100,Number.isFinite(ratio)?ratio*100:0));
  }
  // 【目的】ランク・スピン以外の巨大数実績は従来の対数ゲージで表示します。
  // 【処理】Decimalのlog10を使い、巨大数でもNumber変換前に比率を計算します。
  const base=p.gt(0)?p:gameDecimal(1),denominator=gameDecimal(1).plus(g.div(base)).log10();
  if(denominator.isNan()||denominator.lte(0))return v.gte(g)?100:0;
  const numerator=gameDecimal(1).plus(v.div(base)).log10(),ratio=numerator.div(denominator).toNumber();
  return Math.max(0,Math.min(100,Number.isFinite(ratio)?ratio*100:0));
}

function currencyUnlockCondition(id){
  const st=state.stats||{};
  switch(id){
    case "pt": case "exp": case "lv": case "spin": return true;
    case "rank": return (Number(state.everRank)||Number(state.rank)||0)>1;
    case "en": return resourceAtLeast("en",1);
    case "psp": return gameDecimal(getFixedField(st,"totalPsp")).gt(gameDecimal("0"))||resourceAtLeast("psp",1)||resourceAtLeast("nextPsp",1);
    case "token": return gameDecimal(getFixedField(st,"totalToken")).gt(gameDecimal("0"))||resourceAtLeast("token",1)||Number(state.rank)>=10;
    case "ticket": return gameDecimal(getFixedField(st,"totalTicket")).gt(gameDecimal("0"));
    case "lk": return gameDecimal(getFixedField(st,"totalLk")).gt(gameDecimal("0"));
    case "ctl": return gameDecimal(getFixedField(st,"totalCtl")).gt(gameDecimal("0"))||resourceAtLeast("ctl",1)||calculateCatalystGainDecimal().gt(0);
    case "es": return gameDecimal(getFixedField(st,"totalEs")).gt(gameDecimal("0"))||resourceAtLeast("es",1);
    case "dt": return gameDecimal(getFixedField(st,"totalDt")).gt(gameDecimal("0"))||resourceAtLeast("dt",1);
    default: return false;
  }
}

let automaticBackupScheduled=false;
function createAutomaticBackup(){
  if(automaticBackupScheduled)return;automaticBackupScheduled=true;
  const run=()=>{
    automaticBackupScheduled=false;
    try{
      const backups=readAutoBackups();
      for(const backup of backups)if(backup?.data)compactHeavySaveData(backup.data,{stripFullSnapshots:true});
      backups.push({createdAt:Date.now(),version:VERSION,data:snapshotCurrentState()});
      backups.sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));while(backups.length>MAX_AUTO_BACKUPS)backups.shift();
      localStorage.setItem(AUTO_BACKUP_KEY,JSON.stringify(backups));
      if(currentTab==="settings"){const panel=document.getElementById("backupPanel");if(panel)panel.outerHTML=pageBackupPanel()}
    }catch(e){console.warn("自動バックアップに失敗しました",e)}
  };
  if(typeof window.requestIdleCallback==="function")window.requestIdleCallback(run,{timeout:15000});else setTimeout(run,500);
}
